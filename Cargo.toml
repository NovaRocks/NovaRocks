chrono-tz = "0.10"
crc32c = "0.6"
datasketches = { version = "=0.5.0", default-features = false }
flatbuffers = "25.9.23"
futures = "0.3"
h2 = "0.4"
hashbrown = "0.14.5"
hex = "0.4"
