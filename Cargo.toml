# One development configuration for native tests, tools, and role binaries.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true
lto = false
codegen-units = 256
debug-assertions = true

[profile.dev.package."*"]
opt-level = 1
debug = false

# Opt-in full symbols without changing the standard development control boundary.
[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug-assertions = false

# Design: ADR-0174 (docs/adr/ADR-0174-vendored-iceberg-baseline-and-patch-policy.md)
# Design: ADR-0176 (docs/adr/ADR-0176-iceberg-rest-request-vocabulary-and-supported-server-floor.md)
# Vendored iceberg-rust 0.11 retains format/read primitives. NovaRocks owns the
# REST request vocabulary (staged-create initialization, add-schema, views),
# commit preparation and retry. Frozen requests, prepared catalog owners and
# the single publication journal own publication (see ADR-0179).
# See vendor/iceberg-0.11.0/PATCH.md for the remaining patch inventory.
[patch.crates-io]
# Only the entries below are allowed; none of them exists to meter allocations
# inside a third-party crate. Design: ADR-0170
# (docs/adr/ADR-0170-third-party-crates-are-bounded-by-public-configuration-not-forked.md)
iceberg = { path = "vendor/iceberg-0.11.0" }
# The 0.11 source-package macro is vendored without local source patches.
iceberg-property-macro = { path = "vendor/iceberg-property-macro-0.11.0" }
# The unpatched REST SDK is a connector dev-only path dependency for wire
# and Java interoperability comparison; it is absent from production closure.
# Preserve typed missing-table errors and entity-based table classification.
# See vendor/iceberg-catalog-hms-0.11.0/PATCH.md.
iceberg-catalog-hms = { path = "vendor/iceberg-catalog-hms-0.11.0" }
# Vendored to advertise and enforce negotiated COM_QUERY multi-statement /
# multi-result capability. NovaRocks consumes the negotiated bits to preserve
# fail-closed behavior for clients that did not request this protocol surface.
# See vendor/opensrv-mysql-0.7.0/PATCH.md.
opensrv-mysql = { path = "vendor/opensrv-mysql-0.7.0" }
