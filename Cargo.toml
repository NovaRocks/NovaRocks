# Design: ADR-0142 (docs/adr/ADR-0142-single-cargo-workspace-authority.md)
# Virtual workspace manifest. Internal library crates live under
# `novarocks/<name>` (datafusion-style: directory drops the `novarocks-`
# prefix, package name keeps it); the server binary lives at top-level
# `novarocks-server/` (executable is still `novarocks`).
[workspace]
resolver = "2"
members = ["novarocks-server", "novarocks-server/library", "novarocks/arrow-ipc-frame", "novarocks/catalog-application", "novarocks/connector-contract", "novarocks/coordination-contract", "novarocks/connector/iceberg", "novarocks/connector/iceberg-functions", "novarocks/connector/paimon", "novarocks/connector/starrocks", "novarocks/constant-contract", "novarocks/execution", "novarocks/execution-contract", "novarocks/failpoint", "novarocks/failure-contract", "novarocks/frontend-application", "novarocks/fs", "novarocks/function-contract", "novarocks/functions", "novarocks/local-compiler", "novarocks/local-program", "novarocks/memory", "novarocks/memory-failure", "novarocks/mv-application", "novarocks/mysql-adapter", "novarocks/trino-adapter", "novarocks/native-adapter", "novarocks/native-trust", "novarocks/parser", "novarocks/physical-plan", "novarocks/plan-codec", "novarocks/proto-codec", "novarocks/proto-models", "novarocks/query-application", "novarocks/resource-contract", "novarocks/result-contract", "novarocks/result-render", "novarocks/secret", "novarocks/spi", "novarocks/sql", "novarocks/state-store/api", "novarocks/state-store/foundationdb", "novarocks/state-store/mysql", "novarocks/state-store/runtime", "novarocks/state-store/sqlite", "novarocks/state-store/testkit", "novarocks/statistics-application", "novarocks/table-maintenance", "novarocks/task-codec", "novarocks/transport-io", "novarocks/type-contract", "novarocks/value-arrays", "novarocks/types", "novarocks/user-error", "novarocks/version", "novarocks/worker", "novarocks/workload-control", "tests/cluster-harness", "tests/datasketches-tck", "tests/sql/runner", "tests/sql/runner/library", "tests/system-test-runner", "tests/system-test-runner/cli", "tests/test-support", "tools", "tools/error-manifest"]
# Native development defaults to the server package.
default-members = ["novarocks-server"]
# Vendored upstream packages keep their own workspace and lock authority.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Aligned with Databend and RisingWave: typed failure facts are intentionally
# rich, and stack size is not a maintained goal in the current phase.
result_large_err = "allow"

[workspace.dependencies]
allocator-api2 = "0.2"
anyhow = "1"
apache-avro = "0.21"
arrow = { version = "60.1.0", features = ["chrono-tz"] }
arrow-array = { version = "60.1.0", features = ["chrono-tz"] }
arrow-buffer = "60.1.0"
arrow-cast = "60.1.0"
