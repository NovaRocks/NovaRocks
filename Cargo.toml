# Design: ADR-0142 (docs/adr/ADR-0142-single-cargo-workspace-authority.md)
# Virtual workspace manifest. Internal library crates live under
# `novarocks/<name>` (datafusion-style: directory drops the `novarocks-`
# prefix, package name keeps it); the server binary lives at top-level
# `novarocks-server/` (executable is still `novarocks`).
[workspace]
resolver = "2"
members = ["novarocks/backend", "novarocks/catalog-application", "novarocks/connector/iceberg", "novarocks/connector/iceberg-functions", "novarocks/connector/paimon", "novarocks/connector/starrocks", "novarocks/execution", "novarocks/execution-contract", "novarocks/failpoint", "novarocks/frontend", "novarocks/fs", "novarocks/functions", "novarocks/memory", "novarocks/memory-arrow", "novarocks/native-trust", "novarocks/parser", "novarocks/plan-codec", "novarocks/proto-codec", "novarocks/proto-models", "novarocks/query-application", "novarocks/secret", "novarocks/spi", "novarocks/sql", "novarocks/state-store/api", "novarocks/state-store/runtime", "novarocks/state-store/testkit", "novarocks/state-store/sqlite", "novarocks/state-store/foundationdb", "novarocks/state-store/mysql", "novarocks/task-codec", "novarocks/types", "novarocks/user-error", "novarocks/version", "novarocks/worker", "novarocks/workload-control", "novarocks-server", "tests/cluster-harness", "tests/datasketches-tck", "tests/system-test-runner", "tests/test-support", "tests/sql/runner", "tools", "tools/arrow-pool-bench", "tools/connector-binding-bench", "tools/datasketches-bench", "tools/error-manifest"]
# Native development defaults to the server package.
default-members = ["novarocks-server"]
# Vendored upstream packages keep their own workspace and lock authority.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
anyhow = "1"
# The `pool` feature is a process-level semantic switch, not one consumer's
# option: it adds a reservation to every `Bytes` and `MutableBuffer` in the
# build, so enabling it anywhere but here would leave a single-crate test or a
# benchmark observing different buffer behaviour from the shipping binary. It
# is what lets `novarocks-memory-arrow` bind a charge to a buffer's real
# backing. Design: ADR-0148
# (docs/adr/ADR-0148-process-memory-capacity-authority.md).
arrow = { version = "58.2.0", features = ["pool"] }
arrow-array = { version = "58.2.0", features = ["pool"] }
arrow-buffer = { version = "58.2.0", features = ["pool"] }
arrow-schema = "58.2.0"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
bytes = "1"
chrono = "0.4"
crc32c = "0.6"
datasketches = { version = "=0.5.0-rc.1", default-features = false }
futures = "0.3"
h2 = "0.4"
hex = "0.4"
hmac = "0.12"
http = "1"
hyper-util = "0.1"
libc = "0.2"
md-5 = "0.10"
mysql = "25.0.1"
num-traits = "0.2"
once_cell = "1.19"
opendal = "0.55"
paimon = { version = "=0.3.0", default-features = false }
parquet = "58.2.0"
prometheus = "0.13"
prost = "0.13"
prost-build = "0.13"
prost-reflect = "0.14"
protoc-bin-vendored = "3"
rand = "0.8"
rcgen = "0.13"
regex = "1.10"
reqwest = { version = "0.12", default-features = false }
roaring = "0.10"
rustls = { version = "0.23", default-features = false }
ryu = "1"
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = "1"
tokio-stream = "0.1"
toml = "0.8"
tonic = "0.12"
tonic-build = "0.12"
tower = "0.5"
tracing = "0.1"
url = "2"
uuid = "1.8"

# Internal dependency identities are rooted here; consumers retain dependency
# kind, target, optionality, and feature selection.
novarocks-backend = { path = "novarocks/backend", version = "0.1.0" }
novarocks-catalog-application = { path = "novarocks/catalog-application", version = "0.1.0" }
novarocks-cluster-harness = { path = "tests/cluster-harness", version = "0.1.0" }
novarocks-connector-iceberg = { path = "novarocks/connector/iceberg", version = "0.1.0" }
novarocks-connector-iceberg-functions = { path = "novarocks/connector/iceberg-functions", version = "0.1.0" }
novarocks-connector-paimon = { path = "novarocks/connector/paimon", version = "0.1.0" }
novarocks-connector-starrocks = { path = "novarocks/connector/starrocks", version = "0.1.0" }
novarocks-execution = { path = "novarocks/execution", version = "0.1.0" }
novarocks-execution-contract = { path = "novarocks/execution-contract", version = "0.1.0" }
novarocks-failpoint = { path = "novarocks/failpoint", version = "0.1.0", default-features = false }
novarocks-frontend = { path = "novarocks/frontend", version = "0.1.0" }
novarocks-fs = { path = "novarocks/fs", version = "0.1.0" }
novarocks-memory = { path = "novarocks/memory", version = "0.1.0" }
novarocks-memory-arrow = { path = "novarocks/memory-arrow", version = "0.1.0" }
novarocks-functions = { path = "novarocks/functions", version = "0.1.0" }
novarocks-native-trust = { path = "novarocks/native-trust", version = "0.1.0" }
novarocks-parser = { path = "novarocks/parser", version = "0.1.0" }
novarocks-plan-codec = { path = "novarocks/plan-codec", version = "0.1.0" }
novarocks-proto-codec = { path = "novarocks/proto-codec", version = "0.1.0" }
novarocks-proto-models = { path = "novarocks/proto-models", version = "0.1.0" }
novarocks-query-application = { path = "novarocks/query-application", version = "0.1.0" }
novarocks-secret = { path = "novarocks/secret", version = "0.1.0" }
novarocks-server = { path = "novarocks-server", version = "0.1.0" }
novarocks-spi = { path = "novarocks/spi", version = "0.1.0" }
novarocks-sql = { path = "novarocks/sql", version = "0.1.0" }
novarocks-state-store-api = { path = "novarocks/state-store/api", version = "0.1.0" }
novarocks-state-store-runtime = { path = "novarocks/state-store/runtime", version = "0.1.0" }
novarocks-state-store-sqlite = { path = "novarocks/state-store/sqlite", version = "0.1.0" }
novarocks-state-store-testkit = { path = "novarocks/state-store/testkit", version = "0.1.0" }
novarocks-task-codec = { path = "novarocks/task-codec", version = "0.1.0" }
novarocks-test-support = { path = "tests/test-support", version = "0.1.0" }
novarocks-types = { path = "novarocks/types", version = "0.1.0" }
novarocks-user-error = { path = "novarocks/user-error", version = "0.1.0" }
novarocks-version = { path = "novarocks/version", version = "0.1.0" }
novarocks-worker = { path = "novarocks/worker", version = "0.1.0" }
novarocks-workload-control = { path = "novarocks/workload-control", version = "0.1.0" }

[profile.dev]
opt-level = 0
debug = 2
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Balanced profile for the dev/test loop: opt-level 1 gives a large runtime
# speedup over dev (opt-level 0) while keeping compile times far below release.
# debug = 1 (line tables only) trims debug-info/link cost; codegen-units = 256
# and lto = false keep codegen highly parallel. Build with `--profile dev-opt`;
# artifacts land under target/dev-opt/.
[profile.dev-opt]
inherits = "dev"
opt-level = 1
debug = 1
incremental = true
lto = false
codegen-units = 256

# Vendored iceberg-rust 0.9 with two visibility patches that allow downstream
# crates to implement custom Transaction actions (TransactionAction trait + the
# TableCommit::builder().build() method). Required by NovaRocks RowDeltaCommit
# and OverwriteCommit (Plan Tasks 9 / 10) until upstream ships native RowDelta
# and OverwriteFiles actions. See vendor/iceberg-0.9.0/PATCH.md for the diff.
[patch.crates-io]
iceberg = { path = "vendor/iceberg-0.9.0" }
# Vendored to add Iceberg view REST endpoints (create/load/commit/drop/
# exists/list) that upstream 0.9.0 does not implement. See
# vendor/iceberg-catalog-rest-0.9.0/PATCH.md.
iceberg-catalog-rest = { path = "vendor/iceberg-catalog-rest-0.9.0" }
# Vendored to add a `PrimitiveType::Variant` match arm. The vendored iceberg's
# PATCH 6 adds that enum member (Iceberg v3 variant), which is not additive for
# the crate's exhaustive Hive type match, so crates.io 0.9.0 won't compile
# against it. See vendor/iceberg-catalog-hms-0.9.0/PATCH.md.
iceberg-catalog-hms = { path = "vendor/iceberg-catalog-hms-0.9.0" }
paimon = { path = "vendor/paimon-0.3.0" }
