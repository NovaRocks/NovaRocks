[package]
name = "novarocks-cluster-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
h2.workspace = true
http.workspace = true
hmac.workspace = true
libc.workspace = true
mysql.workspace = true
novarocks-test-support.workspace = true
novarocks-failpoint = { workspace = true, features = ["typed"] }
novarocks-native-trust.workspace = true
novarocks-execution-contract.workspace = true
novarocks-task-codec.workspace = true
novarocks-proto-codec.workspace = true
novarocks-proto-models.workspace = true
novarocks-result-contract.workspace = true
percent-encoding.workspace = true
prost.workspace = true
novarocks-secret.workspace = true
novarocks-types.workspace = true
reqwest = { workspace = true, features = ["blocking", "http2", "json", "rustls-tls"] }
rcgen.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
time = { version = "0.3", features = ["parsing"] }
toml.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream.workspace = true
tower.workspace = true

[package.metadata.novarocks.test]
runtime-inputs = ["tools/ci/fixtures/system-scenarios-base.toml", "docker/iceberg-rest/*.sh", "docker/iceberg-rest/*.py", "docker/iceberg-rest/templates/**", "docker/iceberg-rest/spark/Dockerfile", "docker/fixture-inputs/*.sh", "docker/fixture-inputs/*.py", "docker/fixture-inputs/lock.json", "tests/fixtures/iceberg-rest-publication/**", "target/debug/build/novarocks-test-support-*/out/novarocks-test-monitor"]
env-inputs = [{ name = "NOVAROCKS_BIN", kind = "file-content" },{ name = "PATH", kind = "value" },{ name = "LANG", kind = "value" },{ name = "LC_ALL", kind = "value" },{ name = "SSL_CERT_FILE", kind = "file-content" },{ name = "DOCKER_CONTEXT", kind = "value" },{ name = "DOCKER_HOST", kind = "value" },{ name = "DOCKER_TLS_VERIFY", kind = "value" },{ name = "DOCKER_CERT_PATH", kind = "value" },{ name = "DOCKER_CONFIG", kind = "value" },{ name = "NOVA_FIXTURE_STORE", kind = "value" },{ name = "HOME", kind = "value" },{ name = "XDG_CACHE_HOME", kind = "value" }]
ignored = [
  { filter = "test(=tests::native_proxy_cluster_keeps_advertisement_across_process_restarts)", class = "heavy", requires = ["binary:novarocks"], reason = "requires NOVAROCKS_BIN pointing to a built native server" },
  { filter = "test(=isolated_iceberg_rest::tests::publication_hook_is_selected_before_the_private_rest_service_starts)", class = "heavy", requires = ["fixture:docker", "fixture:iceberg-rest", "fixture:minio"], reason = "requires Docker and locally provisioned REST and Spark base images" },
  { filter = "test(=isolated_iceberg_rest::tests::an_empty_table_is_provisioned_through_the_rest_catalog_alone)", class = "heavy", requires = ["fixture:docker", "fixture:iceberg-rest", "fixture:minio"], reason = "requires Docker; starts an isolated Iceberg REST and MinIO project" },
]
