[package]
name = "novarocks-sql-test-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "novarocks-sql-test"
autobins = false

[[bin]]
name = "novarocks-sql-test"
path = "src/bin/novarocks-sql-test.rs"

[[bin]]
name = "novarocks-sql-benchmark"
path = "src/bin/novarocks-sql-benchmark.rs"

[[bin]]
name = "publication-catalog-fixture"
path = "src/bin/publication-catalog-fixture.rs"

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
mysql.workspace = true
novarocks-cluster-harness.workspace = true
novarocks-failpoint.workspace = true
novarocks-parser.workspace = true
novarocks-sql.workspace = true
novarocks-types.workspace = true
rayon = "1.10"
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tempfile.workspace = true
opendal = { workspace = true, features = ["services-fs", "services-s3"] }
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "signal"] }

[dev-dependencies]

[lints]
workspace = true
