# Fixture endpoints are required from a generated runtime sql-test.toml.
# Run docker/iceberg-rest/up.sh and pass --config "$NOVAROCKS_SQL_TEST_CONFIG".
[cluster]
host = "127.0.0.1"
port = "9030"
user = "root"
password = ""
http_port = "8030"

[env]
url = "http://127.0.0.1:8030"

[env.iceberg]
iceberg_catalog_type = "hadoop"
iceberg_catalog_warehouse = "oss://novarocks/iceberg-catalog/"
