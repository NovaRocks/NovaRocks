[package]
name = "novarocks-sql-test-library"
version.workspace = true
edition.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "publication-catalog-fixture"
path = "src/bin/publication-catalog-fixture.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
mysql.workspace = true
novarocks-cluster-harness.workspace = true
novarocks-test-support.workspace = true
novarocks-failpoint.workspace = true
novarocks-parser.workspace = true
novarocks-types.workspace = true
rayon = "1.10"
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tempfile.workspace = true
novarocks-fs.workspace = true
novarocks-spi.workspace = true
reqwest = { workspace = true, features = ["blocking", "json", "rustls-tls"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "signal"] }

[dev-dependencies]

[lints]
workspace = true

# Native runner tests read the checked-in SQL corpus at runtime.
[package.metadata.novarocks.test]
runtime-inputs = ["tests/sql/correctness/**", "target/debug/build/novarocks-test-support-*/out/novarocks-test-monitor"]
env-inputs = [
  { name = "NOVAROCKS_BIN", kind = "file-content" },
  { name = "NOVAROCKS_FE_CONFIG", kind = "file-content" },
  { name = "NOVAROCKS_BE_CONFIG", kind = "file-content" },
  { name = "NOVAROCKS_SQL_TEST_CONFIG", kind = "file-content" },
  { name = "NOVAROCKS_STARTUP_TIMEOUT_SECS", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_TIMEOUT", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_HOST", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_PORT", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_USER", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_PASSWORD", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_MYSQL", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_REF_HOST", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_REF_PORT", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_REF_USER", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_REF_PASSWORD", kind = "value" },
  { name = "NOVAROCKS_SQL_TEST_REF_MYSQL", kind = "value" },
  { name = "NOVAROCKS_ICEBERG_REST_URI", kind = "value" },
  { name = "NOVAROCKS_ICEBERG_REST_WAREHOUSE", kind = "value" },
  { name = "NOVAROCKS_ICEBERG_HMS_URI", kind = "value" },
  { name = "NOVA_ENV_SHARED_HMS_WAREHOUSE_URI", kind = "value" },
  { name = "NOVA_ENV_SHARED_BENCHMARK_ROOT", kind = "value" },
  { name = "CATALOG_WAREHOUSE_URI", kind = "value" },
  { name = "AWS_S3_ENDPOINT", kind = "value" },
  { name = "AWS_S3_ACCESS_KEY_ID", kind = "value" },
  { name = "AWS_S3_SECRET_ACCESS_KEY", kind = "value" },
]
# Failure-artifact, retention and run-root variables locate materials only.
