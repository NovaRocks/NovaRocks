explicit_only = false

[impact]
paths = [
    "novarocks/execution/src/exec/hash_table/**",
    "novarocks/execution/src/exec/operators/aggregate/**",
    "novarocks/execution/src/exec/operators/compiled_aggregate*.rs",
    "novarocks/functions/src/builtin/aggregate*.rs",
    "novarocks/functions/src/aggregate*.rs",
    "novarocks/functions/src/aggregate_*/**",
    "novarocks/functions/src/builtin/parametric_aggregate_construction.rs",
    "novarocks/functions/src/approx_*core.rs",
    "novarocks/functions/src/exact_percentile_core.rs",
    "novarocks/functions/src/bitmap_aggregate_core.rs",
    "novarocks/functions/src/datasketches_hll.rs",
    "novarocks/functions/src/hll*.rs",
    "novarocks/local-compiler/src/aggregate.rs",
    "novarocks/functions/src/builtin/aggregate_*/**",
    "novarocks/functions/src/approx_*.rs",
    "novarocks/functions/src/exact_percentile*.rs",
    "novarocks/functions/src/percentile_*.rs",
    "novarocks/functions/src/bitmap*.rs",
    "novarocks/functions/src/datasketches*.rs",
    "novarocks/functions/src/math_numeric.rs",
    "novarocks/functions/src/largeint.rs",
    "novarocks/functions/src/lib.rs",
    "novarocks/functions/src/evaluation.rs",
    "novarocks/functions/src/kernel_input.rs",
    "novarocks/execution/src/exec/expr/compiled_program.rs",
    "novarocks/execution/src/exec/expr/compiled_program/**",
    "novarocks/functions/src/array_projection.rs",
    "novarocks/functions/src/selected_copy.rs",
    "novarocks/functions/src/selected_copy/guarded_nested.rs",
    "novarocks/functions/src/arrow_result_custody.rs",
    "novarocks/functions/src/array_backing_geometry.rs",
    "novarocks/functions/src/source_custody_resources.rs",
]

[reuse]
scope = "suite"
# Initial state and environment inputs remain undeclared; historical results are not reusable.
