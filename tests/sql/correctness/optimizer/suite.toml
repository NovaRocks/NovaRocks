explicit_only = false

# EXPLAIN snapshots declare their driver domain independently of host CPU count.
[session]
pipeline_dop = 5

[impact]
paths = [
    "novarocks/sql/src/optimizer/**",
    "novarocks/sql/src/explain/**",
    "novarocks/functions/src/evaluation.rs",
    "novarocks/functions/src/kernel_input.rs",
    "novarocks/execution/src/exec/expr/compiled_program.rs",
    "novarocks/execution/src/exec/expr/compiled_program/**",
    "novarocks/functions/src/cast.rs",
    "novarocks/frontend-application/src/query_execution/constant_eval.rs",
    "novarocks/frontend-application/src/query_execution/constant_eval/**",
    "novarocks/functions/src/arithmetic.rs",
    "novarocks/functions/src/comparison.rs",
    "novarocks/functions/src/array_projection.rs",
    "novarocks/functions/src/selected_copy.rs",
    "novarocks/functions/src/selected_copy/guarded_nested.rs",
    "novarocks/functions/src/arrow_result_custody.rs",
    "novarocks/functions/src/array_backing_geometry.rs",
    "novarocks/functions/src/source_custody_resources.rs",
    "novarocks/functions/src/cast/**",
    "novarocks/functions/src/builtin/value_conversion*.rs",
    "novarocks/functions/src/builtin/value_conversion/**",
    "novarocks/functions/src/builtin/value_conversion_kernel/**",
    "novarocks/functions/src/list_cast*.rs",
    "novarocks/functions/src/integral_decimal128.rs",
    "novarocks/functions/src/float_decimal128.rs",
    "novarocks/functions/src/decimal*.rs",
    "novarocks/functions/src/calendar_numeric.rs",
    "novarocks/functions/src/datetime_value.rs",
    "novarocks/functions/src/carrier_text.rs",
    "novarocks/functions/src/binary_text.rs",
    "novarocks/functions/src/largeint_text.rs",
    "novarocks/functions/src/date_float_cast.rs",
    "novarocks/functions/src/float_date_cast.rs",
    "novarocks/functions/src/time*_cast.rs",
    "novarocks/functions/src/temporal_carrier.rs",
    "novarocks/sql/src/compiler/fold_node.rs",
    "novarocks/sql/src/compiler/selected_scalar_call.rs",
    "novarocks/sql/src/compiler/completion_driver.rs",
    "novarocks/sql/src/compiler/mod.rs",
]

[reuse]
scope = "suite"
# Initial state and environment inputs remain undeclared; historical results are not reusable.
