explicit_only = false

[impact]
paths = ["novarocks/table-maintenance/**", "novarocks/frontend-application/src/query_execution/maintenance/**", "novarocks/frontend-application/src/table_maintenance/**",
    "novarocks/mv-application/**",
    "novarocks/execution/src/exec/mv/**",
    "docker/iceberg-rest/spark-sql.sh",
    "docker/iceberg-rest/spark-shell.sh",
    "tests/sql/fixtures/iceberg-delete-applicability/generate.scala",
    "novarocks/result-contract/**",
    "novarocks/execution/src/exec/operators/logical_change_summary.rs",
    "novarocks/execution/src/exec/operators/compiled_change_router.rs",
    "novarocks/execution/src/exec/operators/table_finish.rs",
    "novarocks/execution/src/exec/operators/table_finish/**",
    "novarocks/execution/src/runtime/task/sink.rs",
    "novarocks/spi/src/connector/write_stack/**",
    "novarocks/native-adapter/src/root_write_commit_codec.rs",
    "novarocks/native-adapter/src/compiled_writer_binding.rs",
    "novarocks/frontend-application/src/query_execution/write_result.rs",
    "novarocks/frontend-application/src/task_execution/completion.rs",
    "novarocks/frontend-application/src/task_execution/protocol_facts.rs",
    "novarocks/frontend-application/src/task_execution/manifest_round.rs",
]

[reuse]
scope = "suite"
# The fixture is private, but external Spark scripts and their environment are not fully bound by the current SQL input contract.
# Initial state and environment inputs remain undeclared; historical results are not reusable.
