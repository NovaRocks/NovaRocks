x-owner-labels: &owner-labels
  novarocks.fixture.owner: ${NOVA_FIXTURE_OWNER}
  novarocks.fixture.key: ${NOVA_FIXTURE_KEY}
  novarocks.fixture.kind: ${NOVA_FIXTURE_KIND}
services:
  minio:
    image: ${MINIO_IMAGE:?provisioned image required}
    pull_policy: never
    labels: *owner-labels
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${NOVA_ENV_MINIO_PORT}:9000'
      - '${NOVA_ENV_MINIO_CONSOLE_PORT}:9001'
    volumes: [minio-data:/data]
    networks:
      iceberg_net:
        aliases: [warehouse.minio, novarocks.minio]
  mc-init:
    image: ${MC_INIT_IMAGE:?provisioned image required}
    pull_policy: never
    labels: *owner-labels
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: [/bin/sh, -c]
    command:
      - >-
        until mc alias set store http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done;
        mc mb --ignore-existing store/warehouse && mc mb --ignore-existing store/novarocks
    networks: [iceberg_net]
  mc:
    image: ${MC_IMAGE:?provisioned image required}
    pull_policy: never
    labels: *owner-labels
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: [/bin/sh]
    command: [-c, 'exit 0']
    networks: [iceberg_net]
volumes:
  minio-data:
    labels: *owner-labels
networks:
  iceberg_net:
    name: ${NOVA_FIXTURE_PROJECT}_iceberg_net
    labels: *owner-labels
