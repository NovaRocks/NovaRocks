# Test fixtures never pull during a run: every service uses the image already
# in this host's store, and a missing image is a reported failure instead of a
# download. Import pinned images ahead of time (see this directory's README).
services:
  mysql:
    image: mysql:8.4.10@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
    pull_policy: never
    environment:
      MYSQL_ROOT_PASSWORD: "${NOVA_MYSQL_PROVISIONER_PASSWORD:-cleanup-placeholder}"
    command:
      - --default-storage-engine=InnoDB
      - --default-time-zone=+00:00
      - --innodb-page-size=16384
      - --innodb-default-row-format=DYNAMIC
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - "${NOVA_MYSQL_PORT}:3306"
    volumes:
      - "${NOVA_MYSQL_RUNTIME_DIR}/data:/var/lib/mysql"
      - type: bind
        source: "${NOVA_MYSQL_RUNTIME_DIR}/provisioner.cnf"
        target: /run/secrets/novarocks-mysql-provisioner.cnf
        read_only: true
      - type: bind
        source: "${NOVA_MYSQL_RUNTIME_DIR}/provider.cnf"
        target: /run/secrets/novarocks-mysql-provider.cnf
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=socket --silent"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s

  runtime-cleaner:
    image: mysql:8.4.10@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
    pull_policy: never
    profiles:
      - cleanup
    user: "0:0"
    network_mode: none
    volumes:
      - "${NOVA_MYSQL_RUNTIME_DIR}/data:/var/lib/mysql"
    entrypoint:
      - /bin/sh
      - -eu
      - -c
    command:
      - rm -rf -- /var/lib/mysql/* /var/lib/mysql/.[!.]* /var/lib/mysql/..?*
