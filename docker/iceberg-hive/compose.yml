# The catalog network is attached only through fixture_runtime consumer APIs.
x-labels: &labels
  novarocks.fixture.owner: ${NOVA_FIXTURE_OWNER}
  novarocks.fixture.key: ${NOVA_FIXTURE_KEY}
  novarocks.fixture.kind: hms
services:
  hms:
    image: ${HMS_IMAGE:?local HMS image required}
    pull_policy: never
    labels: *labels
    environment:
      SERVICE_NAME: metastore
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionURL=jdbc:derby:/opt/hive/data/metastore_db;create=true
        -Dhive.metastore.warehouse.dir=${NOVA_HMS_WAREHOUSE}
    ports: ['127.0.0.1:${NOVA_ENV_HMS_PORT}:9083']
    volumes:
      - metastore:/opt/hive/data
      - ${NOVA_HMS_CONFIG}:/opt/hive/conf/core-site.xml:ro
volumes:
  metastore:
    labels: *labels
networks:
  default:
    labels: *labels
