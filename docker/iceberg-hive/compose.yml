# Test fixtures never pull during a run: every service uses the image already
# in this host's store, and a missing image is a reported failure instead of a
# download. Import pinned images ahead of time (see this directory's README).
services:
  hms:
    image: ${HMS_IMAGE:-novarocks/hive-metastore:4.0.0}
    build:
      context: .
    pull_policy: never
    environment:
      SERVICE_NAME: metastore
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-admin123}
      AWS_REGION: us-east-1
    ports:
      - "${NOVA_ENV_HMS_PORT:-9083}:9083"
    networks:
      iceberg_rest_net:
        aliases:
          - hms

networks:
  iceberg_rest_net:
    external: true
    name: ${NOVA_ENV_REST_NETWORK:-nr-iceberg-rest_iceberg_net}
