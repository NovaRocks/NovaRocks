# Test fixtures never pull during a run: every service uses the image already
# in this host's store, and a missing image is a reported failure instead of a
# download. Import pinned images ahead of time (see this directory's README).
services:
  foundationdb:
    image: foundationdb/foundationdb:7.3.69
    pull_policy: never
    platform: linux/amd64
    environment:
      FDB_CLUSTER_FILE: "${NOVA_FDB_CONTAINER_CLUSTER_FILE}"
      FDB_NETWORKING_MODE: container
    ports:
      - "${NOVA_FDB_PORT}:${NOVA_FDB_PORT}/tcp"
    volumes:
      - ./runtime/${NOVA_FDB_ENV_ID}/data:/var/fdb/data
      - ./runtime/${NOVA_FDB_ENV_ID}/logs:/var/fdb/logs
      - type: bind
        source: "${NOVA_FDB_CLUSTER_FILE}"
        target: "${NOVA_FDB_CONTAINER_CLUSTER_FILE}"
        read_only: true
    # The stock container entrypoint publishes its private container address in
    # container mode. Publish the mapped loopback address explicitly so the
    # generated host cluster file remains usable on Docker Desktop and Linux.
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        exec fdbserver
        --cluster-file ${NOVA_FDB_CONTAINER_CLUSTER_FILE}
        --listen-address 0.0.0.0:${NOVA_FDB_PORT}
        --public-address 127.0.0.1:${NOVA_FDB_PORT}
        --datadir /var/fdb/data
        --logdir /var/fdb/logs
        --locality-zoneid=${NOVA_FDB_ENV_ID}
        --locality-machineid=${NOVA_FDB_ENV_ID}
        --class unset
