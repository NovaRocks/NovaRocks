syntax = "proto3";

import "connector_common.proto";

// NovaRocks-native connector write carriers.
//
// A logical writer handle travels FE -> BE and a commit fragment travels
// BE -> FE. Each carrier exposes only a purpose-tagged encoded payload. The
// selected provider owns its private schema, validates its exact catalog
// generation and codec revision, and constructs the provider domain value.
// The generic engine only moves and bounds these envelopes.
package novarocks.connector_write;

message ConnectorWriterHandle {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

message ConnectorCommitFragment {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}
