syntax = "proto3";

// NovaRocks-native FE<->BE gRPC contract. Top-level package `novarocks` is the
// RPC-envelope package (service + envelope messages only). Domain messages move
// to novarocks.{plan,expr,filter,common} subpackages in NIDL-1/2/3.
//
// Discipline: tag numbers are append-only; comments document semantics and
// RPC/message owner paths where applicable.
package novarocks;

import "common.proto";
import "catalog.proto";
import "connector_read.proto";
import "filter.proto";
import "plan.proto";

// FE<->BE control + data-plane RPC surface. One service, all cluster-internal
// traffic. Server: novarocks/backend/src/rpc/server.rs. Clients: the frontend
// adapters under novarocks/frontend/src/native/. A query becomes work on a
// backend only through ApplyTaskOperations, and a task's terminal is its own
// status, read back through SubscribeTaskStatus and GetFinalTaskInfo.
service NovaRocksGrpc {
  // Streaming exchange shuffle: sender streams chunk payloads to a receiver
  // fragment instance. Producer: src/service/exchange_sender.rs. Consumer:
  // src/service/grpc_server.rs -> src/runtime/exchange.rs.
  rpc Exchange(stream ExchangeRequest) returns (stream ExchangeResponse);
  // Single-message exchange path used by the current gRPC sender.
  rpc ExchangeUnary(ExchangeRequest) returns (ExchangeResponse);
  // Native runtime-filter envelope propagation.
  rpc TransmitRuntimeFilterEnvelope(novarocks.filter.RuntimeFilterEnvelope)
      returns (novarocks.filter.RuntimeFilterEnvelopeResponse);
  // Coordinator polls a fragment instance for result batches.
  rpc FetchResult(FetchResultRequest) returns (FetchResultResponse);
  // Coordinator publishes one complete catalog reachability snapshot. This is
  // best effort cache management and never carries a retire delta.
  rpc PruneCatalogs(novarocks.catalog.PruneCatalogsRequest)
      returns (novarocks.catalog.PruneCatalogsResponse);
  // Backend registration lease. The FE verifies the claimed endpoint through
  // the separate FE-pull Heartbeat path before the backend is eligible.
  rpc AnnounceBackend(AnnounceBackendRequest) returns (AnnounceBackendResponse);
  // FE-pull cluster heartbeat (unary). Consumer: src/runtime/heartbeat_mgr.rs.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Native task protocol. One batched mutation entry, two typed observation
  // reads, one status subscription, and the root result data plane.
  //
  // The batch is a transport convenience only: each item carries its own
  // identity and deadline and gets its own receipt, and a partial failure
  // leaves every other item exactly as its own receipt reports.
  rpc ApplyTaskOperations(ApplyTaskOperationsRequest)
      returns (ApplyTaskOperationsResponse);
  // One logical query-by-backend subscription. Observation only: it creates
  // nothing, freezes no task set, and owns no admission or cancel authority.
  // A dropped stream is resubscribed by cursor and never abandons a task.
  rpc SubscribeTaskStatus(SubscribeTaskStatusRequest)
      returns (stream TaskStatusStreamEvent);
  // Dynamic filter payloads travel here rather than in a status, so a large
  // filter cannot inflate the lifecycle channel.
  rpc FetchTaskDynamicFilters(FetchTaskDynamicFiltersRequest)
      returns (FetchTaskDynamicFiltersResponse);
  rpc GetFinalTaskInfo(GetFinalTaskInfoRequest)
      returns (GetFinalTaskInfoResponse);
  // Root result poll, fenced against an exact task and backend process.
  rpc FetchTaskResult(FetchTaskResultRequest) returns (FetchResultResponse);
}

// Immutable identity for one physical execution attempt of a logical query.
message QueryExecutionId {
  novarocks.common.UniqueId query_id = 1;
  uint64 attempt_id = 2;
}

message QueryControlEndpoint {
  string host = 1;
  uint32 port = 2;
}

message BackendProcessId {
  bytes value = 1;  // exactly 16 non-nil UUID-v7 bytes
}

message NativeCompatibilityId {
  bytes value = 1;  // exactly 32 bytes
}

enum BackendReportedState {
  BACKEND_REPORTED_STATE_UNSPECIFIED = 0;
  BACKEND_REPORTED_STATE_RUNNING = 1;
  BACKEND_REPORTED_STATE_DRAINING = 2;
}

message BackendProcessDescriptor {
  BackendProcessId process_id = 1;
  QueryControlEndpoint endpoint = 2;
  string deployment_id = 3;
  string build_identity = 4;
  NativeCompatibilityId native_compatibility_id = 5;
}

message AnnounceBackendRequest {
  BackendProcessDescriptor descriptor = 1;
  BackendReportedState reported_state = 2;
}

message BackendAnnounceLease {
  uint64 lease_ttl_ms = 1;
}

enum BackendAnnounceRejectionReason {
  BACKEND_ANNOUNCE_REJECTION_REASON_UNSPECIFIED = 0;
  BACKEND_ANNOUNCE_REJECTION_DESCRIPTOR_CONFLICT = 1;
  BACKEND_ANNOUNCE_REJECTION_DEPLOYMENT_MISMATCH = 2;
}

message BackendAnnounceRejected {
  BackendAnnounceRejectionReason reason = 1;
  string safe_detail = 2;  // at most 512 UTF-8 bytes
}

message AnnounceBackendResponse {
  oneof outcome {
    BackendAnnounceLease accepted = 1;
    BackendAnnounceRejected rejected = 2;
  }
}

message RuntimeFilterContribution {
  uint32 participant_id = 1;
  novarocks.filter.RuntimeFilterQueryLifecycleOptions lifecycle = 2;
  novarocks.filter.RuntimeFilterParticipantInstall install = 3;
  reserved 4;
  reserved "contribution_digest";
}

// Secret-free, immutable metadata for one query-attempt credential lease.
// The credential value is deliberately carried only by
// CredentialLeaseSecretEnvelope on a TLS native transport; it must never be
// copied into a plan, fragment, or catalog definition.
enum CredentialLeaseProvider {
  CREDENTIAL_LEASE_PROVIDER_UNSPECIFIED = 0;
  CREDENTIAL_LEASE_PROVIDER_S3 = 1;
}

message CredentialLeaseDescriptor {
  bytes lease_id = 1;  // exactly 16 nonzero bytes
  uint64 epoch = 2;  // nonzero
  novarocks.catalog.CatalogHandle owner = 3;
  CredentialLeaseProvider provider = 4;
  // Canonical absolute s3:// prefixes, strictly sorted and unique.
  repeated string prefixes = 5;
  uint64 not_after_unix_ms = 6;  // nonzero wall-clock expiry
  bool refresh_capable = 7;
  bytes storage_access_domain_id = 8;  // exactly 32 bytes
}

// This message is confidential native wire content. Its values are accepted
// only over an authenticated TLS native transport and must be projected into
// redacted SecretValue instances by the codec before any observable use.
// It is intentionally closed: no opaque/generic bytes credential payload is
// permitted in M2 v1.
message CredentialLeaseS3SecretMaterial {
  string access_key_id = 1;
  string secret_access_key = 2;
  string session_token = 3;
  uint64 session_token_expires_at_unix_ms = 4;
}

message CredentialLeaseSecretEnvelope {
  bytes lease_id = 1;  // exactly 16 nonzero bytes
  uint64 epoch = 2;  // nonzero
  CredentialLeaseS3SecretMaterial s3 = 3;
}

// Why one backend-local query participant stood down. No message carries this
// enum any more: the RPCs that did belonged to the retired fragment lifecycle.
// It is kept because it is still the vocabulary the backend's own
// runtime-filter participant close path is driven by, from the task protocol's
// query-context host -- see `close` / `prepare_terminal_capture` in
// novarocks/backend/src/runtime_filter/participant.rs.
enum QueryTerminationReason {
  QUERY_TERMINATION_REASON_UNSPECIFIED = 0;
  QUERY_TERMINATION_COORDINATOR_ABORT = 1;
  QUERY_TERMINATION_COORDINATOR_FINALIZE = 2;
  QUERY_TERMINATION_COORDINATOR_STREAM_LOST = 3;
  QUERY_TERMINATION_COORDINATOR_HEARTBEAT_TIMEOUT = 4;
  QUERY_TERMINATION_LOCAL_FAILURE = 5;
  QUERY_TERMINATION_PRE_START_TIMEOUT = 6;
}

enum QueryTerminalRuntimeFilterChannelInstallStateV1 {
  QUERY_TERMINAL_RUNTIME_FILTER_CHANNEL_INSTALL_STATE_V1_UNSPECIFIED = 0;
  QUERY_TERMINAL_RUNTIME_FILTER_CHANNEL_INSTALL_STATE_V1_INSTALLED = 1;
}

enum QueryTerminalRuntimeFilterChannelTerminalStateV1 {
  QUERY_TERMINAL_RUNTIME_FILTER_CHANNEL_TERMINAL_STATE_V1_UNSPECIFIED = 0;
  QUERY_TERMINAL_RUNTIME_FILTER_CHANNEL_TERMINAL_STATE_V1_OPEN = 1;
  QUERY_TERMINAL_RUNTIME_FILTER_CHANNEL_TERMINAL_STATE_V1_COMPLETED = 2;
  QUERY_TERMINAL_RUNTIME_FILTER_CHANNEL_TERMINAL_STATE_V1_UNAVAILABLE = 3;
  QUERY_TERMINAL_RUNTIME_FILTER_CHANNEL_TERMINAL_STATE_V1_CANCELLED = 4;
}

enum QueryTerminalRuntimeFilterSubscriptionTerminalV1 {
  QUERY_TERMINAL_RUNTIME_FILTER_SUBSCRIPTION_TERMINAL_V1_UNSPECIFIED = 0;
  QUERY_TERMINAL_RUNTIME_FILTER_SUBSCRIPTION_TERMINAL_V1_PENDING = 1;
  QUERY_TERMINAL_RUNTIME_FILTER_SUBSCRIPTION_TERMINAL_V1_ACQUIRED = 2;
  QUERY_TERMINAL_RUNTIME_FILTER_SUBSCRIPTION_TERMINAL_V1_TIMED_OUT = 3;
  QUERY_TERMINAL_RUNTIME_FILTER_SUBSCRIPTION_TERMINAL_V1_UNAVAILABLE = 4;
  QUERY_TERMINAL_RUNTIME_FILTER_SUBSCRIPTION_TERMINAL_V1_UNSUPPORTED = 5;
  QUERY_TERMINAL_RUNTIME_FILTER_SUBSCRIPTION_TERMINAL_V1_CANCELLED = 6;
  QUERY_TERMINAL_RUNTIME_FILTER_SUBSCRIPTION_TERMINAL_V1_COMPLETED = 7;
  QUERY_TERMINAL_RUNTIME_FILTER_SUBSCRIPTION_TERMINAL_V1_COMPLETED_WITHOUT_ARTIFACT = 8;
}

message QueryTerminalRuntimeFilterChannelV1 {
  uint32 channel_binding_id = 1;
  uint32 channel_id = 2;
  QueryTerminalRuntimeFilterChannelInstallStateV1 install_state = 3;
  QueryTerminalRuntimeFilterChannelTerminalStateV1 terminal_state = 4;
  optional uint64 latest_published_logical_version = 5;
  uint64 published_count = 6;
  uint64 completed_count = 7;
  uint64 unavailable_count = 8;
  uint64 cancelled_count = 9;
}

message QueryTerminalRuntimeFilterProducerStreamV1 {
  uint32 channel_binding_id = 1;
  uint32 channel_id = 2;
  novarocks.common.UniqueId producer_fragment_instance_id = 3;
  uint32 partition_id = 4;
  optional uint64 latest_accepted_sequence = 5;
  uint64 accepted_count = 6;
  uint64 duplicate_count = 7;
  uint64 stale_count = 8;
  uint64 conflict_count = 9;
  uint64 resource_limit_count = 10;
}

message QueryTerminalRuntimeFilterTransportRouteV1 {
  uint32 channel_binding_id = 1;
  uint32 channel_id = 2;
  uint64 route_edge_id = 3;
  uint64 sent_count = 4;
  uint64 sent_bytes = 5;
  uint64 retried_count = 6;
  uint64 retried_bytes = 7;
  uint64 acked_count = 8;
  uint64 acked_bytes = 9;
  uint64 fail_open_count = 10;
  uint64 fail_open_bytes = 11;
}

message QueryTerminalRuntimeFilterScanNotEvaluatedV1 {
  uint64 unit_facts_missing = 1;
  uint64 column_facts_missing = 2;
  uint64 data_type_unsupported = 3;
  uint64 predicate_capability_unsupported = 4;
  uint64 resource_unavailable = 5;
  uint64 snapshot_unavailable = 6;
  uint64 snapshot_timed_out = 7;
  uint64 snapshot_not_published = 8;
}

message QueryTerminalRuntimeFilterConsumerV1 {
  uint32 channel_binding_id = 1;
  uint32 channel_id = 2;
  uint32 consumer_binding_id = 3;
  novarocks.common.UniqueId fragment_instance_id = 4;
  optional uint64 latest_delivered_logical_version = 5;
  optional uint64 latest_applied_logical_version = 6;
  QueryTerminalRuntimeFilterSubscriptionTerminalV1 subscription_terminal = 7;
  uint64 row_evaluations = 8;
  uint64 input_rows = 9;
  uint64 output_rows = 10;
  uint64 scan_evaluated = 11;
  uint64 scan_kept = 12;
  uint64 scan_pruned = 13;
  uint64 scan_not_evaluated = 14;
  QueryTerminalRuntimeFilterScanNotEvaluatedV1 scan_not_evaluated_reasons = 15;
}

// Process-neutral, canonical participant-local runtime-filter observation.
// Every repeated section is interpreted as a sorted unique keyed set.
message QueryTerminalProfileContributionV1 {
  uint32 version = 1;
  repeated QueryTerminalRuntimeFilterChannelV1 channels = 2;
  repeated QueryTerminalRuntimeFilterProducerStreamV1 producer_streams = 3;
  repeated QueryTerminalRuntimeFilterTransportRouteV1 transport_routes = 4;
  repeated QueryTerminalRuntimeFilterConsumerV1 consumers = 5;
}

// P2 telemetry is always explicit: it is either the complete value or a
// stable reason why the value was unavailable. It is never represented by an
// empty telemetry payload.
message TerminalTelemetryUnavailable {
  string stage = 1;
  string code = 2;
}

message QueryTerminalProfileContributionTelemetry {
  oneof telemetry {
    QueryTerminalProfileContributionV1 available = 1;
    TerminalTelemetryUnavailable unavailable = 2;
  }
}

// One exchange shuffle chunk in flight from a sender to a receiver instance.
message ExchangeRequest {
  int64 finst_id_hi = 1;   // receiver fragment-instance id, high 64 bits
  int64 finst_id_lo = 2;   // receiver fragment-instance id, low 64 bits
  int32 node_id = 3;       // destination exchange node id within the fragment
  int32 sender_id = 4;     // sender ordinal (for per-sender EOS tracking)
  int32 be_number = 5;     // sender BE ordinal
  bool eos = 6;            // true on this sender's final message
  int64 sequence = 7;      // monotonic per-sender sequence for ordering/ack
  bytes payload = 8;       // NRX1-framed Arrow IPC chunk (src/runtime/exchange.rs)
  int64 source_finst_id_hi = 9;
  int64 source_finst_id_lo = 10;
  uint32 sender_ordinal = 11;
  uint32 sender_count = 12;
}

// Ack for one ExchangeRequest.
message ExchangeResponse {
  int64 ack_sequence = 1;                 // sequence value accepted for this request
  novarocks.common.Status status = 2;     // native exchange handler status; code 0 == OK
}

// Native per-instance fragment parameters. Complements the static PlanFragment
// carried by StageFragment.plan.
message InstanceParams {
  novarocks.common.UniqueId query_id = 1;
  novarocks.common.UniqueId fragment_instance_id = 2;
  int32 backend_num = 3;
  map<int32, ScanRangeList> per_node_scan_ranges = 4;  // scan node_id -> assigned ranges
  map<int32, int32> per_exch_num_senders = 5;          // exchange node_id -> sender count
  repeated Destination destinations = 6;
  reserved 7;
  reserved "runtime_filter_params";
  QueryOptions query_options = 8;
  reserved 9;
  reserved "report_endpoint";  // removed native report control-plane field; never reuse.
  bool typed_result_sink = 10;                         // novarocks_typed_result_sink
}

message ScanRangeList {
  repeated ScanRangeParams ranges = 1;
}

message ScanRangeParams {
  ScanRange range = 1;
  optional int32 volume_id = 2;
  optional bool empty = 3;
  optional bool has_more = 4;
}

message ScanRange {
  oneof kind {
    FileScanRange file = 1;
  }
  reserved 2;
  reserved "starrocks_tablet";
}

message FileScanRange {
  string file_format = 1;  // PARQUET|ORC
  optional string full_path = 2;
  optional string relative_path = 3;
  optional int64 table_id = 4;
  int64 offset = 5;
  int64 length = 6;
  int64 file_length = 7;
  repeated IcebergDeleteFile delete_files = 8;
  optional DeletionVectorDescriptor deletion_vector_descriptor = 9;
  optional int64 first_row_id = 10;
  optional int64 data_sequence_number = 11;
  optional int64 modification_time = 12;
  optional DatacacheOptions datacache_options = 13;
  repeated int64 included_positions = 14;
  optional string serialized_split = 15;
  bool use_iceberg_jni_metadata_reader = 16;
  optional int32 change_op = 17; // internal IVM change-op value for virtual __change_op.
  map<int32, FilePruningMinMaxValue> file_pruning_min_max_values = 18; // column ordinal -> stats.
}

enum FilePruningValueKind {
  FILE_PRUNING_VALUE_KIND_UNSPECIFIED = 0;
  FILE_PRUNING_BOOL = 1;
  FILE_PRUNING_INT = 2;
  FILE_PRUNING_FLOAT = 3;
}

message FilePruningMinMaxValue {
  FilePruningValueKind value_kind = 1;
  bool has_null = 2;
  bool all_null = 3;
  optional int64 min_int_value = 4;
  optional int64 max_int_value = 5;
  optional double min_float_value = 6;
  optional double max_float_value = 7;
}

// Delete-file metadata attached to a NovaRocks file scan.
message IcebergDeleteFile {
  optional string full_path = 1;
  string file_format = 2;   // PARQUET for current consumed path.
  string file_content = 3;  // POSITION_DELETES|EQUALITY_DELETES
  optional int64 length = 4;
}

// Iceberg deletion-vector metadata attached to a NovaRocks file scan.
message DeletionVectorDescriptor {
  optional string storage_type = 1;
  optional string path_or_inline_dv = 2;
  optional int64 offset = 3;
  optional int64 size_in_bytes = 4;
  optional int64 cardinality = 5;
}

// Data cache behavior requested for a NovaRocks file scan.
message DatacacheOptions {
  optional bool enable_populate_datacache = 1;
  optional int32 priority = 2;
}

// Native runtime destination for one fragment instance.
message Destination {
  novarocks.common.UniqueId finst_id = 1;
  string endpoint = 2;  // NovaRocks gRPC runtime endpoint host:port.
  novarocks.common.UniqueId source_finst_id = 3;
  uint32 sender_ordinal = 4;
  uint32 sender_count = 5;
}

// Query options consumed by NovaRocks native runtime.
message QueryOptions {
  int32 batch_size = 1;
  int32 query_timeout = 2;
  bool enable_profile = 3;
  int32 pipeline_dop = 4;
  int64 query_mem_limit = 5;
  int32 connector_io_tasks_per_scan_operator = 6;
  optional int64 runtime_filter_scan_wait_time_ms = 7;
  optional int32 runtime_filter_wait_timeout_ms = 8;
  bool allow_throw_exception = 9;
  optional int64 group_concat_max_len = 10;
  bool enable_spill = 11;
  optional SpillOptions spill_options = 12;
  bool enable_scan_datacache = 13;
  bool enable_populate_datacache = 14;
  bool enable_datacache_async_populate_mode = 15;
  bool enable_datacache_io_adaptor = 16;
  bool enable_cache_select = 17;
  optional int32 datacache_evict_probability = 18;
  int32 datacache_priority = 19;
  int64 datacache_ttl_seconds = 20;
  int64 datacache_sharing_work_period = 21;
  int32 query_delivery_timeout = 22;
  int64 runtime_profile_report_interval = 23;
  optional bool enable_join_runtime_bitset_filter = 24;
  int64 global_runtime_filter_build_max_size = 25;
  bool orc_use_column_names = 26;
  bool enable_file_metacache = 27;
  bool enable_file_pagecache = 28;
  bool enable_parquet_reader_page_index = 29;
}

// Spill options consumed by NovaRocks native runtime.
message SpillOptions {
  int32 spill_mode = 1;  // TSpillMode
  double spill_mem_limit_threshold = 2;
  int64 spill_operator_min_bytes = 3;
  int64 spill_operator_max_bytes = 4;
  int32 spill_encode_level = 5;
  bool enable_spill_buffer_read = 6;
  int64 max_spill_read_buffer_bytes_per_driver = 7;
  int32 spill_mem_table_size = 8;
  int32 spill_mem_table_num = 9;
}

// Coordinator long-poll request for one fragment instance result stream.
message FetchResultRequest {
  novarocks.common.UniqueId finst_id = 1;  // instance to poll
  int64 max_wait_ms = 2;                   // server-side long-poll budget
}

// FetchResult response containing readiness state plus one optional Arrow IPC payload.
message FetchResultResponse {
  enum Status {
    RESULT_STATUS_UNSPECIFIED = 0;
    READY = 1;
    NOT_READY = 2;
    EOF = 3;
    ERROR = 4;
  }

  Status status = 1;             // result lifecycle state for this poll
  string message = 2;            // error detail when status == ERROR
  bytes result_arrow_ipc = 3;    // NRX1-framed Arrow IPC (sole data track)
  int64 packet_seq = 4;          // fetch packet sequence
  bool eos = 5;                  // end-of-stream marker
}

// FE-pull heartbeat request. Consumer: src/runtime/heartbeat_mgr.rs.
message HeartbeatRequest {
  reserved 1, 2;
  reserved "assigned_be_id", "fe_epoch";
  BackendProcessId expected_process_id = 3;
}

// BE heartbeat state returned to the FE poller.
message HeartbeatResponse {
  reserved 1, 2, 4;
  reserved "start_epoch", "version", "status_code";
  uint32 num_cores = 3;    // available cores for scheduling
  BackendProcessDescriptor descriptor = 5;
  BackendReportedState reported_state = 6;
  AdmissionEpochCapability admission_epoch_capability = 7;
}

// ============================================================================
// Native task protocol.
//
// Eight typed operations plus one logical status subscription are the whole
// control and observation surface of a task; the root result keeps its own
// data plane. Every operation carries its own identity and deadline and
// produces its own receipt, so batching several onto one wire request never
// gives them shared atomicity, a shared revision, or a shared success.
//
// Every bound stated in a comment here is enforced at the central codec
// boundary, before anything walks the contents.
// ============================================================================

// Process-lifetime identity of one frontend process. It fences query context
// ownership across frontend restarts. It is not a health proof: application
// liveness is carried by QueryExecutionLeaseGrant.
message FrontendProcessId {
  bytes value = 1;  // exactly 16 non-nil UUID-v7 bytes
}

// Identity of one protocol operation. An unknown transport outcome is resolved
// by replaying the exact same immutable request under the same id; replaying
// different content under one id is a conflict, never an update.
message TaskOperationId {
  bytes value = 1;  // exactly 16 non-nil UUID-v7 bytes
}

// Opaque identity of one worker-local query-context admission grant. Capacity,
// ownership, and expiry are bound by the acquisition receipt, not encoded in
// the identity.
message AdmissionTicketId {
  bytes value = 1;  // exactly 16 nonzero unpredictable nonce bytes
}

// Opaque worker-local admission issuance epoch. It is published by the
// authenticated heartbeat and rotated whenever retired acquisition history is
// reclaimed. A sealed epoch permits retained exact replay only.
message AdmissionEpochCapability {
  bytes value = 1;  // exactly 16 nonzero unpredictable nonce bytes
}

// The indivisible wire identity of one task. Every component is compared
// exactly. Because the backend process is part of it, a restarted backend that
// reuses an endpoint can never accept or impersonate a request minted for its
// predecessor.
message TaskIdentity {
  QueryExecutionId query_execution_id = 1;
  uint32 stage_id = 2;  // nonzero, never reused inside one query execution
  uint32 task_id = 3;   // nonzero, never reused inside one stage
  BackendProcessId backend_process_id = 4;
}

// Exact reference to the shared execution context of one query on one backend
// process. A backend holds at most one context per reference, and a backend
// carrying no task never establishes one.
message QueryContextRef {
  QueryExecutionId query_execution_id = 1;
  FrontendProcessId frontend_process_id = 2;
  BackendProcessId backend_process_id = 3;
}

// Identity and deadline carried by every operation. max_wait is a duration,
// never a cross-host absolute deadline: the backend clamps it to its own
// configured cap and times it from its own monotonic clock on arrival.
message TaskOperationEnvelope {
  TaskOperationId operation_id = 1;
  uint64 max_wait_millis = 2;  // nonzero, <= 300000
}

// How a producer distributes rows across one edge's frozen destination set.
enum ExchangePartitioning {
  EXCHANGE_PARTITIONING_UNSPECIFIED = 0;
  EXCHANGE_PARTITIONING_UNPARTITIONED = 1;
  EXCHANGE_PARTITIONING_RANDOM = 2;
  EXCHANGE_PARTITIONING_HASH = 3;
  EXCHANGE_PARTITIONING_BUCKET_SHUFFLE_HASH = 4;
}

// One frozen destination of one push exchange edge.
//
// It carries both addresses on purpose. The task identity is the protocol
// fence: it is what lets an inbound frame be checked against an exact process.
// The fragment instance id is the execution kernel's key, and it is what an
// actual exchange frame carries on the wire. Freezing the one-to-one mapping
// here is what makes the two provably the same target instead of two
// independently derived guesses.
message TaskExchangeDestination {
  TaskIdentity task = 1;
  novarocks.common.UniqueId fragment_instance_id = 2;
  QueryControlEndpoint endpoint = 3;
  int32 destination_node_id = 4;  // nonnegative
  uint32 sender_ordinal = 5;      // strictly below sender_count
  uint32 sender_count = 6;        // nonzero
}

// One frozen source of one inbound exchange node, with the same dual
// addressing as a destination.
message TaskExchangeSource {
  TaskIdentity task = 1;
  novarocks.common.UniqueId fragment_instance_id = 2;
  uint32 sender_ordinal = 3;  // exact ordinal frozen for this source
}

// One outbound push exchange edge. The destination set is frozen here and
// nowhere else: opening an edge grants send permission and can never add a
// destination.
message TaskExchangeEdge {
  uint32 edge_id = 1;             // nonzero, unique inside one topology
  int32 destination_node_id = 2;  // nonnegative; every destination must match
  ExchangePartitioning partitioning = 3;
  repeated TaskExchangeDestination destinations = 4;  // 1..=4096
}

// One inbound exchange node. The frozen source set doubles as the expected
// sender count, so the two can never disagree.
message TaskExchangeInbound {
  int32 destination_node_id = 1;          // nonnegative, unique inside one topology
  repeated TaskExchangeSource sources = 2;  // 1..=4096, no duplicate task and no
                                            // duplicate fragment instance id
}

// The complete, frozen push exchange topology of one task. Exchange membership
// is not an incremental domain: there is no operation in this protocol that
// could change it.
message TaskExchangeTopology {
  repeated TaskExchangeEdge outbound = 1;   // <= 256
  repeated TaskExchangeInbound inbound = 2; // <= 256
}

// The physical plan of one task and the per-instance parameters the execution
// kernel consumes. This is the descriptor's plan carrier, and it stays the
// stored representation of the plan: the only transport-neutral plan form in
// this engine is not a value, so there is nothing neutral to store instead.
// The central codec is the only place that reads it, and it exposes only typed
// accessors to either role.
message TaskFragmentPlan {
  novarocks.plan.PlanFragment plan = 1;
  InstanceParams instance_params = 2;
}

// The immutable creation contract of one task. It is frozen exactly once and
// compared for exact equality on every replay.
//
// The neutral protocol facts below are a validated projection of the plan
// carrier, not a second authority: the codec proves the fragment instance id,
// the parallelism, the destination set, and the per-exchange sender counts all
// agree with instance_params before either role sees the descriptor.
message TaskDescriptor {
  TaskIdentity identity = 1;
  // The execution kernel's local key, derived one-to-one from identity. It is
  // never a second wire admission identity: nothing selects a backend,
  // retries, or reaches a terminal state through it.
  novarocks.common.UniqueId fragment_instance_id = 2;
  uint32 pipeline_dop = 3;               // nonzero
  repeated int32 split_plan_nodes = 4;   // <= 1024, nonnegative, no duplicates
  TaskExchangeTopology topology = 5;
  TaskFragmentPlan fragment = 6;         // <= 16 MiB encoded
}

// One contiguous split assignment batch for one plan node. The watermark
// contract is exactly ADR-0123's: sequences are consecutive per plan node, an
// exact replay is idempotent, a gap fails closed, and nothing may follow
// no_more_splits.
message TaskSplitAssignmentDomain {
  novarocks.connector_read.SplitAssignment assignment = 1;
}

// A task-scoped dynamic filter domain. The status snapshot advertises only the
// version; this payload is delivered here or read back through
// FetchTaskDynamicFilters, never inside a status.
message TaskDynamicFilterDomain {
  uint64 version = 1;  // nonzero, strictly monotonic
  novarocks.filter.RuntimeFilterEnvelope envelope = 2;
}

// Grants send permission on edges the descriptor already froze. The only legal
// move is closed to open; this release has no close, reconfigure, or dynamic
// membership operation.
message OpenExchangeEdgesDomain {
  uint32 version = 1;             // nonzero, strictly monotonic; values may skip
  repeated uint32 edge_ids = 2;   // 1..=256, all frozen by the descriptor
}

// A closed task-scoped domain change.
message TaskDomainUpdate {
  oneof domain {
    TaskSplitAssignmentDomain split_assignment = 1;
    TaskDynamicFilterDomain dynamic_filter = 2;
    OpenExchangeEdgesDomain open_exchange_edges = 3;
  }
}

// A shared catalog binding of one query context.
message QueryContextCatalogDomain {
  uint64 version = 1;  // nonzero, strictly monotonic
  novarocks.catalog.CatalogSet catalog_set = 2;
}

// A shared dynamic filter domain of one query context.
message QueryContextSharedDynamicFilterDomain {
  uint64 version = 1;  // nonzero, strictly monotonic
  RuntimeFilterContribution contribution = 2;
}

// A credential rotation of one query context. Only the exact next epoch of the
// same lease is accepted; a gap fails closed rather than silently skipping a
// rotation.
//
// The envelopes are confidential: they are legal only on a TLS native
// transport, they take part in no digest, and they must never appear in a
// status, a final info, a receipt, a retained record, or any rendering. Same
// epoch equality is answered by the owner of the live material, never by a
// digest of it.
message QueryContextCredentialDomain {
  uint64 lease_id = 1;
  uint64 epoch = 2;  // nonzero; exactly accepted_epoch + 1 to advance
  repeated CredentialLeaseDescriptor descriptors = 3;      // <= 64
  repeated CredentialLeaseSecretEnvelope envelopes = 4;    // exactly one per descriptor
}

// A closed query-context domain change.
message QueryContextDomainUpdate {
  oneof domain {
    QueryContextCatalogDomain catalog_binding = 1;
    QueryContextSharedDynamicFilterDomain shared_dynamic_filter = 2;
    QueryContextCredentialDomain credential = 3;
  }
}

// One grant of the query execution lease. The sequence is zero for the initial
// grant carried by EstablishQueryContext and exactly one higher for every
// renewal, so a gap fails closed. valid_for is a duration: the backend clamps
// it into its accepted range and computes expiry from its own monotonic clock.
message QueryExecutionLeaseGrant {
  uint64 sequence = 1;
  uint64 valid_for_millis = 2;  // nonzero, <= 3600000; clamped to 1000..=30000
}

// Ask one worker to reserve the capacity needed to establish an exact query
// context. The duration is part of the immutable request and is echoed by the
// receipt; it is never a cross-host absolute deadline.
message AcquireQueryContextAdmissionTicketRequest {
  QueryContextRef query_context = 1;
  uint64 valid_for_millis = 2;  // nonzero, <= 3600000
  NativeCompatibilityId native_compatibility_id = 3;
  AdmissionEpochCapability admission_epoch_capability = 4;
}

// Create one task. The descriptor is a required field of this message and of
// no other: there is no optional descriptor anywhere in this protocol, so no
// request can be ambiguous about whether it creates or updates.
message CreateTaskRequest {
  QueryContextRef query_context = 1;  // query and backend must equal the
                                      // descriptor identity field for field
  TaskDescriptor descriptor = 2;
  repeated TaskDomainUpdate initial_domains = 3;  // <= 256
}

// Advance one task's own domains. This message has no descriptor field:
// creating a task and updating one are different messages, not different modes
// of one request.
message UpdateTaskRequest {
  TaskIdentity identity = 1;
  repeated TaskDomainUpdate domains = 2;  // 1..=256
}

// Create one query context and install its shared facts atomically. This is
// the only message that may create one.
//
// It deliberately carries no expected local task manifest and no task set
// digest. ReleaseQueryContext is the frontend's explicit closure statement
// instead, so a backend never has to guess whether its local task set is
// closed.
message EstablishQueryContextRequest {
  QueryContextRef query_context = 1;
  novarocks.catalog.CatalogSet catalog_set = 2;
  RuntimeFilterContribution initial_runtime_filter = 3;
  QueryContextCredentialDomain initial_credential = 4;
  QueryExecutionLeaseGrant initial_lease = 5;  // sequence must be 0
  QueryOptions query_options = 6;
  NativeCompatibilityId native_compatibility_id = 7;
  AdmissionTicketId admission_ticket_id = 8;
}

// Advance one shared domain of an existing query context. It cannot create
// one: a backend that receives it against a genuinely absent context with no
// retirement fence fails closed.
message AdvanceQueryContextDomainRequest {
  QueryContextRef query_context = 1;
  QueryContextDomainUpdate domain = 2;
}

// Renew the application lease. Only the single frontend query context owner
// sends this. No status stream, keepalive, or process announce may stand in
// for it.
message RenewQueryExecutionLeaseRequest {
  QueryContextRef query_context = 1;
  QueryExecutionLeaseGrant lease = 2;
}

// The closed command set of UpdateQueryContext.
message UpdateQueryContextRequest {
  oneof command {
    EstablishQueryContextRequest establish = 1;
    AdvanceQueryContextDomainRequest advance_domain = 2;
    RenewQueryExecutionLeaseRequest renew_lease = 3;
  }
}

// The only normal cancellation reason this release recognises. A closed
// single-reason enum is what keeps a real failure from being dressed up as a
// success-compatible cancellation.
enum TaskCancelReason {
  TASK_CANCEL_REASON_UNSPECIFIED = 0;
  TASK_CANCEL_REASON_UPSTREAM_NO_LONGER_NEEDED = 1;
}

// Stand one task down normally.
message CancelTaskRequest {
  TaskIdentity identity = 1;
  TaskCancelReason reason = 2;
}

// Why a query context and all its tasks are being forced down. Client
// cancellation, query failure, and lease expiry all take this path and produce
// ABORTED, never a success-compatible CANCELED.
enum QueryContextAbortCause {
  QUERY_CONTEXT_ABORT_CAUSE_UNSPECIFIED = 0;
  QUERY_CONTEXT_ABORT_CAUSE_QUERY_FAILED = 1;
  QUERY_CONTEXT_ABORT_CAUSE_LEASE_EXPIRED = 2;
  QUERY_CONTEXT_ABORT_CAUSE_PEER_TASK_FAILED = 3;
}

message AbortQueryContextRequest {
  QueryContextRef query_context = 1;
  QueryContextAbortCause cause = 2;
}

// Declare that no legal create can follow and close the shared context. It
// carries no task manifest and no digest: the backend verifies only what it
// can observe locally, and answers NOT_READY while anything still drains.
message ReleaseQueryContextRequest {
  QueryContextRef query_context = 1;
}

// Read one task's dynamic filter domains. This is an observation read: it
// creates nothing, advances no status, and renews no lease.
message FetchTaskDynamicFiltersRequest {
  TaskIdentity identity = 1;
  uint64 acknowledged_version = 2;  // 0 means nothing acknowledged yet
}

message FetchTaskDynamicFiltersResponse {
  TaskIdentity identity = 1;
  uint64 version = 2;  // never below the version that triggered the fetch
  repeated TaskDynamicFilterDomain domains = 3;  // <= 16 MiB encoded in total
}

// Read one terminal task's final info.
message GetFinalTaskInfoRequest {
  TaskIdentity identity = 1;
}

// One operation inside a per-backend batch.
message TaskOperation {
  TaskOperationEnvelope envelope = 1;
  oneof operation {
    CreateTaskRequest create_task = 2;
    UpdateTaskRequest update_task = 3;
    UpdateQueryContextRequest update_query_context = 4;
    CancelTaskRequest cancel_task = 5;
    AbortQueryContextRequest abort_query_context = 6;
    ReleaseQueryContextRequest release_query_context = 7;
    AcquireQueryContextAdmissionTicketRequest acquire_query_context_admission_ticket = 8;
  }
}

// A per-backend batch of operations. The batch is a transport convenience and
// nothing more: it provides no atomicity, no shared revision, and no
// batch-global success. A partial failure leaves every other item exactly as
// its own receipt reports.
message ApplyTaskOperationsRequest {
  repeated TaskOperation operations = 1;  // 1..=32, <= 48 MiB encoded
}

// The machine-readable outcome categories of one operation. Retry, failure,
// and observation recovery are decided from this category alone; nothing in
// this protocol classifies an outcome by inspecting an error message.
enum TaskOperationOutcome {
  TASK_OPERATION_OUTCOME_UNSPECIFIED = 0;
  TASK_OPERATION_OUTCOME_ACCEPTED = 1;
  TASK_OPERATION_OUTCOME_IDEMPOTENT = 2;
  TASK_OPERATION_OUTCOME_OPERATION_TIMED_OUT = 3;
  TASK_OPERATION_OUTCOME_IDENTITY_MISMATCH = 4;
  TASK_OPERATION_OUTCOME_CREATE_CONFLICT = 5;
  TASK_OPERATION_OUTCOME_CONTEXT_NOT_ESTABLISHED = 6;
  TASK_OPERATION_OUTCOME_CONTEXT_CONFLICT = 7;
  TASK_OPERATION_OUTCOME_DOMAIN_CONFLICT = 8;
  TASK_OPERATION_OUTCOME_LEASE_EXPIRED = 9;
  TASK_OPERATION_OUTCOME_RELEASE_NOT_READY = 10;
  TASK_OPERATION_OUTCOME_CONTEXT_TERMINAL_RECEIPT = 11;
  TASK_OPERATION_OUTCOME_INVALID_STATE_OR_REQUEST = 12;
  TASK_OPERATION_OUTCOME_TERMINAL_REJECTED = 13;
  TASK_OPERATION_OUTCOME_GONE = 14;
  TASK_OPERATION_OUTCOME_RESOURCE_EXHAUSTED = 15;
  // A genuinely unknown transport outcome is never a server-reported category:
  // it is what the client concludes when no receipt arrives at all.
  reserved 16;
  reserved "TASK_OPERATION_OUTCOME_RETRYABLE_TRANSPORT_UNKNOWN";
  // The request belongs to a different immutable Native compatibility island.
  // The backend proves it did not apply the operation and the frontend fails
  // the current attempt without retrying it on another process.
  TASK_OPERATION_OUTCOME_COMPATIBILITY_MISMATCH = 17;
  // Admission found an older unredeemed ticket for the same context. The new
  // operation created no grant and may retry after bounded backoff.
  TASK_OPERATION_OUTCOME_ADMISSION_TICKET_STILL_ACTIVE = 18;
}

// Per plan node, the highest sequence this task has accepted and whether that
// node has seen its terminal marker. There is deliberately no task-global
// split sequence.
message TaskSplitPlanNodeReceipt {
  int32 plan_node_id = 1;
  uint64 accepted_through_sequence = 2;
  bool no_more_splits = 3;
  optional uint64 queued_splits = 4;  // absent means not reported, never zero
}

message TaskSplitAssignmentReceipt {
  repeated TaskSplitPlanNodeReceipt nodes = 1;  // <= 1024
}

// The receipt of any scalar-versioned domain: task dynamic filter, catalog
// binding, or shared dynamic filter. A version may skip values; only strict
// monotonicity matters.
message ScalarDomainReceipt {
  uint64 accepted_version = 1;  // 0 means nothing accepted yet
}

message OpenExchangeEdgesReceipt {
  repeated uint32 opened_edge_ids = 1;  // <= 256
  uint32 accepted_version = 2;  // non-zero retained EdgeOpenVersion
}

// How one accepted domain progressed.
//
// A receipt only ever describes an applied operation, and a conflicting domain
// refuses its whole operation with TASK_OPERATION_OUTCOME_DOMAIN_CONFLICT and
// carries no acknowledgement body at all. So a conflict has no value here by
// construction, and an encoder that holds one must refuse rather than pick the
// nearest representable neighbour. APPLY and IDEMPOTENT report the requested
// token; OLDER reports the retained one, because a domain never rolls back.
enum AcceptedDomainProgression {
  ACCEPTED_DOMAIN_PROGRESSION_UNSPECIFIED = 0;
  ACCEPTED_DOMAIN_PROGRESSION_APPLY = 1;
  ACCEPTED_DOMAIN_PROGRESSION_IDEMPOTENT = 2;
  ACCEPTED_DOMAIN_PROGRESSION_OLDER = 3;
}

// The receipt of one task-scoped domain.
message TaskDomainReceipt {
  oneof receipt {
    TaskSplitAssignmentReceipt split_assignment = 1;
    ScalarDomainReceipt dynamic_filter = 2;
    OpenExchangeEdgesReceipt open_exchange_edges = 3;
  }
  AcceptedDomainProgression progression = 4;
}

// The receipt of one query-context domain. Only the accepted credential epoch
// is reported: no credential material, and no digest of any, ever appears in a
// receipt.
message QueryContextDomainReceipt {
  oneof receipt {
    ScalarDomainReceipt catalog_binding = 1;
    ScalarDomainReceipt shared_dynamic_filter = 2;
    QueryContextCredentialReceipt credential = 3;
  }
  AcceptedDomainProgression progression = 4;
}

message QueryContextCredentialReceipt {
  uint64 lease_id = 1;
  uint64 accepted_epoch = 2;
}

message QueryExecutionLeaseReceipt {
  uint64 sequence = 1;
  uint64 requested_valid_for_millis = 2;
  uint64 effective_valid_for_millis = 3;  // the only duration the frontend may
                                          // schedule its next renewal from
}

// The exact admission grant produced for one acquisition request. Repeating
// context and validity lets the receiver prove that the opaque id belongs to
// the request it sent.
message QueryContextAdmissionTicketAck {
  AdmissionTicketId ticket_id = 1;
  QueryContextRef query_context = 2;
  uint64 valid_for_millis = 3;  // nonzero, <= 3600000
}

// Acknowledgement of a task creation. Receiving it proves the task, its
// receiver, and its inbound capability are installed and the task was
// submitted as runnable: there is no separate ready state or registry. It
// carries the current status, which closes the window between creating a task
// and observing it.
message CreateTaskAck {
  TaskIdentity identity = 1;
  repeated TaskDomainReceipt accepted_domains = 2;  // <= 256
  TaskStatus current_status = 3;
}

message UpdateTaskAck {
  TaskIdentity identity = 1;
  repeated TaskDomainReceipt accepted_domains = 2;  // <= 256
}

// Lifecycle state of one query context. There is no state and no event meaning
// "every task I currently know about is terminal".
enum QueryContextState {
  QUERY_CONTEXT_STATE_UNSPECIFIED = 0;
  QUERY_CONTEXT_STATE_ESTABLISHING = 1;
  QUERY_CONTEXT_STATE_ACTIVE = 2;
  QUERY_CONTEXT_STATE_RELEASING = 3;
  QUERY_CONTEXT_STATE_ABORTING = 4;
  QUERY_CONTEXT_STATE_TERMINAL_RETAINED = 5;
  QUERY_CONTEXT_STATE_GONE = 6;
}

message QueryContextAck {
  QueryContextRef query_context = 1;
  QueryContextState state = 2;
  optional QueryExecutionLeaseReceipt lease = 3;
  repeated QueryContextDomainReceipt accepted_domains = 4;  // <= 16
  // Present once the context is terminal. It reports the shared-resource
  // lifecycle cause only; it is never a second authority over a task terminal.
  optional QueryContextAbortCause termination_cause = 5;
}

enum ReleaseQueryContextOutcome {
  RELEASE_QUERY_CONTEXT_OUTCOME_UNSPECIFIED = 0;
  RELEASE_QUERY_CONTEXT_OUTCOME_RELEASED = 1;
  // Local tasks, output, reads, or operations are still draining. Nothing was
  // applied and this does not occupy the first-wins position, so the identical
  // request may be retried once state advances.
  RELEASE_QUERY_CONTEXT_OUTCOME_NOT_READY = 2;
  RELEASE_QUERY_CONTEXT_OUTCOME_ALREADY_TERMINAL = 3;
}

message ReleaseQueryContextAck {
  QueryContextRef query_context = 1;
  ReleaseQueryContextOutcome outcome = 2;
  QueryContextState state = 3;
  optional QueryContextAbortCause termination_cause = 4;
  // This backend's terminal runtime-filter observation for this query
  // context, sealed by the release that took the participant down.
  //
  // The release is the only point at which this is a complete fact: it is the
  // backend's own statement that every local task is a terminal record and
  // nothing further will be observed. It is carried here rather than on a
  // task's final info because the participant is the context's, not any one
  // task's, and it is the same message the query terminal report carries so
  // one shape of these facts exists on the wire.
  //
  // Absent means this release installed no participant to seal -- a release
  // that found one and could not seal it reports the unavailable variant with
  // its stage and code, never an empty contribution.
  optional QueryTerminalProfileContributionTelemetry runtime_filter = 5;
}

// The receipt of exactly one operation from a batch.
message TaskOperationReceipt {
  TaskOperationId operation_id = 1;
  TaskOperationOutcome outcome = 2;
  string safe_detail = 3;               // <= 512 bytes, redacted by the producer
  optional string safe_field_path = 4;  // <= 256 bytes when present
  oneof ack {
    CreateTaskAck create_task = 5;
    UpdateTaskAck update_task = 6;
    QueryContextAck query_context = 7;
    ReleaseQueryContextAck release_query_context = 8;
    TaskStatus cancel_task = 9;
    QueryContextAdmissionTicketAck query_context_admission_ticket = 10;
  }
}

message ApplyTaskOperationsResponse {
  repeated TaskOperationReceipt receipts = 1;  // exactly one per request item,
                                               // in request order
}

// Lifecycle state of one task. The families are kept distinct on purpose: a
// task that finished executing but still owes output is FLUSHING, and a normal
// stand-down is a different terminal state from a failure and from an abort.
enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_PLANNED = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_FLUSHING = 3;
  TASK_STATE_FINISHED = 4;
  TASK_STATE_CANCELING = 5;
  TASK_STATE_CANCELED = 6;
  TASK_STATE_ABORTING = 7;
  TASK_STATE_ABORTED = 8;
  TASK_STATE_FAILING = 9;
  TASK_STATE_FAILED = 10;
}

enum TaskFailureCategory {
  TASK_FAILURE_CATEGORY_UNSPECIFIED = 0;
  TASK_FAILURE_CATEGORY_EXECUTION = 1;
  TASK_FAILURE_CATEGORY_RESOURCE_EXHAUSTED = 2;
  TASK_FAILURE_CATEGORY_EXCHANGE = 3;
  TASK_FAILURE_CATEGORY_PROTOCOL = 4;
  TASK_FAILURE_CATEGORY_INTERNAL = 5;
}

message TaskFailure {
  TaskFailureCategory category = 1;
  string safe_detail = 2;  // <= 512 bytes, redacted by the producer
}

// The cause a terminating or terminal state must carry. FINISHED carries none.
message TaskTermination {
  oneof cause {
    TaskCancelReason canceled = 1;
    QueryContextAbortCause aborted = 2;
    TaskFailure failed = 3;
  }
}

// Output facts of one task. responsibility_complete is the fact that separates
// FLUSHING from FINISHED: an operator returning end-of-stream is not enough,
// this task's output must also have been produced, consumed, or acknowledged.
message TaskOutputFacts {
  bool responsibility_complete = 1;
  optional uint64 buffered_rows = 2;   // absent means not reported, never zero
  optional uint64 buffered_bytes = 3;
}

// Resource facts of one task. Every metric is optional and absence never means
// zero: a consumer must not substitute a default or size anything from one.
message TaskResourceFacts {
  optional uint64 queued_splits = 1;
  optional uint32 running_drivers = 2;
  optional uint64 memory_reservation_bytes = 3;
  optional uint64 cpu_time_millis = 4;
}

// Writer facts of a distributed write task. Absent for a read task.
message TaskWriterFacts {
  optional uint64 written_rows = 1;
  optional uint64 written_bytes = 2;
  optional uint32 prepared_write_entries = 3;
}

// One immutable, complete status snapshot. A published version is bound to
// exactly this value: a backend may drop a coalesced non-current snapshot, but
// it may never publish a different value under a version it already used, and
// a terminal snapshot is immutable and first-wins.
message TaskStatus {
  TaskIdentity identity = 1;
  uint64 status_version = 2;  // nonzero; the CreateTaskAck snapshot is 1
  TaskState state = 3;
  optional TaskTermination termination = 4;
  // Only the latest dynamic filter version and a bounded count. The payload is
  // read separately, so a large filter can never inflate this channel.
  optional uint64 dynamic_filter_version = 5;
  optional uint32 dynamic_filter_domain_count = 6;
  TaskOutputFacts output = 7;
  TaskResourceFacts resources = 8;
  optional TaskWriterFacts writer = 9;
}

// The frontend's observation position for one task.
message TaskStatusCursor {
  TaskIdentity identity = 1;
  uint64 current_version = 2;  // 0 means never observed
}

// One logical query-by-backend subscription. It is an observation channel only:
// it creates no task and no context, freezes no task set, and owns no
// admission, edge-open, terminal, or cancel authority. A new task joins it
// automatically.
message SubscribeTaskStatusRequest {
  QueryContextRef query_context = 1;
  repeated TaskStatusCursor cursors = 2;  // <= 4096
}

// Retained state for this task was reclaimed. Inside the legal request horizon
// this cannot rebuild the task.
message TaskGone {
  TaskIdentity identity = 1;
}

// A full immutable snapshot, never a delta that depends on a previous frame.
message TaskStatusStreamEvent {
  oneof event {
    TaskStatus task_status = 1;
    TaskGone task_gone = 2;
  }
}

// One named counter an operator's own profile subtree carried.
//
// The name is an engine constant, never anything a statement supplied.
message TaskOperatorCounter {
  string name = 1;  // <= 512 bytes
  int64 value = 2;
}

// Bounded operator statistics of one final info entry.
message TaskOperatorStatistics {
  int32 plan_node_id = 1;
  string operator = 2;  // <= 512 bytes
  optional uint64 input_rows = 3;
  optional uint64 output_rows = 4;
  optional uint64 wall_time_millis = 5;
  // Every counter the operator's subtree carried beyond the three above:
  // a connector page source opened, a conjunct applied, a row group pruned.
  // Rows and time are separate fields because every operator has them; this
  // set is open, and an operator that reports nothing here reported nothing,
  // which is a different fact from a counter that did not fit.
  repeated TaskOperatorCounter counters = 6;  // <= 64
  bool counters_truncated = 7;
}

// The bounded, redacted final observation of one terminal task. It is frozen
// once and never changes, and losing it costs diagnostics only: success and
// failure are decided by TaskStatus alone.
//
// It carries no result payload, no raw split, no credential, and no commit
// fragment: each of those has its own owner and data plane.
message FinalTaskInfo {
  TaskStatus final_status = 1;  // must be terminal and identity-exact
  repeated TaskOperatorStatistics operator_statistics = 2;  // <= 4096
  // Reported explicitly rather than silently, so a missing operator is never
  // mistaken for an operator that did no work.
  bool operator_statistics_truncated = 3;
}

message GetFinalTaskInfoResponse {
  oneof result {
    FinalTaskInfo info = 1;
    // Why the info is not available: the task is not terminal yet, its
    // retention ended, or the identity does not address a task here. It is
    // never an error, because losing final info costs diagnostics only.
    TaskOperationOutcome unavailable = 2;
  }
}

// Coordinator long-poll request for the root task's result stream. Unlike the
// fragment-instance-addressed form it replaces, this is fenced against an
// exact task and backend process.
message FetchTaskResultRequest {
  TaskIdentity root_task = 1;
  uint64 max_wait_millis = 2;  // nonzero, <= 300000
  // Highest packet durably accepted into the frontend's bounded delivery
  // queue. Absent means this frontend has not accepted any packet yet. The
  // backend retains and exactly replays one unacknowledged packet; gaps and
  // future acknowledgements fail closed.
  optional uint64 acknowledged_packet_sequence = 3;
  // Positive payload-byte credit for this response. The Native codec also
  // caps this below the process-wide gRPC decode limit so the response
  // envelope cannot make a legal payload exceed that transport limit.
  uint64 max_result_bytes = 4;
}
