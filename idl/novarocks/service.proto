syntax = "proto3";

// NovaRocks-native FE<->BE gRPC contract. Top-level package `novarocks` is the
// RPC-envelope package (service + envelope messages only). Domain messages move
// to novarocks.{plan,expr,filter,common} subpackages in NIDL-1/2/3.
//
// Discipline: tag numbers are append-only; comments document semantics and
// RPC/message owner paths where applicable.
package novarocks;

import "common.proto";
import "filter.proto";
import "plan.proto";

// FE<->BE control + data-plane RPC surface. One service, all cluster-internal
// traffic. Consumers: src/service/grpc_server.rs (server), src/service/
// grpc_client.rs + src/service/grpc_fragment_dispatcher.rs (implementing the
// src/coordinator/dispatch.rs port) + src/runtime/heartbeat_mgr.rs + src/service/
// Query lifecycle clients own terminal delivery through QueryControlStream.
service NovaRocksGrpc {
  // Streaming exchange shuffle: sender streams chunk payloads to a receiver
  // fragment instance. Producer: src/service/exchange_sender.rs. Consumer:
  // src/service/grpc_server.rs -> src/runtime/exchange.rs.
  rpc Exchange(stream ExchangeRequest) returns (stream ExchangeResponse);
  // Single-message exchange path used by the current gRPC sender.
  rpc ExchangeUnary(ExchangeRequest) returns (ExchangeResponse);
  // Native runtime-filter envelope propagation.
  rpc TransmitRuntimeFilterEnvelope(novarocks.filter.RuntimeFilterEnvelope)
      returns (novarocks.filter.RuntimeFilterEnvelopeResponse);
  // Point lookup (fetch-by-key).
  rpc Lookup(novarocks.filter.LookupRequest)
      returns (novarocks.filter.LookupResponse);

  // Coordinator polls a fragment instance for result batches.
  rpc FetchResult(FetchResultRequest) returns (FetchResultResponse);
  // Coordinator establishes and owns one backend-local query attempt before
  // any native fragment is accepted.
  rpc InitQuery(InitQueryRequest) returns (InitQueryResponse);
  // Coordinator atomically prepares every fragment assigned to one participant.
  // A later StartPreparedQuery releases the participant-local start gate.
  rpc StageFragments(StageFragmentsRequest) returns (StageFragmentsResponse);
  rpc StartPreparedQuery(StartPreparedQueryRequest)
      returns (StartPreparedQueryResponse);
  rpc AbortQuery(AbortQueryRequest) returns (AbortQueryResponse);
  rpc QueryControlStream(stream QueryControlRequest)
      returns (stream QueryControlResponse);
  // BE -> FE fallback delivery for one immutable terminal participant snapshot.
  // This is not control-stream recovery and never recreates an execution attempt.
  rpc ReportQueryTerminal(ReportQueryTerminalRequest)
      returns (ReportQueryTerminalResponse);
  // Coordinator ensures a provider-owned, credential-free BE execution
  // binding and acquires its query lifecycle lease before any fragment using
  // that exact generation is submitted.
  rpc EnsureConnectorExecutionBinding(EnsureConnectorExecutionBindingRequest)
      returns (EnsureConnectorExecutionBindingResponse);
  // Best-effort resource retirement for one previously ensured execution
  // binding generation. Existing query leases may drain.
  rpc RetireConnectorExecutionBinding(RetireConnectorExecutionBindingRequest)
      returns (RetireConnectorExecutionBindingResponse);
  // FE-pull cluster heartbeat (unary). Consumer: src/runtime/heartbeat_mgr.rs.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

}

// Immutable identity for one physical execution attempt of a logical query.
message QueryExecutionId {
  novarocks.common.UniqueId query_id = 1;
  uint64 attempt_id = 2;
}

enum QueryParticipantRole {
  QUERY_PARTICIPANT_ROLE_UNSPECIFIED = 0;
  FRAGMENT_EXECUTOR = 1;
  RUNTIME_FILTER_SERVICE = 2;
}

message QueryControlEndpoint {
  string host = 1;
  uint32 port = 2;
}

message ParticipantBackendIdentity {
  uint64 backend_id = 1;
  QueryControlEndpoint endpoint = 2;
  uint64 start_epoch = 3;
}

message ExchangeRouteManifest {
  novarocks.common.UniqueId source_fragment_instance_id = 1;
  novarocks.common.UniqueId destination_fragment_instance_id = 2;
  int32 destination_node_id = 3;
  uint32 sender_ordinal = 4;
  uint32 sender_count = 5;
}

message RuntimeFilterContribution {
  uint32 participant_id = 1;
  novarocks.filter.RuntimeFilterQueryLifecycleOptions lifecycle = 2;
  novarocks.filter.RuntimeFilterParticipantInstall install = 3;
  bytes contribution_digest = 4;
}

message ParticipantManifest {
  QueryExecutionId execution_id = 1;
  ParticipantBackendIdentity backend = 2;
  repeated QueryParticipantRole participant_roles = 3;
  repeated novarocks.common.UniqueId expected_fragment_instance_ids = 4;
  QueryOptions query_options = 5;
  uint64 query_deadline_unix_ms = 6;
  repeated ExchangeRouteManifest exchange_routes = 7;
  RuntimeFilterContribution runtime_filter = 8;
  uint64 pre_start_timeout_ms = 9;
  QueryControlEndpoint report_endpoint = 10;
}

enum QueryInitOutcome {
  QUERY_INIT_OUTCOME_UNSPECIFIED = 0;
  QUERY_INIT_APPLIED = 1;
  QUERY_INIT_ALREADY_APPLIED = 2;
  QUERY_INIT_REJECTED_CONFLICT = 3;
  QUERY_INIT_REJECTED_STALE_BACKEND = 4;
  QUERY_INIT_REJECTED_CAPACITY = 5;
  QUERY_INIT_REJECTED_INVALID_MANIFEST = 6;
  QUERY_INIT_REJECTED_TERMINATED = 7;
}

enum QueryTerminationReason {
  QUERY_TERMINATION_REASON_UNSPECIFIED = 0;
  QUERY_TERMINATION_COORDINATOR_ABORT = 1;
  QUERY_TERMINATION_COORDINATOR_FINALIZE = 2;
  QUERY_TERMINATION_COORDINATOR_STREAM_LOST = 3;
  QUERY_TERMINATION_COORDINATOR_HEARTBEAT_TIMEOUT = 4;
  QUERY_TERMINATION_LOCAL_FAILURE = 5;
  QUERY_TERMINATION_PRE_START_TIMEOUT = 6;
}

message InitQueryRequest {
  ParticipantManifest manifest = 1;
  bytes init_digest = 2;
}

message InitQueryResponse {
  QueryExecutionId execution_id = 1;
  bytes init_digest = 2;
  QueryInitOutcome outcome = 3;
}

enum StageFragmentsOutcome {
  STAGE_FRAGMENTS_OUTCOME_UNSPECIFIED = 0;
  STAGE_FRAGMENTS_APPLIED = 1;
  STAGE_FRAGMENTS_ALREADY_APPLIED = 2;
  STAGE_FRAGMENTS_REJECTED_CONFLICT = 3;
  STAGE_FRAGMENTS_REJECTED_INVALID_STATE = 4;
  STAGE_FRAGMENTS_REJECTED_INVALID_BATCH = 5;
  STAGE_FRAGMENTS_REJECTED_CAPACITY = 6;
  STAGE_FRAGMENTS_REJECTED_TERMINATED = 7;
  STAGE_FRAGMENTS_REJECTED_LOCAL_FAILURE = 8;
}

enum StartPreparedQueryOutcome {
  START_PREPARED_QUERY_OUTCOME_UNSPECIFIED = 0;
  START_PREPARED_QUERY_APPLIED = 1;
  START_PREPARED_QUERY_ALREADY_STARTED = 2;
  START_PREPARED_QUERY_REJECTED_NOT_STAGED = 3;
  START_PREPARED_QUERY_REJECTED_CONFLICT = 4;
  START_PREPARED_QUERY_REJECTED_TERMINATED = 5;
}

// One static plan plus the dynamic parameters for one exact fragment instance.
message StageFragment {
  novarocks.plan.PlanFragment plan = 1;
  InstanceParams instance_params = 2;
}

// The immutable complete fragment set prepared by one lifecycle participant.
// The digest is over the canonical semantic projection, never the outer RPC
// wire bytes. An empty fragment list is valid for service-only participants.
message StageFragmentsRequest {
  QueryExecutionId execution_id = 1;
  bytes init_digest = 2;
  uint32 stage_digest_version = 3;
  bytes stage_digest = 4;
  repeated StageFragment fragments = 5;
}

message StageFragmentsResponse {
  QueryExecutionId execution_id = 1;
  uint32 stage_digest_version = 2;
  bytes stage_digest = 3;
  StageFragmentsOutcome outcome = 4;
  string detail = 5;
}

message StartPreparedQueryRequest {
  QueryExecutionId execution_id = 1;
  uint32 stage_digest_version = 2;
  bytes stage_digest = 3;
}

message StartPreparedQueryResponse {
  QueryExecutionId execution_id = 1;
  uint32 stage_digest_version = 2;
  bytes stage_digest = 3;
  StartPreparedQueryOutcome outcome = 4;
  string detail = 5;
}

message AbortQueryRequest {
  QueryExecutionId execution_id = 1;
  bytes init_digest = 2;
  string reason = 3;
}

message AbortQueryResponse {
  QueryExecutionId execution_id = 1;
  QueryTerminationReason accepted_reason = 2;
}

message QueryControlAttach {
  QueryExecutionId execution_id = 1;
  bytes init_digest = 2;
  uint64 frontend_owner_epoch = 3;
}

message QueryControlHeartbeat {
  uint64 sequence = 1;
  uint64 sent_mono_ns = 2;
}

message QueryControlAbort {
  string reason = 1;
}

message QueryControlFinalize {}

message QueryControlTerminalAck {
  QueryExecutionId execution_id = 1;
  bytes init_digest = 2;
  uint32 snapshot_version = 3;
  bytes snapshot_digest = 4;
}

message QueryControlRequest {
  oneof command {
    QueryControlAttach attach = 1;
    QueryControlHeartbeat heartbeat = 2;
    QueryControlAbort abort = 3;
    QueryControlFinalize finalize = 4;
    QueryControlTerminalAck terminal_ack = 5;
  }
}

message QueryControlReady {}

message QueryControlHeartbeatAck {
  uint64 sequence = 1;
}

message QueryControlLocalFailure {
  string code = 1;
  string detail = 2;
}

message QueryControlTerminationAccepted {
  QueryTerminationReason reason = 1;
}

message QueryControlLocalDrained {}

// Best-effort, typed native fragment observation carried by the active query
// control stream. It is deliberately independent from terminal delivery: a
// dropped or stale observation never changes query correctness.
message FragmentLiveObservation {
  QueryExecutionId execution_id = 1;
  bytes init_digest = 2;
  ParticipantBackendIdentity backend = 3;
  novarocks.common.UniqueId fragment_instance_id = 4;
  uint64 sequence = 5;
  uint64 input_rows = 6;
  uint64 output_rows = 7;
  uint64 elapsed_ms = 8;
  optional RuntimeProfileTree profile = 9;
}

message QueryControlResponse {
  oneof event {
    QueryControlReady control_ready = 1;
    QueryControlHeartbeatAck heartbeat_ack = 2;
    QueryControlLocalFailure local_failure = 3;
    QueryControlTerminationAccepted termination_accepted = 4;
    QueryControlLocalDrained local_drained = 5;
    QueryTerminalSnapshot terminal_snapshot = 6;
    FragmentLiveObservation fragment_observation = 7;
  }
}

enum QueryTerminalFragmentOutcome {
  QUERY_TERMINAL_FRAGMENT_OUTCOME_UNSPECIFIED = 0;
  QUERY_TERMINAL_FRAGMENT_OUTCOME_SUCCEEDED = 1;
  QUERY_TERMINAL_FRAGMENT_OUTCOME_FAILED = 2;
  QUERY_TERMINAL_FRAGMENT_OUTCOME_CANCELLED = 3;
  QUERY_TERMINAL_FRAGMENT_OUTCOME_INCOMPLETE_DRAIN = 4;
}

message QueryTerminalTabletInfo {
  int64 tablet_id = 1;
  int64 backend_id = 2;
}

message QueryTerminalLoadStats {
  int64 loaded_rows = 1;
  int64 loaded_bytes = 2;
  int64 filtered_rows = 3;
}

// One bounded fragment of an opaque provider staged report. The frontend
// validates every frame before counting the logical writer as staged.
message ConnectorStagedReportFrame {
  uint32 contract_version = 1;
  novarocks.plan.ConnectorWriterIdentity writer = 2;
  uint32 terminal_state = 3;
  uint64 input_rows = 4;
  uint64 staged_bytes = 5;
  uint64 artifact_count = 6;
  uint32 part_index = 7;
  uint32 part_count = 8;
  uint64 logical_payload_len = 9;
  bytes logical_payload_sha256 = 10;
  bytes frame_payload = 11;
  bytes frame_payload_sha256 = 12;
}

message QueryTerminalFragmentSnapshot {
  novarocks.common.UniqueId fragment_instance_id = 1;
  int32 backend_num = 2;
  QueryTerminalFragmentOutcome outcome = 3;
  string error_code = 4;
  string error_detail = 5;
  reserved 6;
  reserved "iceberg_commits";
  repeated QueryTerminalTabletInfo tablet_commit_infos = 7;
  repeated QueryTerminalTabletInfo tablet_fail_infos = 8;
  QueryTerminalLoadStats load_stats = 9;
  RuntimeProfileTree profile = 10;
  repeated ConnectorStagedReportFrame connector_staged_report_frames = 11;
  // Bounded, opaque statistics collection state. It is internal to the
  // native lifecycle and never encoded as a client result row.
  bytes statistics_payload = 12;
}

message QueryTerminalSnapshot {
  uint32 version = 1;
  QueryExecutionId execution_id = 2;
  ParticipantBackendIdentity backend = 3;
  bytes init_digest = 4;
  bytes digest = 5;
  repeated QueryTerminalFragmentSnapshot fragments = 6;
}

message ReportQueryTerminalRequest {
  QueryTerminalSnapshot snapshot = 1;
}

enum ReportQueryTerminalOutcome {
  REPORT_QUERY_TERMINAL_OUTCOME_UNSPECIFIED = 0;
  REPORT_QUERY_TERMINAL_OUTCOME_ACCEPTED = 1;
  REPORT_QUERY_TERMINAL_OUTCOME_ALREADY_ACCEPTED = 2;
  REPORT_QUERY_TERMINAL_OUTCOME_REJECTED_CONFLICT = 3;
  REPORT_QUERY_TERMINAL_OUTCOME_REJECTED_GONE = 4;
}

message ReportQueryTerminalResponse {
  ReportQueryTerminalOutcome outcome = 1;
  string detail = 2;
}

// One exchange shuffle chunk in flight from a sender to a receiver instance.
message ExchangeRequest {
  int64 finst_id_hi = 1;   // receiver fragment-instance id, high 64 bits
  int64 finst_id_lo = 2;   // receiver fragment-instance id, low 64 bits
  int32 node_id = 3;       // destination exchange node id within the fragment
  int32 sender_id = 4;     // sender ordinal (for per-sender EOS tracking)
  int32 be_number = 5;     // sender BE ordinal
  bool eos = 6;            // true on this sender's final message
  int64 sequence = 7;      // monotonic per-sender sequence for ordering/ack
  bytes payload = 8;       // NRX1-framed Arrow IPC chunk (src/runtime/exchange.rs)
}

// Ack for one ExchangeRequest.
message ExchangeResponse {
  int64 ack_sequence = 1;                 // sequence value accepted for this request
  novarocks.common.Status status = 2;     // native exchange handler status; code 0 == OK
}

// Native per-instance fragment parameters. Complements the static PlanFragment
// carried by StageFragment.plan.
message InstanceParams {
  novarocks.common.UniqueId query_id = 1;
  novarocks.common.UniqueId fragment_instance_id = 2;
  int32 backend_num = 3;
  map<int32, ScanRangeList> per_node_scan_ranges = 4;  // scan node_id -> assigned ranges
  map<int32, int32> per_exch_num_senders = 5;          // exchange node_id -> sender count
  repeated Destination destinations = 6;
  reserved 7;
  reserved "runtime_filter_params";
  QueryOptions query_options = 8;
  reserved 9;
  reserved "report_endpoint";  // removed native report control-plane field; never reuse.
  bool typed_result_sink = 10;                         // novarocks_typed_result_sink
}

message ScanRangeList {
  repeated ScanRangeParams ranges = 1;
}

message ScanRangeParams {
  ScanRange range = 1;
  optional int32 volume_id = 2;
  optional bool empty = 3;
  optional bool has_more = 4;
}

message ScanRange {
  oneof kind {
    FileScanRange file = 1;
    StarRocksTabletScanRange starrocks_tablet = 2;
  }
}

message StarRocksTabletScanRange {
  int64 tablet_id = 1;
  int64 partition_id = 2;
  int64 version = 3;
}

message FileScanRange {
  string file_format = 1;  // PARQUET|ORC
  optional string full_path = 2;
  optional string relative_path = 3;
  optional int64 table_id = 4;
  int64 offset = 5;
  int64 length = 6;
  int64 file_length = 7;
  repeated IcebergDeleteFile delete_files = 8;
  optional DeletionVectorDescriptor deletion_vector_descriptor = 9;
  optional int64 first_row_id = 10;
  optional int64 data_sequence_number = 11;
  optional int64 modification_time = 12;
  optional DatacacheOptions datacache_options = 13;
  repeated int64 included_positions = 14;
  optional string serialized_split = 15;
  bool use_iceberg_jni_metadata_reader = 16;
  optional int32 change_op = 17; // internal IVM change-op value for virtual __change_op.
  map<int32, FilePruningMinMaxValue> file_pruning_min_max_values = 18; // column ordinal -> stats.
}

enum FilePruningValueKind {
  FILE_PRUNING_VALUE_KIND_UNSPECIFIED = 0;
  FILE_PRUNING_BOOL = 1;
  FILE_PRUNING_INT = 2;
  FILE_PRUNING_FLOAT = 3;
}

message FilePruningMinMaxValue {
  FilePruningValueKind value_kind = 1;
  bool has_null = 2;
  bool all_null = 3;
  optional int64 min_int_value = 4;
  optional int64 max_int_value = 5;
  optional double min_float_value = 6;
  optional double max_float_value = 7;
}

// Delete-file metadata attached to a NovaRocks file scan.
message IcebergDeleteFile {
  optional string full_path = 1;
  string file_format = 2;   // PARQUET for current consumed path.
  string file_content = 3;  // POSITION_DELETES|EQUALITY_DELETES
  optional int64 length = 4;
}

// Iceberg deletion-vector metadata attached to a NovaRocks file scan.
message DeletionVectorDescriptor {
  optional string storage_type = 1;
  optional string path_or_inline_dv = 2;
  optional int64 offset = 3;
  optional int64 size_in_bytes = 4;
  optional int64 cardinality = 5;
}

// Data cache behavior requested for a NovaRocks file scan.
message DatacacheOptions {
  optional bool enable_populate_datacache = 1;
  optional int32 priority = 2;
}

// Native runtime destination for one fragment instance.
message Destination {
  novarocks.common.UniqueId finst_id = 1;
  string endpoint = 2;  // NovaRocks gRPC runtime endpoint host:port.
}

// Query options consumed by NovaRocks native runtime.
message QueryOptions {
  int32 batch_size = 1;
  int32 query_timeout = 2;
  bool enable_profile = 3;
  int32 pipeline_dop = 4;
  int64 query_mem_limit = 5;
  int32 connector_io_tasks_per_scan_operator = 6;
  optional int64 runtime_filter_scan_wait_time_ms = 7;
  optional int32 runtime_filter_wait_timeout_ms = 8;
  bool allow_throw_exception = 9;
  optional int64 group_concat_max_len = 10;
  bool enable_spill = 11;
  optional SpillOptions spill_options = 12;
  bool enable_scan_datacache = 13;
  bool enable_populate_datacache = 14;
  bool enable_datacache_async_populate_mode = 15;
  bool enable_datacache_io_adaptor = 16;
  bool enable_cache_select = 17;
  optional int32 datacache_evict_probability = 18;
  int32 datacache_priority = 19;
  int64 datacache_ttl_seconds = 20;
  int64 datacache_sharing_work_period = 21;
  int32 query_delivery_timeout = 22;
  int64 runtime_profile_report_interval = 23;
  optional bool enable_join_runtime_bitset_filter = 24;
  int64 global_runtime_filter_build_max_size = 25;
  bool orc_use_column_names = 26;
  bool enable_file_metacache = 27;
  bool enable_file_pagecache = 28;
  bool enable_parquet_reader_page_index = 29;
}

// Spill options consumed by NovaRocks native runtime.
message SpillOptions {
  int32 spill_mode = 1;  // TSpillMode
  double spill_mem_limit_threshold = 2;
  int64 spill_operator_min_bytes = 3;
  int64 spill_operator_max_bytes = 4;
  int32 spill_encode_level = 5;
  bool enable_spill_buffer_read = 6;
  int64 max_spill_read_buffer_bytes_per_driver = 7;
  int32 spill_mem_table_size = 8;
  int32 spill_mem_table_num = 9;
}

// Coordinator long-poll request for one fragment instance result stream.
message FetchResultRequest {
  novarocks.common.UniqueId finst_id = 1;  // instance to poll
  int64 max_wait_ms = 2;                   // server-side long-poll budget
}

// FetchResult response containing readiness state plus one optional Arrow IPC payload.
message FetchResultResponse {
  enum Status {
    RESULT_STATUS_UNSPECIFIED = 0;
    READY = 1;
    NOT_READY = 2;
    EOF = 3;
    ERROR = 4;
  }

  Status status = 1;             // result lifecycle state for this poll
  string message = 2;            // error detail when status == ERROR
  bytes result_arrow_ipc = 3;    // NRX1-framed Arrow IPC (sole data track)
  int64 packet_seq = 4;          // fetch packet sequence
  bool eos = 5;                  // end-of-stream marker
}

// Coordinator cancellation request for active fragment instances.
// Control-plane-only declaration. `provider_id` selects a startup-composed
// installer and never appears in a fragment carrier. `declaration_payload`
// is provider-owned, bounded, opaque, and credential-free.
message EnsureConnectorExecutionBindingRequest {
  QueryExecutionId execution_id = 1;
  string provider_id = 2;
  string instance_id = 3;
  bytes incarnation = 4;          // exactly 16 UUID-v7 bytes
  bytes declaration_payload = 5;  // <= 64 KiB
}

message EnsureConnectorExecutionBindingResponse {
  int32 status_code = 1;  // 0 == ensured and query leased
  string message = 2;
}

message RetireConnectorExecutionBindingRequest {
  string instance_id = 1;
  bytes incarnation = 2;  // exactly 16 UUID-v7 bytes
}

message RetireConnectorExecutionBindingResponse {
  int32 status_code = 1;  // 0 == retirement accepted
  string message = 2;
}

// FE-pull heartbeat request. Consumer: src/runtime/heartbeat_mgr.rs.
message HeartbeatRequest {
  uint32 assigned_be_id = 1;  // id the FE assigns to this BE
  int64 fe_epoch = 2;         // FE epoch for split-brain detection
}

// BE heartbeat state returned to the FE poller.
message HeartbeatResponse {
  uint64 start_epoch = 1;  // BE process start epoch (restart detection)
  string version = 2;      // BE build version
  uint32 num_cores = 3;    // available cores for scheduling
  int32 status_code = 4;   // 0 == healthy
}

// Native recursive runtime profile. Replaces the flat thrift
// TRuntimeProfileNode list plus num_children encoding for NovaRocks-native
// control-plane consumers. Producer: src/runtime/profile.rs. Consumer:
// src/service/fe_report.rs for multi-fragment merge and EXPLAIN ANALYZE paths.
message RuntimeProfileTree {
  ProfileNode root = 1;  // root profile node for one fragment profile tree
}

// One runtime profile node with native recursive children.
message ProfileNode {
  string name = 1;                         // display name of the profile node
  int32 node_id = 2;                       // plan node id; was TRuntimeProfileNode.metadata
  repeated Counter counters = 3;           // counters owned by this profile node
  map<string, string> info_strings = 4;    // informational key/value strings
  repeated ProfileNode children = 5;       // child profile nodes in display order
}

// Runtime counter value and display hierarchy metadata.
message Counter {
  string name = 1;          // counter display name
  string parent_name = 2;   // empty string means this is a root-level counter
  ProfileUnit unit = 3;     // counter value unit
  int64 value = 4;          // current counter value
  optional int64 min_value = 5;  // merged minimum value, if available
  optional int64 max_value = 6;  // merged maximum value, if available
}

// Runtime profile counter units. Mirrors thrift metrics.TUnit values used by
// src/runtime/profile.rs, with an explicit unspecified zero value for proto3.
enum ProfileUnit {
  PROFILE_UNIT_UNSPECIFIED = 0;
  PROFILE_UNIT_UNIT = 1;
  PROFILE_UNIT_CPU_TICKS = 2;
  PROFILE_UNIT_BYTES = 3;
  PROFILE_UNIT_TIME_NS = 4;
  PROFILE_UNIT_TIME_MS = 5;
  PROFILE_UNIT_TIME_S = 6;
  PROFILE_UNIT_NONE = 7;
}
