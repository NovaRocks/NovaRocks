syntax = "proto3";

import "catalog.proto";
import "connector_common.proto";

// NovaRocks-native typed connector read contract.
//
// Public handles and split categories carry a purpose-tagged provider payload.
// The generic scheduler reads only the neutral envelope promoted onto
// ConnectorSplit. Provider-private schemas and semantics live in the provider
// crate and never enter this package.
//
// Owner: produced by the FE native plan/assignment encoder, validated by
// novarocks-proto, and consumed by the BE native decode adapter. Provider
// semantics belong to the provider that produced the variant.
// Design: ADR-0114 (docs/adr/ADR-0114-trino-aligned-typed-connector-read-stack.md)
package novarocks.connector_read;

// ---------------------------------------------------------------------------
// Typed values
// ---------------------------------------------------------------------------

// The exact type of a Value. Decimal precision/scale and fixed width are part
// of the type, so two values only compare when their whole ValueType matches.
enum ValueTypeKind {
  VALUE_TYPE_KIND_UNSPECIFIED = 0;
  VALUE_TYPE_KIND_BOOLEAN = 1;
  // An eight-bit signed integer. A provider without an exact counterpart must
  // reject it rather than silently widening it to INTEGER.
  VALUE_TYPE_KIND_TINY_INT = 18;
  VALUE_TYPE_KIND_SMALL_INT = 19;
  VALUE_TYPE_KIND_INTEGER = 2;
  VALUE_TYPE_KIND_BIG_INT = 3;
  VALUE_TYPE_KIND_REAL = 4;
  VALUE_TYPE_KIND_DOUBLE = 5;
  VALUE_TYPE_KIND_DECIMAL = 6;
  VALUE_TYPE_KIND_DATE = 7;
  VALUE_TYPE_KIND_TIME_MICROS = 8;
  VALUE_TYPE_KIND_TIMESTAMP_MICROS = 9;
  VALUE_TYPE_KIND_TIMESTAMP_TZ_MICROS = 10;
  VALUE_TYPE_KIND_TIMESTAMP_NANOS = 11;
  VALUE_TYPE_KIND_TIMESTAMP_TZ_NANOS = 12;
  VALUE_TYPE_KIND_TIMESTAMP_MILLIS = 20;
  VALUE_TYPE_KIND_VARCHAR = 13;
  VALUE_TYPE_KIND_VARBINARY = 14;
  VALUE_TYPE_KIND_UUID = 15;
  VALUE_TYPE_KIND_FIXED = 16;
  // A column whose engine type has no comparable counterpart: ROW, ARRAY, MAP
  // and the binary-carried variant types. Such a column can be projected and
  // read, and can never appear in a Value, a Domain, or a comparison, so no
  // Value arm exists for it. It states only that no comparable counterpart
  // exists; the column's actual shape is carried by the plan node's own output
  // column, which the fragment decoder agrees with these assignments.
  VALUE_TYPE_KIND_NON_COMPARABLE = 17;
}

// Decimal and fixed parameters are present exactly when the kind requires them.
message ValueType {
  ValueTypeKind kind = 1;
  optional uint32 decimal_precision = 2;  // 1..=38, DECIMAL only.
  optional int32 decimal_scale = 3;       // 0..=precision, DECIMAL only.
  optional uint32 fixed_length = 4;       // FIXED only.
}

// A 16-byte two's-complement unscaled magnitude plus its exact type parameters.
message DecimalValue {
  bytes unscaled = 1;      // exactly 16 bytes, big-endian two's complement.
  uint32 precision = 2;    // 1..=38.
  int32 scale = 3;         // 0..=precision.
}

// One exactly typed, non-null value. NULL is carried by Domain.null_allowed.
message Value {
  oneof value {
    bool boolean = 1;
    int32 tiny_int = 17;               // -128..=127.
    int32 small_int = 18;              // -32768..=32767.
    int32 integer = 2;
    int64 big_int = 3;
    float real = 4;
    double double_value = 5;
    DecimalValue decimal = 6;
    int32 date = 7;                    // days since the Unix epoch.
    int64 time_micros = 8;             // microseconds since midnight.
    int64 timestamp_micros = 9;
    int64 timestamp_tz_micros = 10;
    int64 timestamp_nanos = 11;
    int64 timestamp_tz_nanos = 12;
    int64 timestamp_millis = 19;
    string varchar = 13;               // <= 64 KiB.
    bytes varbinary = 14;              // <= 64 KiB.
    bytes uuid = 15;                   // exactly 16 bytes.
    bytes fixed = 16;                  // <= 64 KiB.
  }
}

// ---------------------------------------------------------------------------
// Predicates
// ---------------------------------------------------------------------------

enum BoundKind {
  BOUND_KIND_UNSPECIFIED = 0;
  BOUND_KIND_UNBOUNDED = 1;
  BOUND_KIND_INCLUSIVE = 2;
  BOUND_KIND_EXCLUSIVE = 3;
}

// The bounding value is present exactly when the kind is not UNBOUNDED.
message Bound {
  BoundKind kind = 1;
  optional Value value = 2;
}

message Range {
  Bound low = 1;
  Bound high = 2;
}

// Sorted, non-overlapping ranges of one exact type. An empty list is the empty
// set; a single fully unbounded range is the whole set. Discrete values are
// unit ranges, so there is no second representation.
message ValueSet {
  ValueType value_type = 1;
  repeated Range ranges = 2;  // <= 4096.
}

message Domain {
  ValueSet values = 1;
  bool null_allowed = 2;
}

message ColumnDomain {
  ColumnHandle column = 1;
  Domain domain = 2;
}

// `none = true` is the unsatisfiable predicate and must carry no column
// domains. Otherwise an absent column is unconstrained, so an empty list is
// the unconstrained predicate.
message TupleDomain {
  bool none = 1;
  repeated ColumnDomain column_domains = 2;  // <= 4096, canonical column order.
}

// The residual expression a connector accepted beyond a TupleDomain.
message ConnectorExpression {
  oneof node {
    ConstantExpression constant = 1;
    VariableExpression variable = 2;
    FieldDereferenceExpression field_dereference = 3;
    CallExpression call = 4;
  }
}

message ConstantExpression {
  ValueType value_type = 1;
  optional Value value = 2;  // absent is the typed NULL literal.
}

message VariableExpression {
  string name = 1;  // non-empty, <= 256 bytes.
  ValueType value_type = 2;
}

message FieldDereferenceExpression {
  ConnectorExpression target = 1;
  uint32 field_index = 2;
  ValueType value_type = 3;
}

message CallExpression {
  string function_name = 1;  // non-empty ASCII, <= 256 bytes.
  ValueType value_type = 2;
  repeated ConnectorExpression arguments = 3;
}

// ---------------------------------------------------------------------------
// Shared identity
// ---------------------------------------------------------------------------

message HostAddress {
  string host = 1;  // non-empty, <= 255 bytes.
  uint32 port = 2;  // 1..=65535.
}

// ---------------------------------------------------------------------------
// Provider-owned handles
// ---------------------------------------------------------------------------

// A generic consumer keys on the complete encoded payload without interpreting
// the provider-private column schema.
message ColumnHandle {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

// ---------------------------------------------------------------------------
// Transaction handles
// ---------------------------------------------------------------------------

message ConnectorTransactionHandle {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

// ---------------------------------------------------------------------------
// Table handles
// ---------------------------------------------------------------------------

message ConnectorTableHandle {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

// ---------------------------------------------------------------------------
// Table function handles
// ---------------------------------------------------------------------------

message ConnectorTableFunctionHandle {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

// ---------------------------------------------------------------------------
// Change-window handles (NovaRocks incremental materialized views)
// ---------------------------------------------------------------------------

message ConnectorChangeWindowHandle {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

// ---------------------------------------------------------------------------
// System relation references
// ---------------------------------------------------------------------------

message ConnectorSystemTableReference {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

// ---------------------------------------------------------------------------
// Table execute handles
// ---------------------------------------------------------------------------

message ConnectorTableExecuteHandle {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

// ---------------------------------------------------------------------------
// Merge table handles
// ---------------------------------------------------------------------------

message ConnectorMergeTableHandle {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

// ---------------------------------------------------------------------------
// Provider-owned split categories
// ---------------------------------------------------------------------------

message DataSplit {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

message TableChangesSplitCategory {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

message ChangeWindowSplitCategory {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

message SystemFilesSplitCategory {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

message RewritePositionDeleteFilesSplitCategory {
  novarocks.connector_common.ConnectorEncodedPayload provider_payload = 1;
}

// ---------------------------------------------------------------------------
// The scheduled split envelope
// ---------------------------------------------------------------------------

// Fields 1..=5 are the neutral view the generic scheduler consumes. The
// category oneof is provider data the scheduler must not interpret.
message ConnectorSplit {
  uint64 split_weight_raw = 1;         // positive; 100 is one standard split.
  bool remotely_accessible = 2;
  repeated HostAddress addresses = 3;  // <= 256.
  optional string affinity_key = 4;    // <= 4 KiB.
  uint64 retained_size_in_bytes = 5;
  oneof category {
    DataSplit data = 10;
    TableChangesSplitCategory table_changes = 11;
    ChangeWindowSplitCategory change_window = 12;
    SystemFilesSplitCategory system_files = 13;
    RewritePositionDeleteFilesSplitCategory rewrite_position_delete_files = 14;
  }
}

// ---------------------------------------------------------------------------
// The scan node contract
// ---------------------------------------------------------------------------

// The catalog-scoped, transaction-bound relation a scan reads. Exactly one
// relation kind is present.
message CatalogTableHandle {
  // Immutable content identity for the catalog runtime this relation requires.
  // It is deliberately distinct from any Frontend-local control runtime.
  novarocks.catalog.CatalogHandle catalog_handle = 1;
  ConnectorTransactionHandle transaction = 2;
  oneof relation {
    ConnectorTableHandle table = 10;
    ConnectorTableFunctionHandle table_function = 11;
    ConnectorChangeWindowHandle change_window = 12;
    ConnectorSystemTableReference system_table = 13;
    ConnectorTableExecuteHandle table_execute = 14;
    ConnectorMergeTableHandle merge_table = 15;
  }
}

// One ordered output column of a scan: the plan variable, the connector
// column it binds, and its exact type.
message ScanAssignment {
  // An opaque expression identifier, non-empty and unique within one scan. It
  // is what a ConnectorExpression names this column by; it is deliberately not
  // the output column's name, and carries no meaning of its own. The ordered
  // position is the output contract: assignments[i] produces page channel i.
  string variable = 1;
  ColumnHandle column = 2;
  ValueType value_type = 3;
}

// One dynamic filter the backend resolves against this scan's assignments.
message DynamicFilterBinding {
  uint32 filter_id = 1;
  string variable = 2;  // must name one of this scan's assignments.
}

// How one scan's work reaches the backend that runs it.
//
// It is an engine decision about execution, not a fact of the provider's
// relation handle, so it travels on the scan node. A neutral backend reads it
// to choose a lane and never matches a provider variant to re-derive it.
enum ScanWorkSource {
  SCAN_WORK_SOURCE_UNSPECIFIED = 0;
  // Splits arrive at runtime on the task-update queue. Every ordinary read
  // uses this, including the distributed system relations.
  SCAN_WORK_SOURCE_RUNTIME_SPLITS = 1;
  // No split at all: one backend reads the relation itself from an immutable
  // metadata file. Only a system relation the coordinator resolved to a single
  // task may use this, and reading it on more than one task duplicates every
  // row, so the coordinator alone keeps it to one.
  SCAN_WORK_SOURCE_WHOLE_RELATION = 2;
}

// The typed replacement for the opaque connector read source. It carries no
// split list, no private payload, and no Arrow IPC schema.
message ConnectorTableScanSource {
  CatalogTableHandle table = 1;
  repeated ScanAssignment assignments = 2;      // ordered output; <= 4096.
  TupleDomain enforced_predicate = 3;
  TupleDomain unenforced_predicate = 4;
  optional ConnectorExpression remaining_expression = 5;
  repeated DynamicFilterBinding dynamic_filters = 6;
  uint64 max_batch_rows = 7;                    // required nonzero.
  uint64 max_batch_bytes = 8;                   // required nonzero.
  ScanWorkSource work_source = 9;               // required, never unspecified.
}

// ---------------------------------------------------------------------------
// Runtime split assignment
// ---------------------------------------------------------------------------

// One split placed in one task's plan-node queue. `sequence_id` is monotonic
// within one (task attempt, plan node).
//
// A sequence at or below the receiver's accepted watermark is a duplicate and
// enqueues nothing, regardless of what it carries. The receiver keeps only the
// watermark, never the payloads it already accepted, so it cannot distinguish
// an exact replay from a sender that reused a sequence with different content;
// ADR-0123 recorded that as an accepted compromise and treats a reused
// sequence as a sender bug rather than a verifiable cross-process guarantee.
message ScheduledSplit {
  uint64 sequence_id = 1;
  int32 plan_node_id = 2;
  ConnectorSplit split = 3;
}

// A batch of splits for one plan node. `no_more_splits` is terminal for that
// plan node and idempotent; no split may follow it.
message SplitAssignment {
  int32 plan_node_id = 1;
  repeated ScheduledSplit splits = 2;  // <= 4096.
  bool no_more_splits = 3;
}
