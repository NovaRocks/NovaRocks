// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergTableInfo {
  string catalog = 1;                         // catalog name.
  string namespace = 2;                       // namespace/database name.
  string table = 3;                           // table name.
  optional string table_uuid = 4;             // optional Iceberg table UUID.
  optional int64 current_snapshot_id = 5;     // optional current snapshot id.
  int32 schema_id = 6;                        // current schema id.
  string location = 7;                        // table location URI.
  IcebergSchemaDef schema = 8;                // Iceberg schema definition.
  optional string serialized_metadata = 9;    // optional JSON TableMetadata.
  optional string serialized_metadata_rows = 10; // optional JSON metadata rows.
}

// Iceberg schema definition.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergSchemaDef {
  repeated IcebergSchemaFieldDef fields = 1; // top-level schema fields.
}

// Iceberg schema field definition.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergSchemaFieldDef {
  int32 field_id = 1;                         // Iceberg field id.
  string name = 2;                            // field name.
  optional string initial_default_json = 3;   // optional JSON initial default.
  optional string write_default_json = 4;     // optional JSON write default.
  repeated IcebergSchemaFieldDef children = 5; // nested child fields.
}

// Iceberg data file planned for scanning.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergDataFileInfo {
  string path = 1;                                     // data file path.
  int64 size = 2;                                      // file size in bytes.
  optional int64 row_count = 3;                        // optional row count.
  IcebergColumnStatsMap column_stats = 4;              // optional per-column stats.
  optional int32 partition_spec_id = 5;                // optional partition spec id.
  optional string partition_key = 6;                   // optional stable partition key string.
  optional int64 first_row_id = 7;                     // optional Iceberg v3 first row id.
  optional int64 data_sequence_number = 8;             // optional Iceberg data sequence number.
  optional int32 ivm_change_op = 9;                    // optional IVM change-op tag.
  Int64List included_positions = 10;                   // optional absolute row positions.
  repeated IcebergDeleteFileInfo delete_files = 11;    // delete files applying to this data file.
  optional string manifest_path = 12;                  // optional manifest path.
  repeated IcebergPartitionFieldValue partition_values = 13; // decoded partition values.
}

// Optional map wrapper for Iceberg per-column stats.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergColumnStatsMap {
  map<string, IcebergColumnStats> entries = 1; // column name to stats.
}

// Ordered int64 list wrapper.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message Int64List {
  repeated int64 values = 1; // int64 values.
}

// Iceberg manifest column statistics.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergColumnStats {
  optional int64 null_count = 1;   // optional null count.
  optional int64 value_count = 2;  // optional total value count.
  optional int64 column_size = 3;  // optional column byte size.
  optional bytes lower_bound = 4;  // optional lower-bound bytes.
  optional bytes upper_bound = 5;  // optional upper-bound bytes.
}

// Iceberg delete file applying to a data file.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergDeleteFileInfo {
  string path = 1;                                      // delete file path.
  IcebergDeleteFileFormat file_format = 2;             // delete file format.
  IcebergDeleteFileContent file_content = 3;           // delete file content kind.
  optional int64 length = 4;                            // optional file length.
  optional int64 content_offset = 5;                    // optional content offset.
  optional int64 content_size_in_bytes = 6;             // optional content size.
  optional int64 sequence_number = 7;                   // optional sequence number.
  optional int32 partition_spec_id = 8;                 // optional partition spec id.
  optional string partition_key = 9;                    // optional partition key string.
  repeated string equality_column_names = 10;           // equality delete column names.
  repeated int32 equality_field_ids = 11;               // equality delete field ids.
}

// Iceberg delete file format.
enum IcebergDeleteFileFormat {
  ICEBERG_DELETE_FILE_FORMAT_UNSPECIFIED = 0;
  ICEBERG_DELETE_FILE_FORMAT_PARQUET = 1;
  ICEBERG_DELETE_FILE_FORMAT_PUFFIN = 2;
}

// Iceberg delete file content kind.
enum IcebergDeleteFileContent {
  ICEBERG_DELETE_FILE_CONTENT_UNSPECIFIED = 0;
  ICEBERG_DELETE_FILE_CONTENT_POSITION = 1;
  ICEBERG_DELETE_FILE_CONTENT_EQUALITY = 2;
}

// One decoded Iceberg partition field value.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergPartitionFieldValue {
  string source_column = 1;        // source column name.
  string field_name = 2;           // partition field name.
  string transform = 3;            // partition transform string.
  IcebergPartitionValue value = 4; // optional partition value.
}

// Iceberg partition scalar value.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergPartitionValue {
  oneof value {
    bool bool_value = 1;    // boolean partition value.
    int32 int32_value = 2;  // int32 partition value.
    int64 int64_value = 3;  // int64 partition value.
    float float_value = 4;  // float partition value.
    double double_value = 5; // double partition value.
    string string_value = 6; // string partition value.
    bytes binary_value = 7; // binary partition value.
  }
}

// Iceberg write sink specification.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergWriteSinkSpec {
  IcebergWriteSinkMode mode = 1;                        // write sink mode.
  int64 target_table_id = 2;                             // synthetic or catalog target table id.
  TableDef target_table = 3;                             // target table definition.
  IcebergTableInfo iceberg = 4;                          // target Iceberg table info.
  repeated ColumnDef target_columns = 5;                 // target write columns.
  string table_location = 6;                             // Iceberg table location.
  string data_location = 7;                              // data file output location.
  int32 target_partition_spec_id = 8;                    // target partition spec id.
  map<string, string> cloud_properties = 9;              // object-store properties.
  string file_format = 10;                               // output file format.
  IcebergWriteFileCompression compression = 11;          // output file compression.
  PositionDeleteDescriptorInput position_delete_output_descriptor = 12; // optional position-delete descriptor.
}

// Iceberg write sink mode.
enum IcebergWriteSinkMode {
  ICEBERG_WRITE_SINK_MODE_UNSPECIFIED = 0;
  ICEBERG_WRITE_SINK_MODE_DATA = 1;
  ICEBERG_WRITE_SINK_MODE_ROW_LINEAGE_DATA = 2;
  ICEBERG_WRITE_SINK_MODE_POSITION_DELETES = 3;
  ICEBERG_WRITE_SINK_MODE_DELETION_VECTORS = 4;
  ICEBERG_WRITE_SINK_MODE_EQUALITY_DELETES = 5;
}

// Iceberg write file compression.
enum IcebergWriteFileCompression {
  ICEBERG_WRITE_FILE_COMPRESSION_UNSPECIFIED = 0;
  ICEBERG_WRITE_FILE_COMPRESSION_SNAPPY = 1;
}

// Mapping from fragment output columns to Iceberg writer input.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergWriteInputBinding {
  oneof kind {
    bool root_output_by_ordinal = 1; // true when writer consumes root output by ordinal.
    UInt64List output_ordinals = 2;  // explicit output ordinals consumed by writer.
  }
}

// Position-delete output descriptor.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message PositionDeleteDescriptorInput {
  PositionDeleteOutputField file_path = 1;                      // file-path output field.
  PositionDeleteOutputField pos = 2;                            // row-position output field.
  repeated PositionDeletePartitionSourceField partition_source_fields = 3; // partition source fields.
  int32 target_partition_spec_id = 4;                           // target partition spec id.
}

// One position-delete output field.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message PositionDeleteOutputField {
  uint64 output_expr_index = 1;              // output expression index.
  string name = 2;                           // output field name.
  novarocks.common.TypeDesc data_type = 3;   // output field SQL type.
  int32 field_id = 4;                        // Iceberg field id.
}

// One partition source field for position-delete output.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message PositionDeletePartitionSourceField {
  uint64 output_expr_index = 1;            // output expression index.
  string source_column_name = 2;           // source data column name.
  string partition_field_name = 3;         // output partition field name.
  string transform_expr = 4;               // Iceberg transform expression string.
  int32 source_field_id = 5;               // Iceberg source field id.
  novarocks.common.TypeDesc data_type = 6; // source field SQL type.
}

// One Iceberg change-stream branch route.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergChangeStreamBranchRoute {
  int32 branch_id = 1;                       // branch id within the router group.
  ChangeStreamBranchKind branch_kind = 2;    // branch semantic kind.
  uint32 target_fragment_id = 3;             // target writer fragment id.
  int32 target_exchange_node_id = 4;         // target writer exchange node id.
  repeated uint64 output_ordinals = 5;       // output ordinals sent to this branch.
  repeated uint64 output_partition_ordinals = 6; // output ordinals used for partitioning.
  DataPartition output_partition = 7;        // runtime partition kind + native hash exprs.
  StreamDestinationList destinations = 8;    // runtime destinations for this branch.
}
