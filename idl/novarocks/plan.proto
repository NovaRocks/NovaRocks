syntax = "proto3";

// NovaRocks-native distributed plan contract. Mirrors the PIR thin overlay:
// DistributedPlan / PlanFragment / DistributedNode plus native support messages.
// This is contract-only in NIDL-3; future NIDL-4 FE encode and BE prepare
// conversion layers own translation. Planner and exec code must not import the
// generated proto directly.
package novarocks.plan;

import "common.proto";
import "expr.proto";

// Whole-query distributed plan.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message DistributedPlan {
  repeated PlanFragment fragments = 1;  // all fragments in this distributed plan.
  uint32 root_fragment_id = 2;           // root fragment producing client-visible results.
  repeated FragmentEdge edges = 3;       // directed data-flow edges between fragments.
}

// One fragment in a distributed plan.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message PlanFragment {
  uint32 fragment_id = 1;                                // fragment identity.
  DistributedNode root = 2;                              // root node of this fragment.
  DataPartition data_partition = 3;                      // input partitioning expected by this fragment.
  DataPartition output_partition = 4;                    // output partitioning produced by this fragment.
  DataSink sink = 5;                                     // fragment sink behavior.
  repeated novarocks.expr.Expr output_exprs = 6;         // optional output expressions when present.
  repeated novarocks.common.OutputColumn output_columns = 7; // fragment output schema.
  optional uint32 cte_id = 8;                            // CTE id when this fragment is CTE-owned.
  repeated CteExchangeBinding cte_exchange_nodes = 9;    // CTE exchange bindings inside this fragment.
  RuntimeFilterBindingTable runtime_filter_bindings = 10; // fragment-local static runtime-filter bindings.
}

// Binding between one CTE and its exchange receiver nodes.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message CteExchangeBinding {
  uint32 cte_id = 1;              // CTE identity.
  int32 node_id = 2;              // exchange node id receiving this CTE stream.
  repeated uint32 column_ids = 3; // producer column ids received by this exchange.
}

// Distributed plan tree node. Stats are intentionally off-wire.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message DistributedNode {
  int32 node_id = 1;                                    // execution node id.
  uint32 fragment_id = 2;                               // owning fragment id.
  repeated int32 tuple_ids = 3;                         // legacy tuple ids needed during NIDL-4 prepare.
  repeated int32 nullable_tuple_ids = 4;                // nullable tuple ids for outer-join semantics.
  int64 limit = 5;                                      // node limit; -1 means no limit.
  reserved 6, 7;
  reserved "build_runtime_filters", "probe_runtime_filters";
  repeated DistributedNode children = 8;                // child plan nodes.
  repeated uint32 runtime_filter_binding_ids = 9;        // sealed binding ids attached to this node.
  oneof payload {
    PlanNode physical = 10;       // physical operator payload.
    ExchangeReceiver exchange = 11; // exchange receiver payload.
  }
}

// Exchange receiver node payload.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message ExchangeReceiver {
  PartitionType partition_type = 1;                     // source exchange partition type.
  repeated novarocks.expr.Expr partition_exprs = 2;     // partition expressions.
  uint32 source_fragment_id = 3;                         // fragment sending into this receiver.
  repeated novarocks.common.OutputColumn output_columns = 4; // exchange output schema.
  optional string output_qualifier = 5;                 // optional output qualifier for display.
  ExchangeFlavor flavor = 6;                             // exchange semantic flavor.
}

// Physical operator payload. Each arm mirrors one PhysicalPlanKind variant.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message PlanNode {
  repeated novarocks.common.OutputColumn output_columns = 1; // node-owned output schema.
  oneof kind {
    ScanNode scan = 10;                              // table scan.
    FilterNode filter = 11;                          // filter predicate.
    ProjectNode project = 12;                        // projection list.
    SortNode sort = 13;                              // sort or partitioned sort.
    LimitNode limit = 14;                            // limit/offset node.
    ValuesNode values = 15;                          // literal values node.
    DecodeNode decode = 16;                          // low-cardinality dictionary decode node.
    RepeatNode repeat = 17;                          // grouping sets repeat node.
    WindowNode window = 18;                          // window node.
    GenerateSeriesNode generate_series = 19;         // generate-series table function node.
    TableFunctionNode table_function = 20;           // generic table function node.
    AssertOneRowNode assert_one_row = 21;            // scalar subquery row-count assertion.
    TopNNode topn = 22;                              // physical TopN node.
    HashAggregateNode hash_aggregate = 23;           // physical hash aggregate node.
    HashJoinNode hash_join = 24;                     // physical hash join node.
    NestLoopJoinNode nest_loop_join = 25;            // physical nested-loop join node.
    SetOpNode set_op = 26;                           // set operation node.
    ChangeEventExpandNode change_event_expand = 27;  // IVM change-event expansion node.
    CteAnchorNode cte_anchor = 28;                   // CTE anchor node.
    CteProduceNode cte_produce = 29;                 // CTE producer node.
    CteConsumeNode cte_consume = 30;                 // CTE consumer node.
    RedistributeNode redistribute = 31;              // explicit redistribution node.
  }
}

// Native exchange partition type, replacing StarRocks thrift TPartitionType.
enum PartitionType {
  PARTITION_TYPE_UNSPECIFIED = 0;
  PARTITION_TYPE_UNPARTITIONED = 1;
  PARTITION_TYPE_RANDOM = 2;
  PARTITION_TYPE_HASH = 3;
  PARTITION_TYPE_RANGE = 4;
  PARTITION_TYPE_BUCKET_SHUFFLE_HASH = 5;
  PARTITION_TYPE_HYBRID_HASH = 6;
}

// Fragment input/output partitioning.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message DataPartition {
  PartitionKind kind = 1;                  // fragment partitioning kind.
  repeated novarocks.expr.Expr exprs = 2;  // hash partition expressions when kind is HASH.
}

// Planner-level data partition kind.
enum PartitionKind {
  PARTITION_KIND_UNSPECIFIED = 0;
  PARTITION_KIND_UNPARTITIONED = 1;
  PARTITION_KIND_RANDOM = 2;
  PARTITION_KIND_HASH = 3;
}

// Published schema tombstone. No active field, production writer, or production
// reader may reference this legacy runtime-filter message.
message RuntimeFilterBuild {
  int32 filter_id = 1;                         // runtime filter id.
  novarocks.expr.Expr build_expr = 2;          // build-side expression.
  novarocks.expr.Expr probe_expr = 3;          // probe-side expression.
  uint32 expr_order = 4;                       // expression order within the join key list.
  JoinExecutionMode execution_mode = 5;        // distribution mode for this filter.
  uint32 source_fragment_id = 6;               // build-side fragment id.
  repeated uint32 target_fragment_ids = 7;     // probe-side target fragment ids.
}

// Published schema tombstone. No active field, production writer, or production
// reader may reference this legacy runtime-filter message.
message RuntimeFilterProbe {
  int32 filter_id = 1;                // runtime filter id.
  novarocks.expr.Expr probe_expr = 2; // local probe expression.
  uint32 source_fragment_id = 3;      // build-side source fragment id.
}

// Fragment-local static runtime-filter binding table. Dynamic deployment,
// routing, coverage, participants, and epochs are intentionally off-wire here.
message RuntimeFilterBindingTable {
  uint32 fragment_id = 1;
  repeated RuntimeFilterBinding bindings = 2;
}

// One exact planner binding materialized by coordinator preparation.
message RuntimeFilterBinding {
  uint32 binding_id = 1;
  uint32 channel_id = 2;
  int32 node_id = 3;
  RuntimeFilterApplyPoint apply_point = 4;
  novarocks.expr.Expr expression = 5;
  RuntimeFilterContract contract = 6;
  RuntimeFilterReductionContract reduction = 7;
  oneof role {
    RuntimeFilterProducerRole producer = 8;
    RuntimeFilterConsumerRole consumer = 9;
  }
}

enum RuntimeFilterApplyPoint {
  RUNTIME_FILTER_APPLY_POINT_UNSPECIFIED = 0;
  RUNTIME_FILTER_APPLY_POINT_NODE_INPUT = 1;
  RUNTIME_FILTER_APPLY_POINT_NODE_OUTPUT = 2;
}

message RuntimeFilterContract {
  oneof kind {
    RuntimeFilterMembershipContract membership = 1;
    RuntimeFilterOrderedContract ordered = 2;
  }
}

message RuntimeFilterMembershipContract {
  bytes canonical_schema = 1;
  bytes schema_digest = 2;
}

message RuntimeFilterOrderedContract {
  repeated RuntimeFilterOrderKey keys = 1;
  bytes comparator_digest = 2;
  bytes order_contract_digest = 3;
}

message RuntimeFilterOrderKey {
  novarocks.common.TypeDesc type = 1;
  RuntimeFilterSortDirection direction = 2;
  RuntimeFilterNullOrder null_order = 3;
}

enum RuntimeFilterSortDirection {
  RUNTIME_FILTER_SORT_DIRECTION_UNSPECIFIED = 0;
  RUNTIME_FILTER_SORT_DIRECTION_ASCENDING = 1;
  RUNTIME_FILTER_SORT_DIRECTION_DESCENDING = 2;
}

enum RuntimeFilterNullOrder {
  RUNTIME_FILTER_NULL_ORDER_UNSPECIFIED = 0;
  RUNTIME_FILTER_NULL_ORDER_FIRST = 1;
  RUNTIME_FILTER_NULL_ORDER_LAST = 2;
}

message RuntimeFilterReductionContract {
  oneof kind {
    bool set_union = 1;
    bool tighten_ordered_bound = 2;
    RuntimeFilterTopKReduction merge_topk_summary = 3;
  }
}

message RuntimeFilterTopKReduction {
  uint32 k = 1;
  bytes contract_digest = 2;
}

message RuntimeFilterProducerRole {
  repeated RuntimeFilterContributionKind contribution_kinds = 1;
  RuntimeFilterCompletionRequirement completion_requirement = 2;
  optional uint32 join_key_ordinal = 3;
}

message RuntimeFilterConsumerRole {
  repeated RuntimeFilterArtifactCapability capabilities = 1;
  RuntimeFilterConsumerActivation activation = 2;
  oneof target {
    uint32 direct_input_ordinal = 3;
    bool source_boundary = 4;
  }
}

enum RuntimeFilterContributionKind {
  RUNTIME_FILTER_CONTRIBUTION_KIND_UNSPECIFIED = 0;
  RUNTIME_FILTER_CONTRIBUTION_KIND_VALUE_DOMAIN_DELTA = 1;
  RUNTIME_FILTER_CONTRIBUTION_KIND_FINAL_DOMAIN_SHARD = 2;
  RUNTIME_FILTER_CONTRIBUTION_KIND_ORDERED_BOUND_UPDATE = 3;
  RUNTIME_FILTER_CONTRIBUTION_KIND_TOPK_SUMMARY = 4;
  RUNTIME_FILTER_CONTRIBUTION_KIND_PRODUCER_CLOSED = 5;
}

enum RuntimeFilterCompletionRequirement {
  RUNTIME_FILTER_COMPLETION_REQUIREMENT_UNSPECIFIED = 0;
  RUNTIME_FILTER_COMPLETION_REQUIREMENT_PRODUCER_CLOSED = 1;
  RUNTIME_FILTER_COMPLETION_REQUIREMENT_FENCED_COMMITTED_DOMAIN_FROZEN = 2;
}

enum RuntimeFilterArtifactCapability {
  RUNTIME_FILTER_ARTIFACT_CAPABILITY_UNSPECIFIED = 0;
  RUNTIME_FILTER_ARTIFACT_CAPABILITY_MEMBERSHIP = 1;
  RUNTIME_FILTER_ARTIFACT_CAPABILITY_ORDERED_RANGE = 2;
  RUNTIME_FILTER_ARTIFACT_CAPABILITY_EMPTY_DOMAIN = 3;
}

message RuntimeFilterConsumerActivation {
  oneof kind {
    bool blocking_snapshot = 1;
    RuntimeFilterLateApplyGranularity non_blocking_live = 2;
  }
}

enum RuntimeFilterLateApplyGranularity {
  RUNTIME_FILTER_LATE_APPLY_GRANULARITY_UNSPECIFIED = 0;
  RUNTIME_FILTER_LATE_APPLY_GRANULARITY_ROW = 1;
  RUNTIME_FILTER_LATE_APPLY_GRANULARITY_BATCH = 2;
  RUNTIME_FILTER_LATE_APPLY_GRANULARITY_ROW_GROUP = 3;
  RUNTIME_FILTER_LATE_APPLY_GRANULARITY_SPLIT = 4;
  RUNTIME_FILTER_LATE_APPLY_GRANULARITY_FILE = 5;
}

// Directed data-flow edge between two fragments.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message FragmentEdge {
  uint32 source_fragment_id = 1;      // sending fragment id.
  uint32 target_fragment_id = 2;      // receiving fragment id.
  int32 target_exchange_node_id = 3;  // target exchange node id.
  PartitionType output_partition = 4; // output exchange partition type.
  FragmentStreamKind stream_kind = 5; // stream transport shape.
  FragmentEdgeKind edge_kind = 6;     // semantic edge kind.
  repeated int32 output_slot_ids = 7; // output slot ids crossing this edge.
}

// Semantic fragment edge kind.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message FragmentEdgeKind {
  oneof kind {
    bool stream = 1;                                      // true for a normal stream edge.
    CteMulticastEdge cte_multicast = 2;                   // CTE multicast edge metadata.
    IcebergChangeStreamRouterEdge iceberg_change_stream_router = 3; // Iceberg change-stream router edge metadata.
  }
}

// CTE multicast edge metadata.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message CteMulticastEdge {
  uint32 cte_id = 1;                                  // multicast CTE id.
  repeated uint32 receive_producer_column_ids = 2;    // producer columns received by this edge.
}

// Iceberg change-stream router edge metadata.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergChangeStreamRouterEdge {
  int32 router_group_id = 1;                  // router group id.
  int32 branch_id = 2;                        // branch id within the router group.
  ChangeStreamBranchKind branch_kind = 3;     // branch semantic kind.
}

// Stream transport shape for a fragment edge.
enum FragmentStreamKind {
  FRAGMENT_STREAM_KIND_UNSPECIFIED = 0;
  FRAGMENT_STREAM_KIND_GATHER = 1;
  FRAGMENT_STREAM_KIND_BROADCAST = 2;
  FRAGMENT_STREAM_KIND_PARTITIONED = 3;
  FRAGMENT_STREAM_KIND_OTHER = 4;
}

// Exchange receiver semantic flavor.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message ExchangeFlavor {
  oneof kind {
    bool distribution = 1;                      // true for a plain distribution exchange.
    LimitOffsetFlavor limit_offset = 2;         // limit/offset split exchange.
    TopNSplitFlavor topn_split = 3;             // TopN split exchange.
    CteMulticastFlavor cte_multicast = 4;       // CTE multicast exchange.
  }
}

// Limit/offset exchange flavor.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message LimitOffsetFlavor {
  optional int64 limit = 1;   // optional LIMIT.
  optional int64 offset = 2;  // optional OFFSET.
}

// TopN split exchange flavor.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message TopNSplitFlavor {
  repeated novarocks.expr.SortItem items = 1; // TopN ordering items.
  optional int64 limit = 2;                   // optional LIMIT.
  optional int64 offset = 3;                  // optional OFFSET.
}

// CTE multicast exchange flavor.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message CteMulticastFlavor {
  uint32 cte_id = 1;                                // multicast CTE id.
  repeated uint32 receive_producer_column_ids = 2;  // producer columns received by this exchange.
}

// Fragment sink payload. Detailed Iceberg sink fields are appended in Task B2.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message DataSink {
  oneof kind {
    bool result = 1;                                      // true for a result sink.
    bool noop = 2;                                        // true for a no-op sink.
    IcebergWriteFragmentSink iceberg_write = 3;           // Iceberg write sink.
    IcebergChangeStreamRouterSink iceberg_change_stream_router = 4; // Iceberg change-stream router sink.
    DataStreamSink data_stream = 5;                       // Exchange stream sink.
    MultiCastDataStreamSink multi_cast_data_stream = 6;   // CTE-style multicast stream sink.
  }
}

// Exchange stream sink payload.
// Owner: produced by FE/native plan encoder and consumed by BE/native plan
// prepare. Runtime destinations for normal stream sinks are carried by
// novarocks.InstanceParams because they are per fragment instance.
message DataStreamSink {
  int32 dest_node_id = 1;                 // destination exchange node id.
  DataPartition output_partition = 2;     // stream partitioning and hash exprs.
  repeated int32 output_columns = 3;      // optional projected output slot ids.
  optional int64 limit = 4;               // optional sender-side limit.
}

// Native destination copy for sink payloads that carry destinations per child
// sink, such as multicast.
message StreamDestination {
  novarocks.common.UniqueId finst_id = 1;
  string endpoint = 2;  // NovaRocks gRPC runtime endpoint host:port.
}

message StreamDestinationList {
  repeated StreamDestination destinations = 1;
}

message MultiCastDataStreamSink {
  repeated DataStreamSink sinks = 1;
  repeated StreamDestinationList destinations = 2;
}

// Iceberg write sink payload.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergWriteFragmentSink {
  string descriptor_database = 1;     // database used for descriptor naming.
  IcebergWriteSinkSpec spec = 2;      // write target and file-writing specification.
  IcebergWriteInputBinding input = 3; // mapping from fragment output to sink input.
}

// Iceberg change-stream router sink payload.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message IcebergChangeStreamRouterSink {
  int32 group_id = 1;                              // change-stream router group id.
  uint64 change_op_output_ordinal = 2;             // output ordinal carrying the change op.
  optional uint64 data_route_output_ordinal = 3;   // optional output ordinal carrying route choice.
  repeated IcebergChangeStreamBranchRoute branches = 4; // target writer branches.
}

// Join kind. Mirrors src/sql/common/expr.rs JoinKind.
enum JoinKind {
  JOIN_KIND_UNSPECIFIED = 0;
  JOIN_KIND_INNER = 1;
  JOIN_KIND_LEFT_OUTER = 2;
  JOIN_KIND_RIGHT_OUTER = 3;
  JOIN_KIND_FULL_OUTER = 4;
  JOIN_KIND_CROSS = 5;
  JOIN_KIND_LEFT_SEMI = 6;
  JOIN_KIND_RIGHT_SEMI = 7;
  JOIN_KIND_LEFT_ANTI = 8;
  JOIN_KIND_RIGHT_ANTI = 9;
  JOIN_KIND_NULL_AWARE_LEFT_ANTI = 10;
}

// Join distribution decision. Mirrors src/sql/optimizer/operator.rs.
enum JoinDistribution {
  JOIN_DISTRIBUTION_UNSPECIFIED = 0;
  JOIN_DISTRIBUTION_UNKNOWN = 1;
  JOIN_DISTRIBUTION_SHUFFLE = 2;
  JOIN_DISTRIBUTION_BROADCAST = 3;
  JOIN_DISTRIBUTION_COLOCATE = 4;
}

// Join execution mode for runtime filters. Mirrors runtime_filter.rs.
enum JoinExecutionMode {
  JOIN_EXECUTION_MODE_UNSPECIFIED = 0;
  JOIN_EXECUTION_MODE_BROADCAST = 1;
  JOIN_EXECUTION_MODE_PARTITIONED = 2;
  JOIN_EXECUTION_MODE_COLOCATE = 3;
}

// Aggregate execution mode. Mirrors src/sql/optimizer/operator.rs AggMode.
enum AggMode {
  AGG_MODE_UNSPECIFIED = 0;
  AGG_MODE_SINGLE = 1;
  AGG_MODE_LOCAL = 2;
  AGG_MODE_GLOBAL = 3;
  AGG_MODE_DISTINCT_GLOBAL = 4;
  AGG_MODE_DISTINCT_LOCAL = 5;
}

// TopN execution phase. Mirrors src/sql/optimizer/operator.rs TopNPhase.
enum TopNPhase {
  TOPN_PHASE_UNSPECIFIED = 0;
  TOPN_PHASE_PARTIAL = 1;
  TOPN_PHASE_FINAL = 2;
}

// Set operation kind. Mirrors src/sql/planner/plan.rs PlanSetOpKind.
enum PlanSetOpKind {
  PLAN_SET_OP_KIND_UNSPECIFIED = 0;
  PLAN_SET_OP_KIND_UNION_ALL = 1;
  PLAN_SET_OP_KIND_UNION_DISTINCT = 2;
  PLAN_SET_OP_KIND_INTERSECT = 3;
  PLAN_SET_OP_KIND_EXCEPT = 4;
}

// Iceberg change-stream branch kind. Mirrors src/sql/common/change_stream.rs.
enum ChangeStreamBranchKind {
  CHANGE_STREAM_BRANCH_KIND_UNSPECIFIED = 0;
  CHANGE_STREAM_BRANCH_KIND_DELETE_DV = 1;
  CHANGE_STREAM_BRANCH_KIND_REUSE_DATA = 2;
  CHANGE_STREAM_BRANCH_KIND_FRESH_DATA = 3;
}

// Hash partition source. Mirrors src/sql/optimizer/property.rs HashSource.
enum HashSource {
  HASH_SOURCE_UNSPECIFIED = 0;
  HASH_SOURCE_SHUFFLE_AGG = 1;
  HASH_SOURCE_SHUFFLE_JOIN = 2;
}

// Scan physical node.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message ScanNode {
  string database = 1;                                  // database name resolved by the analyzer.
  TableDef table = 2;                                   // resolved table definition.
  optional string alias = 3;                            // optional table alias.
  repeated novarocks.common.OutputColumn columns = 4;   // scan output columns.
  repeated novarocks.expr.Expr predicates = 5;          // scan predicates.
  repeated string required_columns = 6;                 // required physical column names.
  repeated ScanDictionaryColumn dict_columns = 7;       // dictionary rewrite columns.
  repeated ScanVariantColumn variant_columns = 8;       // variant-path synthetic columns.
  optional string mv_rewritten_from = 9;                // source MV name when rewritten.
}

// Low-cardinality dictionary scan column. Dictionary payload is opaque until
// the low-cardinality C0 arc owns the serialization format.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message ScanDictionaryColumn {
  string source_column = 1; // source string column name.
  string dict_column = 2;   // dictionary column name.
  bytes dictionary = 3;     // opaque dictionary snapshot payload.
}

// Variant-path synthetic scan column.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message ScanVariantColumn {
  uint32 source_column_id = 1;                    // source ColumnId.
  string source_column = 2;                       // source column name.
  uint32 synthetic_column_id = 3;                 // synthetic output ColumnId.
  string synthetic_column = 4;                    // synthetic output column name.
  string canonical_path = 5;                      // canonical variant path.
  novarocks.common.TypeDesc requested_type = 6;   // requested SQL type.
  bool strict = 7;                                // true when strict extraction is required.
}

// Filter physical node.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message FilterNode {
  novarocks.expr.Expr predicate = 1; // filter predicate.
}

// Project physical node.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message ProjectNode {
  repeated ProjectItem items = 1;        // projection items.
  optional string output_qualifier = 2;  // optional output qualifier.
}

// One projection item.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message ProjectItem {
  novarocks.expr.Expr expr = 1; // projected expression.
  string output_name = 2;       // display output name.
  uint32 output_column_id = 3;  // analyzer-minted output ColumnId.
}

// Sort physical node.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message SortNode {
  repeated novarocks.expr.SortItem items = 1;             // ordering items.
  repeated novarocks.expr.Expr analytic_partition_by = 2; // analytic partition keys.
  repeated novarocks.common.OutputColumn output_columns = 3; // sort output schema.
  optional int64 offset = 4;                              // optional OFFSET.
  optional uint64 partition_limit = 5;                    // optional per-partition limit.
  optional SortTopNType topn_type = 6;                    // optional ranking semantics for TopN.
}

// Sort TopN boundary semantics.
enum SortTopNType {
  SORT_TOPN_TYPE_UNSPECIFIED = 0;
  SORT_TOPN_TYPE_ROW_NUMBER = 1;
  SORT_TOPN_TYPE_RANK = 2;
  SORT_TOPN_TYPE_DENSE_RANK = 3;
}

// Limit physical node.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message LimitNode {
  optional int64 limit = 1;  // optional LIMIT.
  optional int64 offset = 2; // optional OFFSET.
}

// Values physical node.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message ValuesNode {
  repeated ExprList rows = 1;                            // rows of literal/constant expressions.
  repeated novarocks.common.OutputColumn columns = 2;    // output schema.
}

// Ordered expression list wrapper.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message ExprList {
  repeated novarocks.expr.Expr values = 1; // expressions in this list.
}

// Decode physical node for dictionary rewrite.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message DecodeNode {
  repeated DecodeMapping mappings = 1;                   // dictionary decode mappings.
  repeated novarocks.common.OutputColumn output_columns = 2; // decoded output schema.
}

// Low-cardinality dictionary decode mapping.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message DecodeMapping {
  uint32 source_column_id = 1; // encoded source ColumnId.
  uint32 output_column_id = 2; // decoded output ColumnId.
  string dict_column = 3;      // dictionary column name.
  string string_column = 4;    // decoded string column name.
}

// Repeat physical node for ROLLUP/CUBE/GROUPING SETS.
// Owner: produced by the future FE/native plan encoder and consumed by the
// future BE/native plan prepare layer.
message RepeatNode {
  repeated StringList repeat_column_ref_list = 1;     // non-null column names per repeat level.
  repeated UInt32List repeat_column_ref_ids = 2;      // non-null ColumnIds per repeat level.
  repeated uint64 grouping_ids = 3;                   // grouping id bitmap per repeat level.
