syntax = "proto3";

package novarocks.catalog;

// Immutable catalog content identity. The version is exactly 32 bytes at
// validated ingress and never carries a Frontend process generation.
message CatalogHandle {
  string catalog_name = 1;
  bytes version = 2;
}

enum CatalogProviderKind {
  CATALOG_PROVIDER_KIND_UNSPECIFIED = 0;
  CATALOG_PROVIDER_KIND_ICEBERG = 1;
  CATALOG_PROVIDER_KIND_STARROCKS = 2;
}

message CatalogProperty {
  string key = 1;
  string value = 2;
}

enum CatalogCredentialPurpose {
  CATALOG_CREDENTIAL_PURPOSE_UNSPECIFIED = 0;
  CATALOG_CREDENTIAL_PURPOSE_CATALOG_CONTROL = 1;
  CATALOG_CREDENTIAL_PURPOSE_OBJECT_STORE_DATA = 2;
}

enum CredentialConsumerRole {
  CREDENTIAL_CONSUMER_ROLE_UNSPECIFIED = 0;
  CREDENTIAL_CONSUMER_ROLE_FRONTEND = 1;
  CREDENTIAL_CONSUMER_ROLE_BACKEND = 2;
  CREDENTIAL_CONSUMER_ROLE_FRONTEND_AND_BACKEND = 3;
}

// Identity only: resolved credential values remain in role-local startup
// composition and never cross the native wire.
message StaticCredentialReference {
  string name = 1;
  string generation = 2;
}

message VendedCredential {}

message CatalogCredentialBinding {
  CatalogCredentialPurpose purpose = 1;
  CredentialConsumerRole consumer_role = 2;
  oneof mode {
    StaticCredentialReference static_credential = 3;
    VendedCredential vended_credential = 4;
  }
}

message CatalogProperties {
  CatalogHandle handle = 1;
  CatalogProviderKind provider_kind = 2;
  uint32 config_format_version = 3;
  repeated CatalogProperty execution_properties = 4;
  repeated CatalogCredentialBinding credential_bindings = 5;
}

// One exact, sorted query-wide contribution. It is carried by the request
// that establishes a query context, never by a separate Ensure RPC.
message CatalogSet {
  repeated CatalogProperties catalogs = 1;
}

// A complete reachable snapshot; partial or delta snapshots are invalid.
message PruneCatalogsRequest {
  repeated CatalogHandle reachable_catalogs = 1;
}

message PruneCatalogsAccepted {}

message PruneCatalogsRejected {
  string safe_detail = 1;
}

message PruneCatalogsResponse {
  oneof outcome {
    PruneCatalogsAccepted accepted = 1;
    PruneCatalogsRejected rejected = 2;
  }
}
