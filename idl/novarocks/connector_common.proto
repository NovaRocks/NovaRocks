syntax = "proto3";

import "catalog.proto";

package novarocks.connector_common;

// One provider-owned private payload category. The category selects a codec
// from the sealed provider definition; it does not select runtime authority.
enum ConnectorPayloadCategory {
  CONNECTOR_PAYLOAD_CATEGORY_UNSPECIFIED = 0;
  CONNECTOR_PAYLOAD_CATEGORY_READ_TABLE = 1;
  CONNECTOR_PAYLOAD_CATEGORY_READ_VIEW = 2;
  CONNECTOR_PAYLOAD_CATEGORY_READ_COLUMN = 3;
  CONNECTOR_PAYLOAD_CATEGORY_READ_SPLIT = 4;
  CONNECTOR_PAYLOAD_CATEGORY_WRITE_HANDLE = 5;
  CONNECTOR_PAYLOAD_CATEGORY_COMMIT_FRAGMENT = 6;
}

// Identity shared by all purpose-specific connector carriers.
message ConnectorEnvelopeHeader {
  string provider_id = 1;
  novarocks.catalog.CatalogHandle catalog = 2;
  ConnectorPayloadCategory category = 3;
  uint32 codec_revision = 4;
}

// A bounded provider-private encoding. Public scheduling, output and operation
// facts remain in their purpose-specific outer carriers.
message ConnectorEncodedPayload {
  ConnectorEnvelopeHeader header = 1;
  bytes payload = 2;
}
