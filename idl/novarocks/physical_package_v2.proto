// Complete public provider input paired with one actual physical scan node.
// Provider-private canonicalization authenticates this whole input separately;
// opaque payload bytes never stand in for these public facts.
message FrozenReadScan {
  optional uint32 node_id = 1;
  ConnectorReadRecipe recipe = 2;
  ConnectorScanFacts facts = 3;
  ConnectorReadPublicFacts public_facts = 4;
}
message ConnectorReadRecipe {
  optional uint32 provider_binding_id = 1;
  ConnectorRelationKind kind = 2;
  optional uint32 table_payload_id = 3;
  optional uint32 view_payload_id = 4;
  // Positional counterpart of assignments and the public schema fields.
  repeated uint32 column_payload_ids = 5;
}
message ConnectorScanFacts {
  repeated StaticScanAssignment assignments = 1;
  ScanTupleDomain enforced_predicate = 2;
  ScanTupleDomain unenforced_predicate = 3;
  optional uint32 remaining_connector_expression_id = 4;
  repeated StaticScanDynamicFilter dynamic_filters = 5;
  uint64 max_batch_rows = 6;
  uint64 max_batch_bytes = 7;
  reserved 8;
  reserved "work_source";
}
message StaticScanAssignment {
  string variable = 1;
  novarocks.connector_read.ValueType value_type = 2;
}
message StaticScanDynamicFilter {
  optional uint32 filter_id = 1;
  string variable = 2;
}
// Column identity here is an assignment/schema ordinal, not a payload or
// fragment-local ValueId. Ordinal zero is valid; unique entries are canonical.
message ScanTupleDomain {
  oneof kind {
    novarocks.physical_control_v2.Empty all = 1;
    novarocks.physical_control_v2.Empty none = 2;
    ScanColumnDomains columns = 3;
  }
}
message ScanColumnDomains { repeated ScanColumnDomain entries = 1; }
message ScanColumnDomain {
  uint32 column_ordinal = 1;
  novarocks.connector_read.Domain domain = 2;
}
message ConnectorReadPublicFacts {
  ConnectorReadStaticFacts source = 1;
  optional string metadata_kind = 2;
  // Retired single-schema and root-label execution authors. Complete value
  // meaning and provider source facts occupy distinct mandatory namespaces.
  reserved 3, 4;
  reserved "schema_id", "logical_types";
  // Distinct execution and source owners; neither reference substitutes for the other.
  optional uint32 execution_schema_id = 5;
  optional uint32 source_schema_id = 6;
}
// A shape is an ordered metadata-free SchemaDefinition, with provider names
// and physical structure. It is never a declaration of execution semantics.
message PublicSourceSchemaFactsDefinition {
  optional uint32 id = 1;
  optional uint32 source_shape_schema_id = 2;
  repeated novarocks.arrow_type.ArrowFieldMetadataEntry schema_attributes = 3;
  repeated PublicSourceFieldFactsDefinition field_facts = 4;
}
message PublicSourceFieldFactsDefinition {
  // Root occurrence, then physical Arrow Field ordinals. Map includes entries;
  // Union uses ordered occurrence, never its semantic type ID.
  repeated uint32 field_path = 1;
  optional sint32 field_id = 2;
  SourceInitialDefault initial_default = 3;
  // Extracted typed IDs/defaults cannot also appear in these remaining attributes.
  repeated novarocks.arrow_type.ArrowFieldMetadataEntry attributes = 4;
}
message SourceInitialDefault {
  // Provider-authored canonical JSON; the generic contract does not derive it
  // by interpreting an arbitrary metadata key or supply an absent default.
  optional string json = 1;
}

message ConnectorReadStaticFacts {
  bytes input_version = 1;
  bytes selection_digest = 2;
  ConnectorReadProperties properties = 3;
  ConnectorReadArtifactCoverage artifact_coverage = 4;
  bytes coverage_evidence = 5;
}
// This existing provider public evidence remains distinct from the retired
// physical-plan sealed artifact placeholder graph.
message ConnectorReadArtifactCoverage {
  oneof kind {
    novarocks.physical_control_v2.Empty no_artifact_inputs = 1;
    ConnectorReadExactArtifactCoverage exact = 2;
  }
}
message ConnectorReadExactArtifactCoverage {
  bytes source_selection_digest = 1;
  bytes content_digest = 2;
  bytes evidence = 3;
}
message ConnectorReadProperties {
  ConnectorReadDistribution distribution = 1;
  repeated ConnectorReadOrderingKey ordering = 2;
}
// The provider's existing distribution vocabulary has its own algorithms and
// bucket proof domain. It is not an engine exchange Distribution.
message ConnectorReadDistribution {
  oneof kind {
    novarocks.physical_control_v2.Empty unconstrained = 1;
    novarocks.physical_control_v2.Empty singleton = 2;
    novarocks.physical_control_v2.Empty round_robin = 3;
    ConnectorReadHashDistribution hash = 4;
    ConnectorReadBucketDistribution bucket_shuffle = 5;
  }
}
message ConnectorReadHashDistribution {
  repeated uint32 key_column_ordinals = 1;
  bytes partition_space = 2;
  ConnectorReadPartitionCountDomain admissible = 3;
  ConnectorReadPartitionHash algorithm = 4;
}
message ConnectorReadPartitionCountDomain {
  uint32 min = 1;
  uint32 max = 2;
  bool requires_power_of_two = 3;
}
message ConnectorReadBucketDistribution {
  repeated uint32 key_column_ordinals = 1;
  bytes partition_space = 2;
  uint32 bucket_count = 3;
  ConnectorReadPartitionHash hash = 4;
  ConnectorReadBucketLayout layout = 5;
  bytes ordinal_domain_evidence = 6;
}
enum ConnectorReadPartitionHash {
  CONNECTOR_READ_PARTITION_HASH_UNSPECIFIED = 0;
  CONNECTOR_READ_PARTITION_HASH_XX_HASH_64 = 1;
  CONNECTOR_READ_PARTITION_HASH_MURMUR_3_X64_128 = 2;
}
enum ConnectorReadBucketLayout {
  CONNECTOR_READ_BUCKET_LAYOUT_UNSPECIFIED = 0;
  CONNECTOR_READ_BUCKET_LAYOUT_DIRECT_MODULO = 1;
  CONNECTOR_READ_BUCKET_LAYOUT_JUMP_CONSISTENT = 2;
}
message ConnectorReadOrderingKey {
  uint32 column_ordinal = 1;
  SortDirection direction = 2;
  NullOrdering null_ordering = 3;
}

// Flat form of the existing provider residual-expression algebra. Names here
// are provider public ConnectorFunctionName, never engine function resolution.
// IDs are a package-wide namespace separate from engine ExpressionDefinition.
message ConnectorExpressionDefinition {
  uint32 id = 1;
  oneof kind {
    ConnectorConstantExpression constant = 2;
    ConnectorVariableExpression variable = 3;
    ConnectorFieldDereferenceExpression field_dereference = 4;
    ConnectorCallExpression call = 5;
  }
}
message ConnectorConstantExpression {
  novarocks.connector_read.ValueType value_type = 1;
  novarocks.connector_read.Value value = 2; // Absent is typed NULL.
}
message ConnectorVariableExpression {
  string name = 1;
  novarocks.connector_read.ValueType value_type = 2;
}
message ConnectorFieldDereferenceExpression {
  optional uint32 target_connector_expression_id = 1;
  uint32 field_index = 2;
  novarocks.connector_read.ValueType value_type = 3;
}
message ConnectorCallExpression {
  string function_name = 1;
  novarocks.connector_read.ValueType value_type = 2;
  repeated uint32 argument_connector_expression_ids = 3;
}

message FrozenWriterRecipe {
  optional uint32 node_id = 1;
  optional uint32 provider_binding_id = 2;
  optional uint32 handle_payload_id = 3;
  ConnectorWriteInputShape input = 4;
}
// All five existing provider roles retain ordered, exact Arrow Field references.
// No coarse comparable type, packed role guess or runtime writer is encoded.
// Writer schema depth/aggregate-byte bounds belong to its existing owner; the
// decoder must not apply the read owner's unrelated per-type node-count gate.
message ConnectorWriteInputShape {
  oneof kind {
    ConnectorWriteDataInput data = 1;
    ConnectorWriteRowLineageInput row_lineage = 2;
    ConnectorWritePositionDeleteInput position_delete = 3;
    ConnectorWriteDeletionVectorInput deletion_vector = 4;
    ConnectorWriteEqualityDeleteInput equality_delete = 5;
  }
}
message ConnectorWriteFieldBinding {
  bytes field_token = 1;
  optional uint32 source_field_id = 2;
  // Genuine complete execution projection, separate from source attributes.
  optional uint32 value_type_id = 3;
}
message ConnectorWriteDataInput {
  repeated ConnectorWriteFieldBinding fields = 1;
}
message ConnectorWriteRowLineageInput {
  repeated ConnectorWriteFieldBinding data_fields = 1;
  repeated ConnectorWriteFieldBinding row_identity_fields = 2;
}
message ConnectorWritePositionDeleteInput {
  repeated ConnectorWriteFieldBinding identity_fields = 1;
  repeated ConnectorWriteFieldBinding partition_source_fields = 2;
}
message ConnectorWriteDeletionVectorInput {
  repeated ConnectorWriteFieldBinding identity_fields = 1;
  repeated ConnectorWriteFieldBinding partition_source_fields = 2;
}
message ConnectorWriteEqualityDeleteInput {
  repeated ConnectorWriteFieldBinding equality_fields = 1;
}
