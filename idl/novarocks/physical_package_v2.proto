// Runtime-filter remote endpoints are immutable contract facts, not remote
// execution graphs. The local decoder validates local obligations and cuts.
message RuntimeFilter {
  optional uint32 id = 1;
  RuntimeFilterKind kind = 2;
  RuntimeFilterDomain domain = 3;
  RuntimeFilterLifecycle lifecycle = 4;
  RuntimeFilterReduction reduction = 5;
  RuntimeFilterCoverage availability_coverage = 6;
  RuntimeFilterCoverage terminal_coverage = 7;
  repeated RuntimeFilterEqualityWitness equality_witnesses = 8;
  repeated RuntimeFilterProducer producers = 9;
  repeated RuntimeFilterConsumer consumers = 10;
  RuntimeFilterPolicy policy = 11;
}
enum RuntimeFilterKind {
  RUNTIME_FILTER_KIND_UNSPECIFIED = 0;
  RUNTIME_FILTER_KIND_BLOOM = 1;
  RUNTIME_FILTER_KIND_MIN_MAX = 2;
  RUNTIME_FILTER_KIND_IN_LIST = 3;
}
enum RuntimeFilterNullSemantics {
  RUNTIME_FILTER_NULL_SEMANTICS_UNSPECIFIED = 0;
  RUNTIME_FILTER_NULL_SEMANTICS_NEVER_MATCHES = 1;
  RUNTIME_FILTER_NULL_SEMANTICS_NULL_SAFE_EQUAL = 2;
}
message RuntimeFilterDomain {
  oneof kind {
    RuntimeFilterMembershipDomain membership = 1;
    RuntimeFilterOrderedDomain ordered = 2;
  }
}
message RuntimeFilterMembershipDomain {
  optional uint32 value_type_id = 1;
  RuntimeFilterNullSemantics null_semantics = 2;
}
message RuntimeFilterOrderedDomain {
  RuntimeFilterOrderKey key = 1;
  bool inclusive = 2;
  OrderedComparisonAlgorithm comparator = 3;
}
message RuntimeFilterOrderKey {
  optional uint32 value_type_id = 1;
  SortDirection direction = 2;
  NullOrdering null_ordering = 3;
}
enum RuntimeFilterContributionKind {
  RUNTIME_FILTER_CONTRIBUTION_KIND_UNSPECIFIED = 0;
  RUNTIME_FILTER_CONTRIBUTION_KIND_VALUE_DOMAIN_DELTA = 1;
  RUNTIME_FILTER_CONTRIBUTION_KIND_FINAL_DOMAIN_SHARD = 2;
  RUNTIME_FILTER_CONTRIBUTION_KIND_ORDERED_BOUND_UPDATE = 3;
  RUNTIME_FILTER_CONTRIBUTION_KIND_FINAL_ORDERED_HULL_SHARD = 4;
  RUNTIME_FILTER_CONTRIBUTION_KIND_PRODUCER_CLOSED = 5;
}
enum RuntimeFilterLifecycle {
  RUNTIME_FILTER_LIFECYCLE_UNSPECIFIED = 0;
  RUNTIME_FILTER_LIFECYCLE_COMPLETE_ONCE = 1;
  RUNTIME_FILTER_LIFECYCLE_MONOTONIC_UPDATES = 2;
}
enum RuntimeFilterReduction {
  RUNTIME_FILTER_REDUCTION_UNSPECIFIED = 0;
  RUNTIME_FILTER_REDUCTION_SET_UNION = 1;
  RUNTIME_FILTER_REDUCTION_TIGHTEN_ORDERED_BOUND = 2;
  RUNTIME_FILTER_REDUCTION_UNION_ORDERED_HULL = 3;
}
enum RuntimeFilterCompletion {
  RUNTIME_FILTER_COMPLETION_UNSPECIFIED = 0;
  RUNTIME_FILTER_COMPLETION_PRODUCER_CLOSED = 1;
  RUNTIME_FILTER_COMPLETION_FENCED_COMMITTED_DOMAIN = 2;
