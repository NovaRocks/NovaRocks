syntax = "proto3";

package novarocks.physical_package_v2;

import "catalog.proto";
import "common.proto";
import "connector_common.proto";
import "connector_read.proto";
import "physical_type_v2.proto";
import "physical_control_v2.proto";
import "physical_semantics_v2.proto";
import "arrow_type.proto";
import "call_request.proto";
import "result.proto";

// One immutable, task-independent local package. This does not carry remote
// execution graphs, prepared handles, live providers, placement or capabilities.
// Tables are sparse definition namespaces: zero/MAX IDs are valid; entry count,
// not maximum ID, bounds storage. Singular references require presence and all
// ordered occurrences/repeated references survive. Duplicate definitions fail.
// The typed decoder must check all required components, closed variants and exact
// field correspondences before the existing checked public constructors run.
message FragmentPackage {
  bytes plan_version = 1; // Exactly 16 bytes; the all-zero value is invalid.
  RequiredContracts required = 2;
  Fragment fragment = 3;
  novarocks.physical_type_v2.TypeTable types = 4;
  repeated SchemaDefinition schemas = 5;
  repeated novarocks.call_request.IpcConstantPool constants = 6;
  repeated FunctionBindingDefinition function_bindings = 7;
  repeated AggregateBindingDefinition aggregate_bindings = 8;
  repeated ProviderBindingDefinition provider_bindings = 9;
  repeated ConnectorPayloadDefinition provider_payloads = 10;
  repeated ProviderReadReferenceDefinition read_references = 11;
  repeated RelationDefinition relations = 12;
  novarocks.physical_control_v2.ExpressionControl expression_control = 13;
  novarocks.physical_semantics_v2.FrozenCalls calls = 14;
  novarocks.physical_semantics_v2.FrozenPruning pruning = 15;
  novarocks.physical_semantics_v2.SemanticParameters parameters = 16;
  FragmentCuts cuts = 17;
  ResultPort result = 18;
  repeated FrozenReadScan scans = 19;
  repeated FrozenWriterRecipe writes = 20;
  repeated PlanAnnotation annotations = 21;
  // Provider public residual expressions use this separate real vocabulary;
  // these IDs do not name engine expressions or engine function overloads.
  repeated ConnectorExpressionDefinition connector_expressions = 22;
  // Provider-authored source facts have a separate sparse namespace.
  repeated PublicSourceSchemaFactsDefinition public_source_schemas = 23;
  novarocks.physical_type_v2.SourceFieldTable source_fields = 24;
}
message RequiredContracts { uint32 plan_contract_revision = 1; }
message Fragment {
  uint32 id = 1;
  optional uint32 root_node_id = 2;
  repeated ValueDefinition values = 3;
  repeated ExpressionDefinition expressions = 4;
  repeated PhysicalNode nodes = 5;
  FragmentSink sink = 6;
  PipelineDopDomain dop_domain = 7;
  repeated uint32 runtime_filter_ids = 8;
  // Required even for a call-free fragment: absent is not an empty table.
  novarocks.call_request.FragmentCallRequests call_requests = 9;
  StagePlacementPolicy stage_placement = 10;
  repeated SummaryOutput summaries = 11;
}

// Exact placement policy; edge distribution never supplies an implicit width.
message StagePlacementPolicy {
  oneof kind {
    novarocks.physical_control_v2.Empty singleton = 1;
    novarocks.physical_control_v2.Empty scan_work = 2;
    SpreadStagePlacement spread = 3;
    FollowSourcesStagePlacement follow_sources = 4;
  }
}
message SpreadStagePlacement { optional uint32 max_instances = 1; }
message FollowSourcesStagePlacement { repeated uint32 fragment_ids = 1; }

message PipelineDopDomain {
  uint32 min = 1;
  uint32 max = 2;
  bool requires_power_of_two = 3;
}
// Metadata-free execution/source shape. Original schema annotations belong to
// PublicSourceSchemaFactsDefinition, independently of this shape namespace.
message SchemaDefinition {
  uint32 id = 1;
  repeated uint32 field_ids = 2;
  reserved 3;
  reserved "metadata";
}

// Exact definitions only. Old binding volatility/evaluation/error bits and
// semantic_parameters are migration projections, not another wire authority.
// Full effects and frozen environments belong to actual occurrence entries.
message FunctionBindingDefinition {
  uint32 id = 1;
  string function_id = 2;
  string overload_id = 3;
  FunctionKind kind = 4;
  repeated FunctionArgumentType arguments = 5;
  oneof result {
    uint32 scalar_value_type_id = 6;
    RelationResultTypes relation = 7;
  }
}
enum FunctionKind {
  FUNCTION_KIND_UNSPECIFIED = 0;
  FUNCTION_KIND_SCALAR = 1;
  FUNCTION_KIND_AGGREGATE = 2;
  FUNCTION_KIND_WINDOW = 3;
  FUNCTION_KIND_TABLE = 4;
}
message FunctionArgumentType {
  oneof kind {
    uint32 value_type_id = 1;
    novarocks.call_request.LambdaArgumentType lambda = 2;
  }
}

message RelationResultTypes { repeated uint32 value_type_ids = 1; }
message AggregateBindingDefinition {
  uint32 id = 1;
  optional uint32 function_binding_id = 2;
  AggregatePhase phase = 3;
  uint32 logical_argument_count = 4;
  optional uint32 intermediate_value_type_id = 5;
  string state_format = 6;
  novarocks.common.AggregateStateArgumentContract state_argument_contract = 7;
  AggregateStateInterpretation state_interpretation = 8;
}
message AggregateStateInterpretation {
  optional bool distinct = 1;
  repeated AggregateStateOrderKey order_keys = 2;
}
message AggregateStateOrderKey {
  optional bool ascending = 1;
  optional bool nulls_first = 2;
}

message AggregatePhase {
  oneof kind {
    novarocks.physical_control_v2.Empty single = 1;
    uint32 partial_sequence_id = 2;
    uint32 intermediate_sequence_id = 3;
    uint32 final_sequence_id = 4;
  }
}
message TopNPhase {
  oneof kind {
    novarocks.physical_control_v2.Empty single = 1;
    uint32 partial_sequence_id = 2;
    uint32 final_sequence_id = 3;
  }
}
message ProviderBindingDefinition {
  uint32 id = 1;
  string provider_id = 2;
  string instance_id = 3;
  novarocks.catalog.CatalogHandle catalog = 4;
}
message ConnectorPayloadDefinition {
  uint32 id = 1;
  novarocks.connector_common.ConnectorEncodedPayload payload = 2;
}
message ProviderReadReferenceDefinition {
  uint32 id = 1;
  optional uint32 provider_binding_id = 2;
  bytes input_version = 3;
  ConnectorRelationKind kind = 4;
  optional uint32 table_payload_id = 5;
  optional uint32 view_payload_id = 6;
}
enum ConnectorRelationKind {
  CONNECTOR_RELATION_KIND_UNSPECIFIED = 0;
  CONNECTOR_RELATION_KIND_TABLE = 1;
  CONNECTOR_RELATION_KIND_TABLE_FUNCTION = 2;
  CONNECTOR_RELATION_KIND_CHANGE_WINDOW = 3;
  CONNECTOR_RELATION_KIND_SYSTEM_TABLE = 4;
  CONNECTOR_RELATION_KIND_TABLE_EXECUTE = 5;
  CONNECTOR_RELATION_KIND_MERGE_TABLE = 6;
}
message RelationDefinition {
  uint32 id = 1;
  oneof kind {
    DataRelation data = 2;
    MetadataRelation metadata = 3;
  }
}
message DataRelation {
  optional uint32 read_reference_id = 1;
  reserved 2;
  reserved "work_source";
  bytes selection_digest = 3; // Exactly 32 bytes.
  repeated RelationField schema = 4;
  repeated PredicateGuarantee predicate_guarantees = 5;
  PhysicalProperties provided_properties = 6;
}
message MetadataRelation {
  string kind = 1;
  optional uint32 read_reference_id = 2;
  reserved 3;
  reserved "work_source";
  bytes selection_digest = 4;
  repeated RelationField schema = 5;
  repeated PredicateGuarantee predicate_guarantees = 6;
  PhysicalProperties provided_properties = 7;
  bytes coverage_evidence = 8;
}
message RelationField {
  optional uint32 column_payload_id = 1;
  optional uint32 value_type_id = 2;
}
message PredicateGuarantee {
  optional uint32 predicate_expr_id = 1;
  PredicateGuaranteeKind kind = 2;
}
enum PredicateGuaranteeKind {
  PREDICATE_GUARANTEE_KIND_UNSPECIFIED = 0;
  PREDICATE_GUARANTEE_KIND_EXACT = 1;
  PREDICATE_GUARANTEE_KIND_PRUNING_ONLY = 2;
}
message ValueDefinition {
  uint32 id = 1;
  optional uint32 value_type_id = 2;
  ValueOrigin origin = 3;
}
message ValueOrigin {
  reserved 10;
  reserved "logical_summary";
  oneof kind {
    ProviderFieldOrigin provider_field = 1;
    ExpressionOrigin expression = 2;
    NullExtendedOrigin null_extended = 3;
    AggregateStateOrigin aggregate_state = 4;
    uint32 aggregate_result_call_id = 5;
    NodeOutputOrigin node_output = 6;
    ExchangeImportOrigin exchange_import = 7;
    CteImportOrigin cte_import = 8;
    WriterDerivedOrigin writer_derived = 9;
    SummaryField summary = 12;
    uint32 join_mark_node_id = 11;
  }
}
enum SummaryKind {
  SUMMARY_KIND_UNSPECIFIED = 0;
  SUMMARY_KIND_WRITE_COUNTS = 1;
  SUMMARY_KIND_DELETE_VERIFICATION = 2;
}
message SummaryField {
  SummaryKind kind = 1;
  optional uint32 ordinal = 2;
}
message SummaryColumns {
  SummaryKind kind = 1;
  repeated uint32 value_ids = 2;
}
message SummaryAuthor {
  oneof kind {
    novarocks.physical_control_v2.Empty router_sink = 1;
    uint32 node_id = 2;
  }
}
message SummaryOutput {
  optional uint32 edge_id = 1;
  SummaryColumns columns = 2;
  SummaryAuthor author = 3;
}
message SummaryCut {
  SummaryColumns source = 1;
  SummaryColumns destination = 2;
}
enum FragmentOutputPort {
  reserved 2;
  reserved "FRAGMENT_OUTPUT_PORT_LOGICAL_SUMMARY";
  FRAGMENT_OUTPUT_PORT_UNSPECIFIED = 0;
  FRAGMENT_OUTPUT_PORT_ROOT = 1;
  FRAGMENT_OUTPUT_PORT_SUMMARY_WRITE_COUNTS = 3;
  FRAGMENT_OUTPUT_PORT_SUMMARY_DELETE_VERIFICATION = 4;
}
enum DeliveryRequirement {
  DELIVERY_REQUIREMENT_UNSPECIFIED = 0;
  DELIVERY_REQUIREMENT_DEMAND_DRIVEN = 1;
  DELIVERY_REQUIREMENT_MUST_DRAIN = 2;
}
message ProviderFieldOrigin {
  optional uint32 scan_node_id = 1;
  optional uint32 column_payload_id = 2;
}
message ExpressionOrigin {
  optional uint32 node_id = 1;
  optional uint32 expr_id = 2;
}
message NullExtendedOrigin {
  optional uint32 node_id = 1;
  optional uint32 original_value_id = 2;
}
message AggregateStateOrigin {
  optional uint32 call_id = 1;
  AggregatePhase phase = 2;
}
message NodeOutputOrigin {
  optional uint32 node_id = 1;
  uint32 output_ordinal = 2;
}
message ExchangeImportOrigin {
  optional uint32 edge_id = 1;
  optional uint32 source_value_id = 2;
}
message CteImportOrigin {
  optional uint32 edge_id = 1;
  optional uint32 producer_fragment_id = 2;
  optional uint32 producer_value_id = 3;
}
message WriterDerivedOrigin {
  optional uint32 writer_node_id = 1;
  WriterDerivedKind kind = 2;
}
enum WriterDerivedKind {
  WRITER_DERIVED_KIND_UNSPECIFIED = 0;
  WRITER_DERIVED_KIND_RELATION_KIND = 1;
  WRITER_DERIVED_KIND_AFFECTED_ROWS = 2;
  WRITER_DERIVED_KIND_COMMIT_FRAGMENT = 3;
  WRITER_DERIVED_KIND_CHANGE_EVENT = 4;
  WRITER_DERIVED_KIND_RELATION_AUXILIARY = 5;
  WRITER_DERIVED_KIND_WRITE_TARGET_ORDINAL = 6;
  WRITER_DERIVED_KIND_GROUPING_KEY = 7;
}
message ExpressionDefinition {
  uint32 id = 1;
  optional uint32 owner_node_id = 2;
  optional uint32 lambda_scope_expr_id = 3;
  optional uint32 value_type_id = 4;
  oneof kind {
    uint32 value_id = 5;
    LambdaParameter lambda_parameter = 6;
    novarocks.call_request.ConstantReference literal = 7;
    UnaryExpression unary = 8;
    BinaryExpression binary = 9;
    ExpressionIds conjunction = 10;
    ExpressionIds disjunction = 11;
    FunctionCall function_call = 12;
    LambdaExpression lambda = 13;
    CastExpression cast = 14;
    IsNullExpression is_null = 15;
    InListExpression in_list = 16;
    BetweenExpression between = 17;
    LikeExpression like = 18;
    CaseExpression case_expression = 19;
    TruthValueExpression is_truth_value = 20;
    WindowCall window_call = 21;
  }
}
message ExpressionIds { repeated uint32 expr_ids = 1; }
message ValueIds { repeated uint32 value_ids = 1; }
message LambdaParameter {
  optional uint32 lambda_expr_id = 1;
  uint32 ordinal = 2;
}
message UnaryExpression {
  UnaryOperator op = 1;
  optional uint32 expr_id = 2;
}
enum UnaryOperator {
  UNARY_OPERATOR_UNSPECIFIED = 0;
  UNARY_OPERATOR_PLUS = 1;
  UNARY_OPERATOR_MINUS = 2;
  UNARY_OPERATOR_NOT = 3;
  UNARY_OPERATOR_BITWISE_NOT = 4;
}
message BinaryExpression {
  optional uint32 left_expr_id = 1;
  BinaryOperator op = 2;
  optional uint32 right_expr_id = 3;
  novarocks.physical_semantics_v2.DecimalOverflowPolicy decimal_overflow_policy = 4;
  // Required for all five arithmetic operations; absent for comparison/bitwise.
  // The typed decoder checks the closed AllowThrowException key and resolves
  // this exact lexical reference from the package's sole parameter table.
  novarocks.physical_semantics_v2.SemanticParameterRef allow_throw_exception = 5;
}
enum BinaryOperator {
  BINARY_OPERATOR_UNSPECIFIED = 0;
  BINARY_OPERATOR_ADD = 1;
  BINARY_OPERATOR_SUBTRACT = 2;
  BINARY_OPERATOR_MULTIPLY = 3;
  BINARY_OPERATOR_DIVIDE = 4;
  BINARY_OPERATOR_MODULO = 5;
  BINARY_OPERATOR_EQ = 6;
  BINARY_OPERATOR_EQ_FOR_NULL = 7;
  BINARY_OPERATOR_NOT_EQ = 8;
  BINARY_OPERATOR_LT = 9;
  BINARY_OPERATOR_LT_EQ = 10;
  BINARY_OPERATOR_GT = 11;
  BINARY_OPERATOR_GT_EQ = 12;
  BINARY_OPERATOR_BIT_AND = 13;
  BINARY_OPERATOR_BIT_OR = 14;
  BINARY_OPERATOR_BIT_XOR = 15;
}
message FunctionCall {
  optional uint32 function_binding_id = 1;
  repeated uint32 argument_expr_ids = 2;
}
message LambdaExpression {
  repeated uint32 parameter_value_type_ids = 1;
  optional uint32 body_expr_id = 2;
}
message CastExpression {
  optional uint32 expr_id = 1;
  optional uint32 target_carrier_type_id = 2;
  novarocks.physical_semantics_v2.DecimalOverflowPolicy decimal_overflow_policy = 3;
  // Required: absence is not false. The reference retains the original scope,
  // independently of the frozen DecimalOverflowPolicy enum above.
  novarocks.physical_semantics_v2.SemanticParameterRef allow_throw_exception = 4;
}
message IsNullExpression {
  optional uint32 expr_id = 1;
  bool negated = 2;
}
message InListExpression {
  optional uint32 expr_id = 1;
  repeated uint32 list_expr_ids = 2;
  bool negated = 3;
}
message BetweenExpression {
  optional uint32 expr_id = 1;
  optional uint32 low_expr_id = 2;
  optional uint32 high_expr_id = 3;
  bool negated = 4;
}
message LikeExpression {
  optional uint32 expr_id = 1;
  optional uint32 pattern_expr_id = 2;
  bool negated = 3;
}
message CaseExpression {
  optional uint32 operand_expr_id = 1;
  repeated WhenThen arms = 2;
  optional uint32 else_expr_id = 3;
}
message WhenThen {
  optional uint32 when_expr_id = 1;
  optional uint32 then_expr_id = 2;
}
message TruthValueExpression {
  optional uint32 expr_id = 1;
  bool value = 2;
  bool negated = 3;
}
message WindowCall {
  optional uint32 function_binding_id = 1;
  bool distinct = 2;
  repeated uint32 argument_expr_ids = 3;
  repeated SortExpression function_order_by = 4;
  WindowFrame frame = 5;
  bool ignore_nulls = 6;
  optional uint32 aggregate_binding_id = 7;
}
message SortExpression {
  optional uint32 expr_id = 1;
  SortDirection direction = 2;
  NullOrdering null_ordering = 3;
}
enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASCENDING = 1;
  SORT_DIRECTION_DESCENDING = 2;
}
enum NullOrdering {
  NULL_ORDERING_UNSPECIFIED = 0;
  NULL_ORDERING_FIRST = 1;
  NULL_ORDERING_LAST = 2;
}
message WindowFrame {
  WindowFrameUnits units = 1;
  WindowBound start = 2;
  WindowBound end = 3;
  WindowFrameExclusion exclusion = 4;
}
message WindowBound {
  oneof kind {
    novarocks.physical_control_v2.Empty unbounded_preceding = 1;
    uint32 preceding_expr_id = 2;
    novarocks.physical_control_v2.Empty current_row = 3;
    uint32 following_expr_id = 4;
    novarocks.physical_control_v2.Empty unbounded_following = 5;
  }
}
enum WindowFrameUnits {
  WINDOW_FRAME_UNITS_UNSPECIFIED = 0;
  WINDOW_FRAME_UNITS_ROWS = 1;
  WINDOW_FRAME_UNITS_RANGE = 2;
  WINDOW_FRAME_UNITS_GROUPS = 3;
}
enum WindowFrameExclusion {
  WINDOW_FRAME_EXCLUSION_UNSPECIFIED = 0;
  WINDOW_FRAME_EXCLUSION_NO_OTHERS = 1;
  WINDOW_FRAME_EXCLUSION_CURRENT_ROW = 2;
  WINDOW_FRAME_EXCLUSION_GROUP = 3;
  WINDOW_FRAME_EXCLUSION_TIES = 4;
}
message PhysicalProperties {
  Distribution distribution = 1;
  RowMultiplicity row_multiplicity = 2;
  repeated OrderingKey ordering = 3;
}
enum RowMultiplicity {
  ROW_MULTIPLICITY_UNSPECIFIED = 0;
  ROW_MULTIPLICITY_SINGLE_COPY = 1;
  ROW_MULTIPLICITY_REPLICATED = 2;
}
message OrderingKey {
  optional uint32 value_id = 1;
  SortDirection direction = 2;
  NullOrdering null_ordering = 3;
}
message Distribution {
  oneof kind {
    novarocks.physical_control_v2.Empty unconstrained = 1;
    novarocks.physical_control_v2.Empty singleton = 2;
    novarocks.physical_control_v2.Empty round_robin = 3;
    novarocks.physical_control_v2.Empty broadcast = 4;
    HashDistribution hash = 5;
    BucketDistribution bucket_shuffle = 6;
    ConditionalKeyDistribution conditional_key = 7;
  }
}
message HashDistribution {
  repeated uint32 key_value_ids = 1;
  HashPartitionScheme scheme = 2;
}
// TRUE rows use the signed hierarchy; FALSE/NULL bypass it with per-row
// round-robin at both levels. The mask is not an additional hash key.
message ConditionalKeyDistribution {
  optional uint32 applies_value_id = 1;
  repeated uint32 key_value_ids = 2;
  HashPartitionScheme scheme = 3;
}
message HashPartitionScheme {
  bytes partition_space = 1; // Exact32bytes identity, not a node ID.
  PartitionCountParameter count = 2;
  PartitionHashAlgorithm algorithm = 3;
}
message PartitionCountParameter {
  bytes id = 1; // Exact32bytes identity.
  PartitionCountDomain admissible = 2;
}
message PartitionCountDomain {
  uint32 min = 1;
  uint32 max = 2;
  bool requires_power_of_two = 3;
}
message BucketDistribution {
  repeated uint32 key_value_ids = 1;
  BucketPartitionScheme scheme = 2;
}
message BucketPartitionScheme {
  bytes partition_space = 1;
  uint32 bucket_count = 2;
  PartitionHashAlgorithm hash = 3;
  BucketLayoutAlgorithm layout = 4;
  BucketOrdinalDomainProof ordinal_domain = 5;
}
message BucketOrdinalDomainProof {
  uint32 first_ordinal = 1;
  uint32 ordinal_count = 2;
  bytes evidence_digest = 3;
}
enum PartitionHashAlgorithm {
  PARTITION_HASH_ALGORITHM_UNSPECIFIED = 0;
  PARTITION_HASH_ALGORITHM_NATIVE_EXCHANGE_V1 = 1;
  PARTITION_HASH_ALGORITHM_NATIVE_BUCKET_CRC32_V1 = 2;
  PARTITION_HASH_ALGORITHM_NATIVE_HIERARCHICAL_V1 = 3;
}
enum BucketLayoutAlgorithm {
  BUCKET_LAYOUT_ALGORITHM_UNSPECIFIED = 0;
  BUCKET_LAYOUT_ALGORITHM_DENSE_ZERO_BASED_V1 = 1;
}
enum OrderedComparisonAlgorithm {
  ORDERED_COMPARISON_ALGORITHM_UNSPECIFIED = 0;
  ORDERED_COMPARISON_ALGORITHM_NATIVE_SCALAR_ORDER_V1 = 1;
}

message PhysicalNode {
  uint32 id = 1;
  repeated uint32 input_node_ids = 2;
  repeated PhysicalProperties required_inputs = 3;
  PhysicalProperties output_properties = 4;
  OutputPort output = 5;
  oneof kind {
    ScanNode scan = 6;
    FilterNode filter = 7;
    ProjectNode project = 8;
    AggregateNode aggregate = 9;
    HashJoinNode hash_join = 10;
    NestLoopJoinNode nest_loop_join = 11;
    SortNode sort = 12;
    TopNNode top_n = 13;
    LimitNode limit = 14;
    WindowNode window = 15;
    SetOperationNode set_operation = 16;
    ValuesNode values = 17;
    RepeatNode repeat = 18;
    UnpivotNode unpivot = 19;
    GenerateSeriesNode generate_series = 20;
    TableFunctionNode table_function = 21;
    RowCountAssertionNode assert_one_row = 22;
    ChangeEventExpandNode change_event_expand = 23;
    ExchangeSourceNode exchange_source = 24;
    WriterTarget table_writer = 25;
    WriterFinish table_finish = 26;
  }
}
message OutputPort {
  optional uint32 node_id = 1;
  // Duplicate values are distinct ordered output occurrences.
  repeated uint32 value_ids = 2;
}
message ScanNode {
  optional uint32 occurrence_id = 1;
  optional uint32 relation_id = 2;
  ScanReadBudget read_budget = 3;
  repeated ProviderOutput provider_outputs = 4;
  repeated uint32 residual_expr_ids = 5;
  repeated uint32 derived_value_ids = 6;
}
message ScanReadBudget {
  uint64 max_batch_rows = 1;
  uint64 max_batch_bytes = 2;
}
message ProviderOutput {
  optional uint32 column_payload_id = 1;
  optional uint32 value_id = 2;
}
message FilterNode { repeated uint32 predicate_expr_ids = 1; }
message ExpressionOutput {
  optional uint32 expr_id = 1;
  optional uint32 value_id = 2;
}
message ProjectNode { repeated ExpressionOutput expressions = 1; }
message AggregateNode {
  repeated ExpressionOutput group_by = 1;
  repeated AggregateCall calls = 2;
  AggregateGrouping grouping = 3;
}
enum AggregateGrouping {
  AGGREGATE_GROUPING_UNSPECIFIED = 0;
  AGGREGATE_GROUPING_PARTIAL = 1;
  // Actual task/profile-wide unique full-key output, independently of finalize.
  AGGREGATE_GROUPING_COMPLETE = 2;
}
message AggregateCall {
  uint32 id = 1;
  optional uint32 aggregate_binding_id = 2;
  repeated uint32 argument_expr_ids = 3;
  bool distinct = 4;
  repeated SortExpression order_by = 5;
  optional uint32 output_value_id = 6;
}
message JoinKey {
  optional uint32 left_expr_id = 1;
  optional uint32 right_expr_id = 2;
  bool null_safe = 3;
}
message OrdinaryHashJoinCondition {
  repeated JoinKey keys = 1;
  optional uint32 residual_expr_id = 2;
}
message NullAwareEqualHashJoinCondition {
  repeated JoinKey value_equal_keys = 1;
  repeated JoinKey scope_keys = 2;
  optional uint32 eligibility_expr_id = 3;
}
message HashJoinNode {
  JoinKind kind = 1;
  reserved 2, 5;
  reserved "keys", "residual_expr_id";
  JoinSide build_side = 3;
  JoinDistribution distribution = 4;
  repeated uint32 null_extended_value_ids = 6;
  oneof condition {
    OrdinaryHashJoinCondition ordinary = 7;
    NullAwareEqualHashJoinCondition null_aware_equal = 8;
  }
}
message NestLoopJoinNode {
  JoinKind kind = 1;
  NestLoopJoinDistribution distribution = 2;
  optional uint32 predicate_expr_id = 3;
  repeated uint32 null_extended_value_ids = 4;
}
enum JoinKind {
  JOIN_KIND_UNSPECIFIED = 0;
  JOIN_KIND_CROSS = 1;
  JOIN_KIND_INNER = 2;
  JOIN_KIND_LEFT_OUTER = 3;
  JOIN_KIND_RIGHT_OUTER = 4;
  JOIN_KIND_FULL_OUTER = 5;
  JOIN_KIND_LEFT_SEMI = 6;
  JOIN_KIND_RIGHT_SEMI = 7;
  JOIN_KIND_LEFT_ANTI = 8;
  JOIN_KIND_RIGHT_ANTI = 9;
  JOIN_KIND_NULL_AWARE_LEFT_ANTI = 10;
  JOIN_KIND_LEFT_MARK = 11;
}
enum JoinSide {
  JOIN_SIDE_UNSPECIFIED = 0;
  JOIN_SIDE_LEFT = 1;
  JOIN_SIDE_RIGHT = 2;
}
enum JoinDistribution {
  JOIN_DISTRIBUTION_UNSPECIFIED = 0;
  JOIN_DISTRIBUTION_COLOCATED = 1;
  JOIN_DISTRIBUTION_PARTITIONED = 2;
  JOIN_DISTRIBUTION_BROADCAST_BUILD = 3;
  JOIN_DISTRIBUTION_SINGLETON = 4;
}
enum NestLoopJoinDistribution {
  NEST_LOOP_JOIN_DISTRIBUTION_UNSPECIFIED = 0;
