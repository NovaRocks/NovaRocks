syntax = "proto3";

package novarocks;

import "internal_service.proto";
import "lake_service.proto";

service NovaRocksGrpc {
  rpc Exchange(stream ExchangeRequest) returns (stream ExchangeResponse);
  rpc ExchangeUnary(ExchangeRequest) returns (ExchangeResponse);
  rpc TransmitRuntimeFilter(starrocks.PTransmitRuntimeFilterParams)
      returns (starrocks.PTransmitRuntimeFilterResult);
  rpc Lookup(starrocks.PLookUpRequest) returns (starrocks.PLookUpResponse);

  // D1 distributed execution RPCs (PR-3).
  rpc SubmitFragment(SubmitFragmentRequest) returns (SubmitFragmentResponse);
  rpc FetchResult(FetchResultRequest) returns (FetchResultResponse);
  rpc CancelFragment(CancelFragmentRequest) returns (CancelFragmentResponse);
  // D3 cluster heartbeat (FE-pull, unary).
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // IW-4 distributed write coordinator report RPCs.
  rpc ReportExecStatus(ReportExecStatusRequest)
      returns (ReportExecStatusResponse);
  rpc BatchReportExecStatus(BatchReportExecStatusRequest)
      returns (BatchReportExecStatusResponse);
}

message ExchangeRequest {
  int64 finst_id_hi = 1;
  int64 finst_id_lo = 2;
  int32 node_id = 3;
  int32 sender_id = 4;
  int32 be_number = 5;
  bool eos = 6;
  int64 sequence = 7;
  bytes payload = 8;
}

message ExchangeResponse {
  int64 ack_sequence = 1;
}

// D1 distributed execution messages (PR-3).

message SubmitFragmentRequest {
  bytes exec_plan_fragment_params_thrift = 1;
}

message SubmitFragmentResponse {
  int32 status_code = 1;
  string message = 2;
}

// Unique identifier for a fragment instance; mirrors starrocks.PUniqueId but
// lives in the novarocks package to avoid a cross-package name collision.
message PUniqueId {
  int64 hi = 1;
  int64 lo = 2;
}

message FetchResultRequest {
  PUniqueId finst_id = 1;
  int64 max_wait_ms = 2;
  bool typed_result = 3;
}

message FetchResultResponse {
  enum Status {
    READY = 0;
    NOT_READY = 1;
    EOF = 2;
    ERROR = 3;
  }
  Status status = 1;
  // Thrift-binary-encoded TResultBatch payload.
  bytes result_batch_thrift = 2;
  string message = 3;
  // NovaRocks-private exchange-envelope-wrapped Arrow IPC payload.
  bytes result_arrow_ipc = 4;
}

message CancelFragmentRequest {
  repeated PUniqueId finst_ids = 1;
  string reason = 2;
  uint64 start_epoch = 3;
}

message CancelFragmentResponse {
  int32 status_code = 1;
}

message HeartbeatRequest {
  uint32 assigned_be_id = 1;
  int64 fe_epoch = 2;
}

message HeartbeatResponse {
  uint64 start_epoch = 1;
  string version = 2;
  uint32 num_cores = 3;
  int32 status_code = 4;
}

message ReportExecStatusRequest {
  bytes report_exec_status_params_thrift = 1;
}

message ReportExecStatusResponse {
  int32 status_code = 1;
  string message = 2;
  string error_code = 3;
}

message BatchReportExecStatusRequest {
  repeated bytes report_exec_status_params_thrift = 1;
}

message BatchReportExecStatusResponse {
  int32 status_code = 1;
  string message = 2;
  string error_code = 3;
}
