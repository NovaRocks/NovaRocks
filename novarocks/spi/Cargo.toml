[package]
name = "novarocks-spi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
novarocks-resource-contract.workspace = true
novarocks-failure-contract.workspace = true
async-trait.workspace = true
arrow.workspace = true
bytes.workspace = true
futures.workspace = true
novarocks-connector-contract.workspace = true
novarocks-secret.workspace = true
novarocks-type-contract.workspace = true
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
url.workspace = true
uuid = { workspace = true, features = ["serde", "v7"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
connector-conformance = []

[package.metadata.novarocks.test]
runtime-inputs = ["docs/testing/mem-1-m07/profile-v1.json"]
env-inputs = []
