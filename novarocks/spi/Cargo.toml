[package]
name = "novarocks-spi"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
arrow = { version = "58.2.0" }
bytes = "1"
novarocks-secret = { path = "../secret" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
serde_json = "1"

[features]
connector-conformance = []
