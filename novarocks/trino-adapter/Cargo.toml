novarocks-workload-control.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tracing.workspace = true
rand.workspace = true
prometheus.workspace = true

[dev-dependencies]
async-trait.workspace = true
novarocks-parser.workspace = true
novarocks-sql.workspace = true
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "io-util"] }

