[package]
name = "novarocks-trino-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum.workspace = true
bytes.workspace = true
futures.workspace = true
novarocks-execution-contract.workspace = true
novarocks-query-application.workspace = true
novarocks-result-contract.workspace = true
novarocks-user-error.workspace = true
novarocks-types.workspace = true
novarocks-result-render.workspace = true
hyper = { workspace = true, features = ["http1"] }
hyper-util = { workspace = true, features = ["tokio", "server", "service", "http1"] }
