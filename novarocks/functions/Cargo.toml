[package]
name = "novarocks-functions"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]

[dependencies]
novarocks-arrow-batch-codec.workspace = true
novarocks-failure-contract.workspace = true
datasketches = { workspace = true, features = ["hll"] }
arrow-arith.workspace = true
arrow-ord.workspace = true
regex.workspace = true
regex-syntax = "=0.8.8"
# Reuse the locked Unicode property author for Trino's BMP decimal digits.
icu_properties = "=2.1.2"
icu_normalizer = { version = "=2.1.1", default-features = false, features = ["compiled_data", "utf8_iter"] }
icu_casemap = "=2.1.1"
roaring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
allocator-api2.workspace = true
hashbrown = { workspace = true, features = ["raw", "allocator-api2"] }
xxhash-rust = { workspace = true, features = ["xxh64"] }
hex.workspace = true
base64.workspace = true
arrow-array.workspace = true
arrow-row.workspace = true
arrow-buffer.workspace = true
arrow-cast.workspace = true
arrow-data.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
md-5.workspace = true
novarocks-type-contract.workspace = true
novarocks-value-arrays.workspace = true
novarocks-function-contract.workspace = true
novarocks-constant-contract.workspace = true
novarocks-json-value-format.workspace = true
num-traits.workspace = true
rand.workspace = true
ryu.workspace = true
sha2.workspace = true

[package.metadata.novarocks.test]
runtime-inputs = []
env-inputs = []
