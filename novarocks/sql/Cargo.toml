[package]
name = "novarocks-sql"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
test-support = []

[dependencies]
arrow = { workspace = true, features = ["prettyprint", "ipc", "ipc_compression"] }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
hex.workspace = true
novarocks-parser.workspace = true
novarocks-functions.workspace = true
novarocks-spi.workspace = true
novarocks-types.workspace = true
novarocks-user-error.workspace = true
md-5.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "serde"] }

[dev-dependencies]
