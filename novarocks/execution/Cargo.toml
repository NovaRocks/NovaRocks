[package]
name = "novarocks-execution"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
core-pipeline-integration = []

[dependencies]
arrow.workspace = true
arrow-buffer.workspace = true
arrow-data = { version = "58.2.0" }
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
crc32c.workspace = true
datasketches = { workspace = true, features = ["hll"] }
futures.workspace = true
hashbrown = { version = "0.14", features = ["raw"] }
allocator-api2 = "0.2"
hex.workspace = true
libm = "0.2"
md-5.workspace = true
novarocks-types.workspace = true
novarocks-functions.workspace = true
novarocks-spi.workspace = true
num-traits.workspace = true
once_cell.workspace = true
openssl = "0.10"
rand.workspace = true
regex.workspace = true
ryu.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sm3 = "0.4"
parquet = { workspace = true, features = ["arrow", "variant_experimental"] }
prometheus.workspace = true
threadpool = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
twox-hash = "2.1"
url.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "serde"] }

[dev-dependencies]
libc.workspace = true
novarocks-connector-iceberg-functions.workspace = true
novarocks-sql.workspace = true
tempfile.workspace = true

[[bench]]
name = "table_write_statistics"
harness = false
