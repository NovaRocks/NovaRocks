[package]
name = "novarocks-execution"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
core-pipeline-integration = []

[dependencies]
novarocks-result-contract.workspace = true
arrow.workspace = true
arrow-buffer.workspace = true
arrow-data.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
crc32c.workspace = true
datasketches = { workspace = true, features = ["hll"] }
futures.workspace = true
hashbrown = { workspace = true, features = ["raw"] }
allocator-api2.workspace = true
hex.workspace = true
libm = "0.2"
md-5.workspace = true
novarocks-arrow-ipc-frame.workspace = true
novarocks-types.workspace = true
novarocks-execution-contract.workspace = true
novarocks-functions.workspace = true
novarocks-local-program.workspace = true
novarocks-memory.workspace = true
novarocks-spi.workspace = true
novarocks-type-contract.workspace = true
num-traits.workspace = true
once_cell.workspace = true
openssl.workspace = true
rand.workspace = true
regex.workspace = true
ryu.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sm3.workspace = true
parquet = { workspace = true, features = ["arrow", "variant_experimental"] }
prometheus.workspace = true
threadpool = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
twox-hash.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "serde"] }

[dev-dependencies]
novarocks-connector-iceberg.workspace = true
novarocks-functions = { workspace = true, features = ["test-support"] }
prost.workspace = true
novarocks-workload-control.workspace = true
novarocks-query-application.workspace = true
libc.workspace = true
novarocks-local-compiler.workspace = true
novarocks-physical-plan.workspace = true
novarocks-connector-contract.workspace = true
novarocks-connector-iceberg-functions.workspace = true
novarocks-plan-codec.workspace = true
novarocks-sql = { workspace = true, features = ["test-support"] }
novarocks-parser.workspace = true

[[bench]]
name = "table_write_statistics"
harness = false

[[bench]]
name = "regexp_pattern_compile"
harness = false
