[package]
name = "novarocks-query-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
mem-1-m07-exact-mysql-write = []

[dependencies]
novarocks-failure-contract.workspace = true
novarocks-coordination-contract.workspace = true
novarocks-function-contract.workspace = true
novarocks-failpoint = { workspace = true, features = ["typed"] }
novarocks-type-contract.workspace = true
arrow.workspace = true
async-trait.workspace = true
novarocks-execution-contract.workspace = true
novarocks-result-contract.workspace = true
novarocks-result-render.workspace = true
novarocks-parser.workspace = true
novarocks-physical-plan.workspace = true
novarocks-spi.workspace = true
novarocks-sql.workspace = true
novarocks-types.workspace = true
novarocks-user-error.workspace = true
novarocks-workload-control.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
bytes.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
novarocks-resource-contract.workspace = true
novarocks-connector-contract.workspace = true
