[package]
name = "novarocks-backend"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
doctest = false

[dependencies]
novarocks-execution = { path = "../execution" }
novarocks-failpoint = { path = "../failpoint" }
novarocks-proto = { path = "../proto" }
novarocks-spi = { path = "../spi" }
bytes = "1"
arrow = "58.2.0"
arrow-buffer = "58.2.0"
async-trait = "0.1"
axum = "0.7"
once_cell = "1.19"
hex = "0.4"
novarocks-types = { path = "../types" }
novarocks-version = { path = "../version" }
parquet = { version = "58.2.0", features = ["arrow", "variant_experimental"] }
prometheus = "0.13"
prost = "0.13"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
