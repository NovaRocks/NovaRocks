[package]
name = "novarocks-backend"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
doctest = false

[dependencies]
novarocks = { path = "../core" }
novarocks-fs = { path = "../fs" }
novarocks-protocol = { path = "../protocol" }
novarocks-spi = { path = "../spi" }
bytes = "1"
arrow = "58.2.0"
arrow-buffer = "58.2.0"
iceberg = "0.9.0"
novarocks-types = { path = "../types" }
parquet = { version = "58.2.0", features = ["arrow", "variant_experimental"] }
prost = "0.13"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport"] }

[dev-dependencies]
novarocks = { path = "../core" }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
