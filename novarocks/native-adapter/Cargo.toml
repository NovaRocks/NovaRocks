[package]
name = "novarocks-native-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]

[dependencies]
novarocks-resource-contract.workspace = true
novarocks-transport-io.workspace = true
novarocks-result-contract.workspace = true
novarocks-result-render.workspace = true
novarocks-type-contract.workspace = true
novarocks-native-trust.workspace = true
novarocks-execution.workspace = true
novarocks-execution-contract.workspace = true
novarocks-local-compiler.workspace = true
novarocks-local-program.workspace = true
novarocks-physical-plan.workspace = true
novarocks-connector-contract.workspace = true
novarocks-functions.workspace = true
novarocks-memory.workspace = true
novarocks-memory-failure.workspace = true
novarocks-failpoint = { workspace = true, features = ["typed"] }
novarocks-plan-codec.workspace = true
novarocks-proto-codec.workspace = true
novarocks-proto-models.workspace = true
novarocks-spi.workspace = true
novarocks-secret = { workspace = true }
novarocks-task-codec.workspace = true
novarocks-types.workspace = true
novarocks-worker.workspace = true
arrow.workspace = true
arrow-buffer.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
libc.workspace = true
prost.workspace = true
once_cell.workspace = true
prometheus.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util.workspace = true
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport"] }
tower = { workspace = true, features = ["util"] }
tracing.workspace = true

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-build.workspace = true

[dev-dependencies]
novarocks-value-arrays.workspace = true
tempfile.workspace = true
novarocks-execution = { workspace = true }
novarocks-plan-codec = { workspace = true }
h2.workspace = true
novarocks-sql.workspace = true
novarocks-worker = { workspace = true }
novarocks-secret.workspace = true
sha2.workspace = true

[package.metadata.novarocks.test]
runtime-inputs = []
env-inputs = []

[package.metadata.cargo-machete]
ignored = [
    # build.rs locates protoc for native transport stub generation.
    "protoc-bin-vendored",
    # build.rs generates the native transport stubs.
    "tonic-build",
]
