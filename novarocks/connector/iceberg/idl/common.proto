syntax = "proto3";

// Provider-private read and write messages are compiled under this namespace.
// The public provider/catalog/category/revision header remains in
// novarocks.connector_common and is never duplicated here.
package novarocks.connector.iceberg;

// Provider-private route identity shared by read and write payloads. It names
// an admitted local access binding and never carries credential material.
message IcebergStorageRoute {
  string access_binding = 1;
}
