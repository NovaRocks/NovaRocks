[package]
name = "novarocks-connector-iceberg"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
anyhow = "1"
base64 = "0.22"
iceberg = "0.9.0"
iceberg-catalog-rest = "0.9.0"
iceberg-catalog-hms = "0.9.0"
opendal = { version = "0.55", features = ["services-oss", "services-fs", "services-s3", "services-hdfs-native", "services-memory"] }
arrow = { version = "58.2.0", features = ["prettyprint", "ipc", "ipc_compression"] }
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
crc32fast = "1"
futures = "0.3"
ordered-float = "4"
parquet = { version = "58.2.0", features = ["arrow", "variant_experimental"] }
prost = "0.13"
rand = "0.8"
roaring = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
typetag = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
novarocks-fs = { path = "../../fs" }
novarocks-connector-iceberg-functions = { path = "../iceberg-functions" }
novarocks-proto-codec = { path = "../../proto-codec" }
novarocks-proto-models = { path = "../../proto-models" }
novarocks-spi = { path = "../../spi" }
novarocks-types = { path = "../../types" }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
