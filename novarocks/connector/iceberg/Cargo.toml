[package]
name = "novarocks-connector-iceberg"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
# Test fixture observation only; excluded from ordinary/release acceptance.
mem-1-m07-hms-listing-observe = []

[dependencies]
novarocks-failpoint = { workspace = true, features = ["typed"] }
anyhow.workspace = true
base64.workspace = true
iceberg = "0.11.0"
iceberg-catalog-hms = "0.11.0"
opendal = { workspace = true, features = ["services-fs", "services-s3", "services-memory"] }
arrow = { workspace = true, features = ["prettyprint", "ipc", "ipc_compression"] }
async-trait.workspace = true
bytes.workspace = true
crc32fast = "1"
futures.workspace = true
ordered-float = "4"
parquet = { workspace = true, features = ["arrow", "variant_experimental"] }
prost.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
roaring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
typetag = "0.2"
url.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
zstd = { version = "0.14.3", default-features = false }
novarocks-fs.workspace = true
novarocks-connector-contract.workspace = true
novarocks-failure-contract.workspace = true
novarocks-resource-contract.workspace = true
novarocks-connector-iceberg-functions.workspace = true
novarocks-proto-codec.workspace = true
novarocks-proto-models.workspace = true
novarocks-spi.workspace = true
novarocks-types.workspace = true
novarocks-type-contract.workspace = true

[dev-dependencies]
novarocks-cluster-harness.workspace = true
novarocks-test-support.workspace = true
iceberg-catalog-rest = { path = "../../../vendor/iceberg-catalog-rest-0.11.0" }
faststr = "0.2"
hive_metastore = "0.2"
tempfile.workspace = true

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[package.metadata.novarocks.test]
runtime-inputs = ["docker/iceberg-rest/*.py", "docker/iceberg-rest/*.sh", "docker/iceberg-rest/tests/java_rest_inputs.py", "docker/iceberg-rest/tests/iru13a-rest-interop-test.sh", "docker/iceberg-rest/runtime/current/published/env.sh", "docker/iceberg-rest/runtime/current/published/manifest.json", "target/debug/build/novarocks-test-support-*/out/novarocks-test-monitor"]
env-inputs = [{ name = "NOVA_FIXTURE_INPUT_BOM", kind = "file-content" }, { name = "NR_JAVA_REST_INTEROP_RUN_ROOT", kind = "value" }, { name = "NR_IRU5_INTEROP_ARTIFACT_DIR", kind = "value" }, { name = "NR_IRU13A_INTEROP_ARTIFACT_DIR", kind = "value" }, { name = "NR_IRU13B_INTEROP_ARTIFACT_DIR", kind = "value" }, { name = "NOVA_FIXTURE_RUN_CONTEXT", kind = "value" },{ name = "NOVA_FIXTURE_RUN_STORAGE", kind = "value" },{ name = "NOVA_FIXTURE_BUDGET_SECS", kind = "value" },{ name = "NOVA_ENV_MANIFEST", kind = "file-content" },{ name = "PATH", kind = "value" },{ name = "DOCKER_CONTEXT", kind = "value" },{ name = "DOCKER_HOST", kind = "value" },{ name = "DOCKER_TLS_VERIFY", kind = "value" },{ name = "DOCKER_CERT_PATH", kind = "value" },{ name = "DOCKER_CONFIG", kind = "value" },{ name = "HOME", kind = "value" },{ name = "XDG_STATE_HOME", kind = "value" },{ name = "AWS_S3_ENDPOINT", kind = "value" },{ name = "AWS_S3_ACCESS_KEY_ID", kind = "value" },{ name = "AWS_S3_SECRET_ACCESS_KEY", kind = "value" },{ name = "AWS_SESSION_TOKEN", kind = "value" },{ name = "AWS_REGION", kind = "value" },{ name = "NOVAROCKS_ICEBERG_REST_URI", kind = "value" },{ name = "NOVAROCKS_ICEBERG_REST_WAREHOUSE", kind = "value" },{ name = "NR_HADOOP_FENCE_MINIO_WAREHOUSE", kind = "value" },{ name = "NR_IRU5_INTEROP_NAMESPACE", kind = "value" },{ name = "NR_IRU13A_INTEROP_NAMESPACE", kind = "value" },{ name = "NR_IRU13B_INTEROP_NAMESPACE", kind = "value" },{ name = "SCRATCH_RESPONSE", kind = "file-content" },{ name = "NOVA_ENV_REST_ENV_FILE", kind = "file-content" }]
ignored = [
  { filter = "test(=commit::staging::interop_tests::iru5_java_rest_three_shapes_historic_spec_and_composition)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru5_java_rest_d12_inheritance_and_physical_rewrite)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru5_java_rest_two_canonical_clients_real_cas)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru5_java_rest_attempt_runner_reloads_and_reprepares_after_real_cas)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru13a_java_rest_namespace_table_lifecycle_and_interleaved_reads)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru13a_java_rest_table_commit_shapes)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru13a_java_rest_stage_create_and_ctas_final_commit)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru13a_java_rest_view_create_replace_drop)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru13a_java_rest_recreated_table_rejects_stale_partition_evolution)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru13b_java_rest_ctas_publishes_staged_metadata_for_every_format_version)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru13b_java_rest_schema_changes_keep_the_column_high_water_mark)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru13b_java_rest_view_replacements_always_add_the_selected_version)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru13b_java_rest_view_replacement_survives_version_id_reuse)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=commit::staging::interop_tests::iru13b_java_rest_view_replacement_keeps_dialects_unless_allowed)", class = "heavy", requires = ["fixture:iceberg-rest", "fixture:minio", "toolchain:java"], input-owner = "iceberg-java-rest-interop", reason = "requires pinned Java REST and MinIO fixture publication" },
  { filter = "test(=minio_strict_and_noop_two_process_fencing)", class = "heavy", requires = ["fixture:minio"], reason = "requires the shared MinIO fixture" },
  { filter = "test(=hadoop_fencing_child_process_entry)", class = "helper", reason = "internal helper invoked exactly by the two-process fencing tests" },
]

[package.metadata.cargo-machete]
ignored = [
    # The test module includes the vendored HMS table_projection.rs via #[path].
    "faststr",
    "hive_metastore",
    # build.rs generates the private Iceberg connector protobuf DTOs.
    "prost-build",
    # build.rs locates protoc for Iceberg connector DTO generation.
    "protoc-bin-vendored",
]
