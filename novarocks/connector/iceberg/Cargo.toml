[package]
name = "novarocks-connector-iceberg"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]
reader-test-fixture = []

[dependencies]
novarocks-failpoint = { workspace = true, features = ["typed"] }
anyhow.workspace = true
apache-avro.workspace = true
base64.workspace = true
iceberg = "0.11.0"
iceberg-catalog-hms = "0.11.0"
opendal = { workspace = true, features = ["services-fs", "services-s3", "services-memory"] }
arrow = { workspace = true, features = ["prettyprint", "ipc", "ipc_compression"] }
async-trait.workspace = true
bytes.workspace = true
crc32fast = "1"
flate2 = "1.1.5"
futures.workspace = true
ordered-float = "4"
parquet = { workspace = true, features = ["arrow", "variant_experimental"] }
prost.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
roaring.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value", "unbounded_depth"] }
sha2.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
typetag = "0.2"
url.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
novarocks-fs.workspace = true
novarocks-connector-contract.workspace = true
novarocks-failure-contract.workspace = true
novarocks-resource-contract.workspace = true
novarocks-connector-iceberg-functions.workspace = true
novarocks-proto-codec.workspace = true
novarocks-proto-models.workspace = true
novarocks-spi.workspace = true
novarocks-types.workspace = true
novarocks-type-contract.workspace = true
novarocks-value-arrays.workspace = true

[dev-dependencies]
novarocks-test-support.workspace = true
iceberg-catalog-rest = "0.11.0"
tempfile.workspace = true

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[package.metadata.novarocks.test]
runtime-inputs = ["docker/iceberg-rest/tests/run_storage_scope_vectors.json", "target/debug/build/novarocks-test-support-*/out/novarocks-test-monitor"]
env-inputs = [{ name = "HOME", kind = "value" }, { name = "XDG_STATE_HOME", kind = "value" }]

[package.metadata.cargo-machete]
ignored = [
    # build.rs generates the private Iceberg connector protobuf DTOs.
    "prost-build",
    # build.rs locates protoc for Iceberg connector DTO generation.
    "protoc-bin-vendored",
]
