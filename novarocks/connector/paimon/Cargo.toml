[package]
name = "novarocks-connector-paimon"
version.workspace = true
edition.workspace = true
license.workspace = true
# SDK integration tests remain suspended until the provider supports Arrow 60 and zstd 0.14.
autotests = false

[lints]
workspace = true

[lib]
test = true
doctest = false

[dependencies]
bytes.workspace = true
futures.workspace = true
prost.workspace = true
novarocks-connector-contract.workspace = true
novarocks-spi.workspace = true
novarocks-type-contract.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[package.metadata.novarocks.test]
runtime-inputs = []
env-inputs = []

[package.metadata.cargo-machete]
ignored = [
    # build.rs generates the private Paimon connector protobuf DTOs.
    "prost-build",
    # build.rs locates protoc for Paimon connector DTO generation.
    "protoc-bin-vendored",
]
