[package]
name = "novarocks-connector-paimon"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
arrow = "58.2.0"
async-trait = "0.1"
bytes = "1"
chrono = "0.4"
futures = "0.3"
paimon = { workspace = true }
prost = "0.13"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
novarocks-fs = { path = "../../fs" }
novarocks-proto-codec = { path = "../../proto-codec" }
novarocks-proto-models = { path = "../../proto-models" }
novarocks-spi = { path = "../../spi" }

[dev-dependencies]
paimon = { workspace = true, features = ["storage-memory"] }
serde_json = "1"
tempfile = "3"

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
