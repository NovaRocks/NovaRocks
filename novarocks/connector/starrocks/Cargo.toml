[package]
name = "novarocks-connector-starrocks"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
doctest = false

[dependencies]
arrow = "58.2.0"
base64 = "0.22"
bytes = "1"
chrono = "0.4"
crc32c = "0.6"
lz4_flex = { version = "0.11", features = ["frame"] }
novarocks-fs = { path = "../../fs" }
novarocks-spi = { path = "../../spi" }
parquet = { version = "58.2.0", features = ["arrow"] }
prost = "0.13"
roaring = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tonic = { version = "0.12", features = ["transport"] }
uuid = { version = "1", features = ["v7", "serde"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
