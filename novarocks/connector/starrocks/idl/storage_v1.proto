// Provider-private, read-only subset of StarRocks lake metadata. Field tags
// are intentionally compatible with the persisted StarRocks V1 records.
syntax = "proto2";
package starrocks.storage;

enum KeysType { DUP_KEYS = 0; UNIQUE_KEYS = 1; AGG_KEYS = 2; PRIMARY_KEYS = 10; }
message ColumnPB {
  optional int32 unique_id = 1;
  optional string name = 2;
  optional string type = 3;
  optional bool is_key = 4;
  optional string aggregation = 5;
  optional bool is_nullable = 6;
  optional bytes default_value = 7;
  optional int32 precision = 8;
  optional int32 frac = 9;
  optional int32 length = 10;
  repeated ColumnPB children_columns = 17;
}
message TabletSchemaPB {
  optional KeysType keys_type = 1;
  repeated ColumnPB column = 2;
  optional int64 id = 50;
}
message InPredicatePB { optional string column_name = 1; optional bool is_not_in = 2; repeated string values = 3; }
message BinaryPredicatePB { optional string column_name = 1; optional string op = 2; optional string value = 3; }
message IsNullPredicatePB { optional string column_name = 1; optional bool is_not_null = 2; }
message DeletePredicatePB {
  repeated string sub_predicates = 2;
  repeated InPredicatePB in_predicates = 3;
  repeated BinaryPredicatePB binary_predicates = 4;
  repeated IsNullPredicatePB is_null_predicates = 5;
}
message FileMetaPB { optional string name = 1; optional int64 size = 2; }
message DelvecPagePB { optional int64 version = 1; optional uint64 offset = 2; optional uint64 size = 3; optional uint32 crc32c = 4; optional int64 crc32c_gen_version = 5; }
message DelvecMetadataPB { map<int64, FileMetaPB> version_to_file = 1; map<uint32, DelvecPagePB> delvecs = 2; }
message RowsetMetadataPB {
  optional uint32 id = 1;
  repeated string segments = 3;
  optional int64 num_rows = 4;
  optional DeletePredicatePB delete_predicate = 6;
  repeated uint64 segment_size = 8 [packed = true];
  repeated int64 bundle_file_offsets = 14;
}
message TabletMetadataPB {
  optional int64 id = 1;
  optional int64 version = 2;
  optional TabletSchemaPB schema = 3;
  repeated RowsetMetadataPB rowsets = 4;
  optional DelvecMetadataPB delvec_meta = 7;
  map<int64, TabletSchemaPB> historical_schemas = 17;
  map<uint32, int64> rowset_to_schema = 18;
}
message PagePointerPB { optional uint64 offset = 1; optional uint32 size = 2; }
message BundleTabletMetadataPB {
  map<int64, int64> tablet_to_schema = 1;
  map<int64, TabletSchemaPB> schemas = 2;
  map<int64, PagePointerPB> tablet_meta_pages = 3;
}
