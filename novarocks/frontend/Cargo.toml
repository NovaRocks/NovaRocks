[package]
name = "novarocks-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
apache-avro = "0.21"
async-trait.workspace = true
arrow.workspace = true
arrow-buffer.workspace = true
parquet = { workspace = true, features = ["arrow"] }
once_cell.workspace = true
prometheus.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
libc.workspace = true
novarocks-fs.workspace = true
novarocks-functions.workspace = true
novarocks-execution.workspace = true
novarocks-failpoint = { workspace = true, features = ["typed"] }
novarocks-native-trust.workspace = true
novarocks-proto-codec.workspace = true
novarocks-proto-models.workspace = true
novarocks-parser.workspace = true
novarocks-plan-codec.workspace = true
novarocks-spi.workspace = true
novarocks-state-store-api.workspace = true
novarocks-sql.workspace = true
novarocks-task-codec.workspace = true
novarocks-types.workspace = true
novarocks-user-error.workspace = true
novarocks-version.workspace = true
mysql_common = "0.32"
opensrv-mysql = { version = "0.7", default-features = false }
prost.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["transport"] }
tracing.workspace = true
toml.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }

[dev-dependencies]
novarocks-connector-starrocks.workspace = true
novarocks-secret.workspace = true
novarocks-state-store-testkit.workspace = true
novarocks-sql = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[build-dependencies]
protoc-bin-vendored.workspace = true
tonic-build.workspace = true
