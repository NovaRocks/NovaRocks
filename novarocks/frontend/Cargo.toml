[package]
name = "novarocks-frontend"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
doctest = false

[dependencies]
anyhow = "1"
apache-avro = "0.21"
async-trait = "0.1"
arrow = { version = "58.2.0" }
arrow-buffer = "58.2.0"
parquet = { version = "58.2.0", features = ["arrow"] }
once_cell = "1.19"
prometheus = "0.13"
axum = "0.7"
bytes = "1"
chrono = "0.4"
datasketches = "0.2.0"
futures = "0.3"
hex = "0.4"
libc = "0.2"
novarocks-fs = { path = "../fs" }
novarocks-execution = { path = "../execution" }
novarocks-failpoint = { path = "../failpoint" }
novarocks-proto = { path = "../proto" }
novarocks-parser = { path = "../parser" }
novarocks-spi = { path = "../spi" }
novarocks-sql = { path = "../sql" }
novarocks-types = { path = "../types" }
novarocks-user-error = { path = "../user-error" }
novarocks-version = { path = "../version" }
mysql_common = "0.32"
opensrv-mysql = { version = "0.7", default-features = false }
prost = "0.13"
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
novarocks-connector-starrocks = { path = "../connector/starrocks" }
novarocks-spi = { path = "../spi", features = ["state-store-conformance"] }
novarocks-sql = { path = "../sql", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
