[package]
name = "novarocks-frontend"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
doctest = false

[dependencies]
apache-avro = "0.21"
async-trait = "0.1"
arrow = { version = "58.2.0" }
axum = "0.7"
bytes = "1"
chrono = "0.4"
futures = "0.3"
hex = "0.4"
novarocks = { path = "../core" }
novarocks-fs = { path = "../fs" }
novarocks-catalog = { path = "../catalog" }
novarocks-execution = { path = "../execution" }
novarocks-protocol = { path = "../protocol" }
novarocks-spi = { path = "../spi" }
novarocks-state-store = { path = "../state-store" }
novarocks-types = { path = "../types" }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = "0.61.0"
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
novarocks = { path = "../core", features = ["query-execution-contract-test-support"] }
novarocks-connector-starrocks = { path = "../connector/starrocks" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
