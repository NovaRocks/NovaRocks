[package]
name = "novarocks-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
arrow.workspace = true
bytes.workspace = true
crc32c.workspace = true
futures.workspace = true
libc.workspace = true
opendal = { workspace = true, features = ["services-oss", "services-fs", "services-s3", "services-hdfs-native", "services-memory"] }
orc-rust = { version = "0.8.0", default-features = false }
parquet = { workspace = true, features = ["arrow", "variant_experimental"] }
reqwest = { workspace = true, features = ["rustls-tls"] }
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
url.workspace = true
novarocks-secret.workspace = true
novarocks-spi.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
