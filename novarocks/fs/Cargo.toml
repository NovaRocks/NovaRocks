[package]
name = "novarocks-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
novarocks-failpoint = { workspace = true }
novarocks-failure-contract.workspace = true
anyhow.workspace = true
arrow.workspace = true
bytes.workspace = true
crc32c.workspace = true
futures.workspace = true
http.workspace = true
hdfs-native = "=0.14.6"
http-body = "1"
libc.workspace = true
opendal = { workspace = true, features = ["services-fs", "services-s3", "services-memory", "executors-tokio", "layers-concurrent-limit", "layers-retry", "layers-timeout"] }
orc-rust = { version = "0.8.0", default-features = false }
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
parquet = { workspace = true, features = ["arrow", "variant_experimental"] }
# Provider-owned S3 signing uses this registry implementation directly;
# StorageAuthority remains the only judge of credential validity.
reqsign = { version = "0.16.5", default-features = false, features = ["services-aws"] }
quick-xml = { version = "=0.37.5", features = ["serialize"] }
reqsign-aliyun-oss = "=3.1.1"
reqsign-core = "=3.3.2"
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
sha2.workspace = true
tracing.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
url.workspace = true
novarocks-secret.workspace = true
novarocks-spi.workspace = true

[dev-dependencies]
novarocks-test-support.workspace = true
novarocks-failpoint = { workspace = true, features = ["typed"] }
serde_json.workspace = true

[features]

[package.metadata.novarocks.test]
runtime-inputs = ["novarocks/fs/tests/data/writer-corpus/**", "novarocks/fs/tests/fixtures/hdfs/**", "target/hdfs-real-io/java/**", "target/debug/build/novarocks-test-support-*/out/novarocks-test-monitor"]
env-inputs = [{ name = "NOVA_HDFS_JAVA", kind = "file-content" }, { name = "NOVA_OSS_TEST_CONFIG", kind = "file-content" }]
