[package]
name = "novarocks-state-store-foundationdb"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
foundationdb = { version = "=0.11.0", optional = true, default-features = false, features = ["embedded-fdb-include", "fdb-7_3"] }
futures = "0.3"
hex = "0.4"
novarocks-state-store-api = { path = "../api" }
novarocks-secret = { path = "../../secret" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
novarocks-state-store-testkit = { path = "../testkit" }
tempfile = "3"

[[bin]]
name = "state-store-foundationdb-helper"
path = "tests/support/state_store_foundationdb_helper.rs"
required-features = ["foundationdb-provider", "state-store-test-hooks"]
test = false
bench = false

[features]
foundationdb-provider = ["dep:foundationdb"]
state-store-test-hooks = ["foundationdb-provider"]
provider-internal-tests = ["foundationdb-provider"]
