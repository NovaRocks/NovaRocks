[package]
name = "novarocks-state-store-mysql"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[[bin]]
name = "state-store-mysql-helper"
path = "tests/support/state_store_mysql_helper.rs"
required-features = ["state-store-test-hooks"]
test = false
bench = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
mysql_async = { version = "=0.37.0", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
novarocks-secret.workspace = true
novarocks-state-store-api.workspace = true
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "v7", "serde"] }

[dev-dependencies]
novarocks-state-store-testkit.workspace = true
tempfile.workspace = true

[features]
default = ["mysql-state-store-provider"]
mysql-state-store-provider = []
state-store-test-hooks = []
