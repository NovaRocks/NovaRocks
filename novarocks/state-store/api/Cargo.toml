[package]
name = "novarocks-state-store-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait.workspace = true
bytes.workspace = true
sha2.workspace = true
# v4 only: the instance scope is random, never a clock reading, and the
# domain neither serialises a UUID nor mints a time-ordered one. Per ADR-0142
# the root owns the version and this manifest owns the features it consumes.
uuid = { workspace = true, features = ["v4"] }

# Test-only. The provider-contract target drives async trait methods; this
# never reaches the production closure, which the boundary guard verifies.
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
