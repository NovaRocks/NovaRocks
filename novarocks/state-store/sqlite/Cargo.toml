[package]
name = "novarocks-state-store-sqlite"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
async-trait = "0.1"
bytes = "1"
fs2 = "0.4"
log = "0.4"
novarocks-spi = { path = "../../spi" }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3"
