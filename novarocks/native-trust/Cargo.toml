[package]
name = "novarocks-native-trust"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
base64.workspace = true
bytes.workspace = true
ed25519-dalek = { version = "2", features = ["pkcs8"] }
h2.workspace = true
hmac.workspace = true
http.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
novarocks-secret.workspace = true
novarocks-types.workspace = true
rcgen.workspace = true
rustls = { workspace = true, features = ["ring"] }
rustls-pemfile = "2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tonic = { workspace = true, features = ["transport"] }
tower.workspace = true

[dev-dependencies]
hex.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
