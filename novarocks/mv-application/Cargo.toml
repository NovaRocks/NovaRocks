[package]
name = "novarocks-mv-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]

[dependencies]
novarocks-failure-contract.workspace = true
novarocks-type-contract.workspace = true
apache-avro.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
novarocks-query-application.workspace = true
novarocks-spi.workspace = true
novarocks-sql.workspace = true
novarocks-state-store-api.workspace = true
novarocks-state-store-runtime.workspace = true
novarocks-table-maintenance.workspace = true
novarocks-types.workspace = true
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
novarocks-functions.workspace = true
arrow-schema.workspace = true
novarocks-catalog-application = { workspace = true }
novarocks-state-store-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[package.metadata.novarocks.test]
runtime-inputs = []
env-inputs = []

[package.metadata.cargo-machete]
ignored = [
    # build.rs generates the private MV persistence protobuf DTOs.
    "prost-build",
    # build.rs locates protoc for MV persistence DTO generation.
    "protoc-bin-vendored",
]
