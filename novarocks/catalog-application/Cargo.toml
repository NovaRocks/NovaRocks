[package]
name = "novarocks-catalog-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
doctest = false

[features]

[dependencies]
chrono.workspace = true
futures.workspace = true
hex.workspace = true
novarocks-spi.workspace = true
novarocks-types.workspace = true
novarocks-failure-contract.workspace = true
novarocks-connector-contract.workspace = true
novarocks-state-store-api.workspace = true
novarocks-state-store-runtime.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
tracing.workspace = true
uuid = { workspace = true, features = ["v7", "serde"] }

[dev-dependencies]
novarocks-connector-iceberg.workspace = true
novarocks-fs.workspace = true
arrow.workspace = true
bytes.workspace = true
novarocks-connector-starrocks.workspace = true
novarocks-state-store-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[package.metadata.novarocks.test]
runtime-inputs = []
env-inputs = []
