name: MySQL experimental state store

on:
  # Keep the provider gate available without blocking every pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-state-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Run MySQL experimental provider checks
        env:
          NOVAROCKS_RUN_MYSQL_DOCKER_OWNERSHIP_TEST: "1"
        run: |
          set -euo pipefail
          trap 'docker/mysql-state-store/down.sh --docker' EXIT
          docker/mysql-state-store/up.sh
          source docker/mysql-state-store/runtime/current/env.sh
          tools/ci/mysql-state-store-provider.sh

      - name: Verify MySQL runtime residue is absent
        if: always()
        run: |
          set -euo pipefail
          test ! -e docker/mysql-state-store/runtime/current
