name: FoundationDB experimental state store

on:
  # Keep the provider gate available without blocking every pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundationdb-state-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev dpkg curl

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install current Docker engine
        uses: docker/setup-docker-action@v4

      - name: Prepare FoundationDB fixture
        run: docker/foundationdb/up.sh

      - name: Run FoundationDB experimental provider checks
        run: tools/ci/foundationdb-provider.sh

      - name: Stop FoundationDB fixture
        if: always()
        run: docker/foundationdb/down.sh --docker
