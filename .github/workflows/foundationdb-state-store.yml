name: FoundationDB experimental state store

on:
  # Keep the provider gate available without blocking every pull request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundationdb-state-store:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev dpkg curl

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Install current Docker engine
        uses: docker/setup-docker-action@v4

      - name: Import pinned fixture images
        run: |
          set -euo pipefail
          # The fixture itself never pulls: compose.yml sets `pull_policy:
          # never` so a run uses the host's own image store and reports a
          # missing image instead of downloading one mid-test. A fresh runner
          # therefore imports the pinned image in this explicit step, read
          # straight from compose.yml so the two cannot drift.
          image="$(awk '/^    image:/ { print $2; exit }' docker/foundationdb/compose.yml)"
          case "$image" in
            ''|*'$'*) echo "cannot resolve a literal image from docker/foundationdb/compose.yml: '$image'" >&2; exit 1 ;;
          esac
          echo "importing $image"
          docker pull "$image"

      - name: Prepare FoundationDB fixture
        run: docker/foundationdb/up.sh

      - name: Run FoundationDB experimental provider checks
        run: tools/ci/foundationdb-provider.sh

      - name: Stop FoundationDB fixture
        if: always()
        run: docker/foundationdb/down.sh --docker
