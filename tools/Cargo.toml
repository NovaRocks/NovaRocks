[package]
name = "novarocks-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oss_parquet_probe"
path = "src/bin/oss_parquet_probe.rs"

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
bytes.workspace = true
futures.workspace = true
opendal = { workspace = true, features = ["services-oss", "services-fs", "services-s3"] }
parquet = { workspace = true, features = ["arrow", "variant_experimental"] }
novarocks-fs.workspace = true
novarocks-server.workspace = true
novarocks-spi.workspace = true

[lints]
workspace = true
