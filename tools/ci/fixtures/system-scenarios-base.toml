# Provider-neutral base configuration for native 1FE+3BE system scenarios.
#
# `novarocks-cluster-harness` owns the real launch contract and rewrites the
# volatile parts of this file per process: it inserts `[cluster] role`, the BE
# endpoint list, every port, a per-run `[state_store] path`, and removes the
# FE-only catalog source from BE configs. Only the
# provider-neutral, non-volatile fields belong here.
#
# It also materializes one mandatory `[native_trust]` table for every generated
# FE/BE config. The generated TOML retains only an `${ENV:...}` reference for
# the ephemeral test secret; the fixture deliberately contains no reusable
# trust secret, certificate path, or TLS mode. Individual system scenarios
# select authenticated plaintext, automatic TLS, or generated PEM TLS through
# the harness-owned profile.
#
# Deliberately absent:
#
# - `[connector.object_store]`: every registered scenario creates its Iceberg
#   warehouse on the local filesystem under the harness runtime directory, so
#   the system stage needs neither MinIO nor the iceberg-rest Docker fixture.
# - SQLite is the only production StateStore provider. MySQL/FoundationDB leaf
#   checks are experimental and do not participate in this native scenario.

[state_store]
provider = "sqlite"
cluster_id = "novarocks-system-scenarios"
path = "tmp/system-scenarios-state-store.sqlite"

[catalog_source]
# System scenarios create and mutate catalogs through SQL, so their FE uses
# the explicit DynamicStateStore authority. The harness strips this section
# while rendering every BE config.
mode = "dynamic-state-store"

[standalone_server]
mysql_port = 9030
user = "root"

# A system scenario preserves the production FE/BE process boundary, but is
# not a host-capacity benchmark.  The default runtime values derive several
# executor pools from every visible CPU.  With one FE and three BEs that can
# oversubscribe a developer machine before a scenario issues its first query.
# Keep all role-local pools bounded here; a performance run that needs a
# different capacity must provide an explicit deployment config instead of
# making the ordinary correctness path host-dependent.
[runtime]
pipeline_scan_thread_pool_thread_num = 1
pipeline_exec_thread_pool_thread_num = 1
exchange_io_threads = 1
# Iceberg split discovery synchronously bridges onto this runtime from a data
# runtime worker. The bridge also performs blocking metadata reads, so retain
# core and blocking capacity beyond the two admitted Connector jobs.
data_runtime_worker_threads = 2
data_runtime_max_blocking_threads = 4
query_blocking_worker_threads = 1
connector_blocking_io_max_inflight = 2
connector_split_blocking_io_max_inflight = 1
connector_io_tasks_per_scan_operator = 1
