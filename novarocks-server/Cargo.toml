[package]
name = "novarocks-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "novarocks"
path = "src/main.rs"

[dependencies]
novarocks-backend = { path = "../novarocks/backend" }
novarocks-connector-iceberg = { path = "../novarocks/connector/iceberg" }
novarocks-connector-starrocks = { path = "../novarocks/connector/starrocks" }
novarocks-execution = { path = "../novarocks/execution" }
novarocks-failpoint = { path = "../novarocks/failpoint", default-features = false }
novarocks-frontend = { path = "../novarocks/frontend" }
novarocks-fs = { path = "../novarocks/fs" }
novarocks-native-trust = { path = "../novarocks/native-trust" }
novarocks-secret = { path = "../novarocks/secret" }
novarocks-spi = { path = "../novarocks/spi" }
novarocks-state-store-sqlite = { path = "../novarocks/state-store/sqlite" }
novarocks-types = { path = "../novarocks/types" }
anyhow = "1"
atty = "0.2"
chrono = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "time"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time"] }
uuid = "1"

[features]
mv-first-refresh-staging-test-support = []

[dev-dependencies]
# `server_binary_smoke` spawns the real `novarocks` binary and drives it over
# MySQL; `state_store_app_config` asserts config/composition by direct call.
# Domain behaviour belongs to its owner crate, the SQL suites or the system
# scenarios — not to this package.
bytes = "1"
mysql = "25"
novarocks-test-support = { path = "../tests/test-support" }
tempfile = "3"
