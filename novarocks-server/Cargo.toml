[package]
name = "novarocks-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "novarocks"
path = "src/main.rs"

[dependencies]
novarocks = { path = "../novarocks/core" }
novarocks-backend = { path = "../novarocks/backend" }
novarocks-frontend = { path = "../novarocks/frontend" }
novarocks-fs = { path = "../novarocks/fs" }
anyhow = "1"
libc = "0.2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time"] }

[features]
foundationdb-provider = ["novarocks/foundationdb-provider"]
mysql-state-store-provider = ["novarocks/mysql-state-store-provider"]

[dev-dependencies]
# E2E tests that spawn the `novarocks` binary and drive it over MySQL / HTTP.
mysql = "25"
novarocks-state-store = { path = "../novarocks/state-store" }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
