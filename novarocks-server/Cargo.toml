[package]
name = "novarocks-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "novarocks"
path = "src/main.rs"

[dependencies]
novarocks-arrow-ipc-frame = { workspace = true, optional = true }
novarocks-connector-contract.workspace = true
novarocks-connector-iceberg.workspace = true
novarocks-connector-paimon.workspace = true
novarocks-connector-iceberg-functions.workspace = true
novarocks-execution.workspace = true
novarocks-execution-contract.workspace = true
novarocks-failpoint.workspace = true
novarocks-frontend-application.workspace = true
novarocks-catalog-application.workspace = true
novarocks-functions.workspace = true
novarocks-fs.workspace = true
novarocks-memory.workspace = true
novarocks-mv-application.workspace = true
novarocks-mysql-adapter.workspace = true
novarocks-native-trust.workspace = true
novarocks-native-adapter.workspace = true
novarocks-query-application.workspace = true
novarocks-physical-plan.workspace = true
novarocks-plan-codec = { workspace = true, optional = true }
novarocks-secret.workspace = true
novarocks-spi.workspace = true
novarocks-state-store-api.workspace = true
novarocks-state-store-runtime.workspace = true
novarocks-sql.workspace = true
novarocks-state-store-sqlite.workspace = true
novarocks-type-contract.workspace = true
novarocks-types.workspace = true
novarocks-version.workspace = true
novarocks-worker.workspace = true
novarocks-workload-control.workspace = true
anyhow.workspace = true
bytes.workspace = true
atty = "0.2"
chrono.workspace = true
futures.workspace = true
hex.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "time"] }
uuid.workspace = true
# The process allocator; see `src/memory_observation.rs`.
tikv-jemalloc-ctl = { workspace = true, optional = true }
tikv-jemallocator = { workspace = true, optional = true }

# jemalloc runs background purge threads only on Linux. On macOS it is built
# without them, and enabling them there makes jemalloc fail to initialise, so
# the crate feature must not reach any other target.
# Design: ADR-0163 (docs/adr/ADR-0163-jemalloc-process-allocator-and-cgroup-memory-bound.md)
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, optional = true, features = ["background_threads"] }

[features]
mem-1-m07-hms-listing-observe = ["novarocks-connector-iceberg/mem-1-m07-hms-listing-observe", "novarocks-frontend-application/mem-1-m07-hms-listing-observe"]
mem-1-m07-closing-pressure = ["novarocks-frontend-application/mem-1-m07-closing-pressure"]
mem-1-m07-root-observation = ["novarocks-frontend-application/mem-1-m07-root-observation"]
mem-1-m07-exact-mysql-write = ["novarocks-frontend-application/mem-1-m07-exact-mysql-write"]
default = ["jemalloc"]
# jemalloc is the only supported production allocator. Building without this
# feature keeps the system allocator for same-revision baselines and for tools
# that require it; such a build is not a supported deployment.
jemalloc = ["dep:tikv-jemalloc-ctl", "dep:tikv-jemallocator"]
mv-first-refresh-staging-test-support = []
native-compatibility-test-fixture = ["novarocks-version/native-compatibility-test-fixture"]
# Debug-only candidate island for physical wire v2: every role in the binary
# composes the compiled-package static plan interpreter instead of the plan
# tree, on its own compatibility island. Only debug and dev-opt builds accept
# it; a build without debug assertions refuses it at compile time. No
# dependency may enable it, and the one-shot flip deletes it together with the
# plan-tree interpreter.
physical-wire-v2-candidate = ["dep:novarocks-arrow-ipc-frame", "dep:novarocks-plan-codec"]

[[test]]
name = "be_type_metadata_funding"
required-features = ["physical-wire-v2-candidate"]

[[test]]
name = "project_metadata_funding"
required-features = ["physical-wire-v2-candidate"]

[[test]]
name = "int64_shift_runtime_funding"
required-features = ["physical-wire-v2-candidate"]

[dev-dependencies]
novarocks-local-program.workspace = true
novarocks-execution = { workspace = true, features = ["test-support"] }
arrow.workspace = true
prost.workspace = true
novarocks-native-adapter = { workspace = true, features = ["test-support"] }
novarocks-plan-codec = { workspace = true, features = ["test-support"] }
novarocks-proto-models.workspace = true
novarocks-worker = { workspace = true, features = ["test-support"] }
arrow-schema.workspace = true
serde_json.workspace = true
# `server_binary_smoke` spawns the real `novarocks` binary and drives it over
# MySQL; `state_store_app_config` asserts config/composition by direct call.
# Domain behaviour belongs to its owner crate, the SQL suites or the system
# scenarios — not to this package.
mysql.workspace = true
novarocks-test-support.workspace = true
tempfile.workspace = true
