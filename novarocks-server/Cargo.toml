[package]
name = "novarocks-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "novarocks"
path = "src/main.rs"

[dependencies]
novarocks-backend.workspace = true
novarocks-connector-iceberg.workspace = true
novarocks-connector-paimon.workspace = true
novarocks-connector-iceberg-functions.workspace = true
novarocks-execution.workspace = true
novarocks-execution-contract.workspace = true
novarocks-failpoint.workspace = true
novarocks-frontend.workspace = true
novarocks-functions.workspace = true
novarocks-fs.workspace = true
novarocks-native-trust.workspace = true
novarocks-query-application.workspace = true
novarocks-secret.workspace = true
novarocks-spi.workspace = true
novarocks-state-store-api.workspace = true
novarocks-sql.workspace = true
novarocks-state-store-sqlite.workspace = true
novarocks-task-codec.workspace = true
novarocks-types.workspace = true
novarocks-version.workspace = true
novarocks-worker.workspace = true
anyhow.workspace = true
atty = "0.2"
chrono.workspace = true
libc.workspace = true
futures.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "time"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync", "time"] }
uuid.workspace = true

[features]
mv-first-refresh-staging-test-support = []
native-compatibility-test-fixture = ["novarocks-version/native-compatibility-test-fixture"]

[dev-dependencies]
# `server_binary_smoke` spawns the real `novarocks` binary and drives it over
# MySQL; `state_store_app_config` asserts config/composition by direct call.
# Domain behaviour belongs to its owner crate, the SQL suites or the system
# scenarios — not to this package.
bytes.workspace = true
mysql.workspace = true
novarocks-test-support.workspace = true
tempfile.workspace = true
