# Cargo dependency policy for the complete NovaRocks workspace.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
    # CDG-1 establishes policy without changing any resolved dependency identity.
    # Each existing advisory stays visible by exact ID and expires when its affected
    # package leaves the graph; any new advisory still fails closed.
    { id = "RUSTSEC-2026-0190", reason = "anyhow upgrade belongs to a dependency-owner follow-up; CDG-1 freezes the existing lock graph" },
    { id = "RUSTSEC-2021-0145", reason = "atty is retained by the server CLI; replacement belongs to a server-owner follow-up" },
    { id = "RUSTSEC-2024-0375", reason = "atty is retained by the server CLI; replacement belongs to a server-owner follow-up" },
    { id = "RUSTSEC-2026-0007", reason = "bytes upgrade belongs to a workspace dependency follow-up; CDG-1 freezes the existing lock graph" },
    { id = "RUSTSEC-2026-0204", reason = "crossbeam-epoch upgrade belongs to an upstream-owner follow-up; CDG-1 freezes the existing lock graph" },
    { id = "RUSTSEC-2026-0221", reason = "event-listener upgrade belongs to an upstream-owner follow-up; CDG-1 freezes the existing lock graph" },
    { id = "RUSTSEC-2026-0258", reason = "h2 upgrade belongs to a transport-owner follow-up; CDG-1 freezes the existing lock graph" },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12 is retained by the dev-only mysql client; replacement belongs to its owner" },
    { id = "RUSTSEC-2026-0253", reason = "both MySQL lru lines require an owner-reviewed upgrade outside CDG-1" },
    { id = "RUSTSEC-2026-0041", reason = "lz4_flex is controlled by ORC/Paimon upstreams; upgrade belongs to connector owners" },
    { id = "RUSTSEC-2024-0437", reason = "protobuf 2 is retained by prometheus; major upgrade belongs to observability owners" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml versions are controlled by Reqsign/OpenDAL; upgrade belongs to connector owners" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml versions are controlled by Reqsign/OpenDAL; upgrade belongs to connector owners" },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.8/0.9 upgrades belong to their direct and upstream dependency owners" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile replacement belongs to native-trust and connector transport owners" },
    { id = "RUSTSEC-2026-0049", reason = "rustls-webpki upgrade belongs to native-trust and connector transport owners" },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki upgrade belongs to native-trust and connector transport owners" },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki upgrade belongs to native-trust and connector transport owners" },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki upgrade belongs to native-trust and connector transport owners" },

    # Exact yanked identities already present in the accepted baseline. A different
    # yanked crate or version is not covered by these entries.
    { crate = "chacha20@0.10.1", reason = "transitive through FoundationDB/mysql_async rand 0.10; replace in an owner-reviewed upgrade" },
    { crate = "lz4_flex@0.11.5", reason = "transitive through ORC/Paimon; replace in a connector-owner upgrade" },
    { crate = "mysql_async@0.37.0", reason = "state-store provider dependency; replace in a state-store-owner upgrade" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
unused-allowed-license = "deny"
unused-license-exception = "deny"

[[licenses.exceptions]]
allow = ["LGPL-2.1-or-later"]
crate = "r-efi@5.3.0"

[[licenses.exceptions]]
allow = ["LGPL-2.1-or-later"]
crate = "r-efi@6.0.0"

[bans]
multiple-versions = "deny"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
skip = [
    # The SQL runner owns axum 0.8 while the FE/BE HTTP surfaces remain on 0.7.
    { crate = "axum@0.8.9", reason = "novarocks-sql-test-runner retains the axum 0.8 API in CDG-1" },
    { crate = "axum-core@0.5.6", reason = "transitive through the runner-owned axum 0.8 line" },
    { crate = "matchit@0.8.4", reason = "transitive through the runner-owned axum 0.8 line" },

    # Connector and MySQL stacks currently resolve distinct encoding/crypto lines.
    { crate = "base64@0.21.7", reason = "transitive through mysql_common 0.32" },
    { crate = "base64@0.23.1", reason = "transitive through the Paimon opendal-core line" },
    { crate = "block-buffer@0.12.1", reason = "transitive through opendal-core and digest 0.11" },
    { crate = "btoi@0.4.3", reason = "transitive through mysql_common 0.32" },
    { crate = "const-oid@0.9.6", reason = "transitive through the current DER stack" },
    { crate = "cpufeatures@0.3.0", reason = "transitive through foundationdb/mysql_async rand 0.10" },
    { crate = "crypto-common@0.2.2", reason = "transitive through opendal-core and digest 0.11" },
    { crate = "digest@0.11.3", reason = "transitive through opendal-core and md-5 0.11" },
    { crate = "md-5@0.11.0", reason = "transitive through opendal-core" },

    # Macro ecosystems are pinned by upstream provider versions.
    { crate = "darling@0.20.11", reason = "transitive through derive_builder and mysql-common-derive" },
    { crate = "darling_core@0.20.11", reason = "transitive through darling 0.20" },
    { crate = "darling_macro@0.20.11", reason = "transitive through darling 0.20" },
    { crate = "syn@3.0.5", reason = "transitive through the SQL runner clap derive line" },
    { crate = "thiserror@1.0.69", reason = "transitive through MySQL, Pilota, and Prometheus" },
    { crate = "thiserror-impl@1.0.69", reason = "transitive through thiserror 1" },
    { crate = "typed-builder@0.19.1", reason = "transitive through Paimon" },
    { crate = "typed-builder-macro@0.19.1", reason = "transitive through typed-builder 0.19" },

    # Allocator, collection, and randomness lines are selected by different upstreams.
    { crate = "foldhash@0.2.0", reason = "transitive through Arrow and hashbrown 0.17" },
    { crate = "getrandom@0.3.4", reason = "transitive through tempfile, mysql_common, and rand_core 0.9" },
    { crate = "getrandom@0.4.3", reason = "transitive through uuid and rand 0.10" },
    { crate = "hashbrown@0.12.3", reason = "transitive through indexmap 1" },
    { crate = "hashbrown@0.14.5", reason = "transitive through DashMap and execution collections" },
    { crate = "hashbrown@0.15.5", reason = "transitive through mysql lru 0.12" },
    { crate = "hashbrown@0.17.0", reason = "transitive through Arrow, Parquet, and lru 0.18" },
    { crate = "hermit-abi@0.1.19", reason = "transitive through the legacy atty dependency" },
    { crate = "indexmap@1.9.3", reason = "transitive through tonic tower 0.4" },
    { crate = "lru@0.12.5", reason = "transitive through the dev-only synchronous mysql client" },
    { crate = "r-efi@5.3.0", reason = "transitive through getrandom 0.3" },
    { crate = "rand@0.9.2", reason = "transitive through Avro, HDFS, and Volo" },
    { crate = "rand@0.10.2", reason = "transitive through FoundationDB and mysql_async" },
    { crate = "rand_chacha@0.9.0", reason = "transitive through rand 0.9" },
    { crate = "rand_core@0.9.3", reason = "transitive through rand 0.9" },
    { crate = "rand_core@0.10.1", reason = "transitive through rand 0.10" },

    # Storage and wire providers retain their upstream protocol/version families.
    { crate = "integer-encoding@3.0.4", reason = "transitive through the Apache Thrift stack" },
    { crate = "libloading@0.9.0", reason = "transitive through HDFS and Paimon" },
    { crate = "lz4_flex@0.13.0", reason = "transitive through Arrow IPC and Parquet" },
    { crate = "mysql_common@0.37.3", reason = "transitive through the mysql_async state-store provider" },
    { crate = "ordered-float@2.10.1", reason = "transitive through the Apache Thrift stack" },
    { crate = "prost@0.14.3", reason = "transitive through the HDFS provider" },
    { crate = "prost-derive@0.14.3", reason = "transitive through prost 0.14" },
    { crate = "prost-types@0.14.3", reason = "transitive through the HDFS provider" },
    { crate = "quick-xml@0.37.5", reason = "transitive through reqsign" },
    { crate = "quick-xml@0.38.4", reason = "transitive through OpenDAL 0.55" },
    { crate = "roaring@0.11.3", reason = "transitive through Iceberg and Paimon" },
    { crate = "snafu@0.8.9", reason = "transitive through orc-rust" },
    { crate = "snafu-derive@0.8.9", reason = "transitive through snafu 0.8" },
    { crate = "socket2@0.5.10", reason = "transitive through tonic, Volo, and the dev-only mysql client" },
    { crate = "tower@0.4.13", reason = "transitive through tonic 0.12" },
    { crate = "twox-hash@1.6.3", reason = "transitive through the dev-only synchronous mysql client" },

    # The benchmark intentionally validates toml 0.9 while product config stays on 0.8.
    { crate = "toml@0.9.8", reason = "owned by novarocks-datasketches-bench input parsing" },
    { crate = "serde_spanned@1.1.1", reason = "transitive through toml 0.9" },
    { crate = "toml_datetime@0.7.3", reason = "transitive through toml 0.9 and toml_edit 0.23" },
    { crate = "toml_edit@0.23.9", reason = "transitive through proc-macro-crate and toml 0.9" },

    # Windows support crates are split by upstream minimum-version ranges.
    { crate = "windows-sys@0.52.0", reason = "transitive through ring and socket2 0.5" },
    { crate = "windows-sys@0.60.2", reason = "transitive through dns-lookup" },
    { crate = "windows-targets@0.52.6", reason = "transitive through windows-sys 0.52" },
    { crate = "windows_aarch64_gnullvm@0.52.6", reason = "transitive through windows-targets 0.52" },
    { crate = "windows_aarch64_msvc@0.52.6", reason = "transitive through windows-targets 0.52" },
    { crate = "windows_i686_gnu@0.52.6", reason = "transitive through windows-targets 0.52" },
    { crate = "windows_i686_gnullvm@0.52.6", reason = "transitive through windows-targets 0.52" },
    { crate = "windows_i686_msvc@0.52.6", reason = "transitive through windows-targets 0.52" },
    { crate = "windows_x86_64_gnu@0.52.6", reason = "transitive through windows-targets 0.52" },
    { crate = "windows_x86_64_gnullvm@0.52.6", reason = "transitive through windows-targets 0.52" },
    { crate = "windows_x86_64_msvc@0.52.6", reason = "transitive through windows-targets 0.52" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unused-allowed-source = "deny"
